        NBDTLB[0].state: READY
        NBDTLB.entry[h0_v3].valid: true
        Atomic.reservation[h0_x].valid: false
        Atomic.line[h0_x].busy: false
        IOMSHR.busy: false
        ROB.entry[LR0].allocated: false
        ROB.entry[LR0].completed: false
        ROB.entry[LR0].faulted: false
        ROB.entry[LR0].squashed: false
        ROB.entry[LR0].committed: false
        ROB.entry[SC0].allocated: false
        ROB.entry[SC0].completed: false
        ROB.entry[SC0].faulted: false
        ROB.entry[SC0].squashed: false
        ROB.entry[SC0].committed: false
      final:
        NBDTLB[0].state: READY
        NBDTLB.entry[h0_v3].valid: true
        Atomic.reservation[h0_x].valid: false
        Atomic.line[h0_x].busy: false
        IOMSHR.busy: false
        ROB.entry[LR0].allocated: true
        ROB.entry[LR0].completed: true
        ROB.entry[LR0].faulted: false
        ROB.entry[LR0].squashed: false
        ROB.entry[LR0].committed: true
        ROB.entry[SC0].allocated: true
        ROB.entry[SC0].completed: true
        ROB.entry[SC0].faulted: false
        ROB.entry[SC0].squashed: false
        ROB.entry[SC0].committed: true
      steps:
      - cycle: 2
        before:
          NBDTLB[0].state: READY
          NBDTLB.entry[h0_v3].valid: true
          Atomic.reservation[h0_x].valid: false
          Atomic.line[h0_x].busy: false
          IOMSHR.busy: false
          ROB.entry[LR0].allocated: false
          ROB.entry[LR0].completed: false
          ROB.entry[LR0].faulted: false
          ROB.entry[LR0].squashed: false
          ROB.entry[LR0].committed: false
          ROB.entry[SC0].allocated: false
          ROB.entry[SC0].completed: false
          ROB.entry[SC0].faulted: false
          ROB.entry[SC0].squashed: false
          ROB.entry[SC0].committed: false
        after:
          NBDTLB[0].state: READY
          NBDTLB.entry[h0_v3].valid: true
          Atomic.reservation[h0_x].valid: false
          Atomic.line[h0_x].busy: false
          IOMSHR.busy: false
          ROB.entry[LR0].allocated: true
          ROB.entry[LR0].completed: false
          ROB.entry[LR0].faulted: false
          ROB.entry[LR0].squashed: false
          ROB.entry[LR0].committed: false
          ROB.entry[SC0].allocated: false
          ROB.entry[SC0].completed: false
          ROB.entry[SC0].faulted: false
          ROB.entry[SC0].squashed: false
          ROB.entry[SC0].committed: false
        active_requirements:
        - transformation.rob_allocates_memory_op_0.forward.0.lr_0.instance.0.rob_allocate_0.requirement.0
        active_updates:
        - transformation.rob_allocates_memory_op_0.forward.0.lr_0.instance.0.rob_allocate_0.update.0
        changes:
        - state: ROB.entry[LR0].allocated
          before: false
          after: true
          origins:
          - transformation.rob_allocates_memory_op_0.forward.0.lr_0.instance.0.rob_allocate_0.update.0
      - cycle: 3
        before:
          NBDTLB[0].state: READY
