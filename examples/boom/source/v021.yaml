acceptance:
  required_components: [LSU, L1D, MSHR, NBDTLB, ROB, InclusiveL2]
  forbidden_default_module_prefixes:
    - examples/boom/model/search/
  forbidden_query_tokens:
    - ldq_idx
    - stq_idx
    - mshr_id
    - TLBMiss
    - TLBHit
    - L1Hit
    - L1Miss
    - Probe
    - Grant
    - Acquire
    - expected_result
  completion_rule: >-
    v0.21 may be marked complete only when every behavior is executable,
    no behavior remains missing or needs-rework, the default composition uses
    no model/search module, and the public input contains no forbidden token.
