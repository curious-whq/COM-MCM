schema_version: umcm.module.v0.12.0
name: lsu
metadata:
  component: BOOM v4 LSU/LSQ
  version: 0.12.0
  parameterized: true
  source: user-supplied BOOM v4 LSU Chisel, 2183 lines
  source_sha256: 81d738e8c8967f0fad72a2406a623a384fac229e10c20ffa37a6907aece9b7b5
  scope: memory-order-relevant LDQ + STQ/SDQ + load/store retry + forwarding + LD-LD/ST-LD recovery + commit/drain + fence
    lifecycle
  abstractions:
  - circular queue head/tail and carry-bit age are represented by trace-bound entry identities plus same-hart program_index
    ordering
  - load/store retry queue capacity and repeated backpressure cycles are stutter-abstracted; retry identity is preserved explicitly
  - TLB page/access-fault causes, HellaCache shim, debug breakpoints, and performance counters are outside the current memory-order
    semantic surface
  - store-to-load and load-ordering effects are modeled; optional load-to-store register-data forwarding is abstracted because
    it does not alter the current memory-order relation set
