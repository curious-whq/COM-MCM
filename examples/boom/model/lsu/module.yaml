      outputs:
      - role: success
        type: LSU.LoadSucceeded
      when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: resp
          field: op_id
          sort:
            name: op_id
        right:
          node: literal
          sort:
            name: op_id
          value: ${load.op_id}
      output_when:
        node: nary
        op: and
        operands:
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: success
            field: op_id
            sort:
              name: op_id
          right:
            node: literal
            sort:
              name: op_id
            value: ${load.op_id}
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: success
            field: source
            sort:
              name: string
          right:
            node: literal
            sort:
              name: string
            value: mshr
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: success
          field: ldq_idx
          sort:
            name: bv
            width: 6
        right:
          node: event_field
          event_id: resp
          field: ldq_idx
          sort:
            name: bv
            width: 6
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: success
          field: address
          sort:
            name: address
            width: 64
        right:
          node: event_field
          event_id: resp
          field: address
          sort:
            name: address
            width: 64
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: success
          field: value
          sort:
            name: value
            width: 64
        right:
          node: event_field
          event_id: resp
          field: value
          sort:
            name: value
            width: 64
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: success
          field: cycle
          sort:
            name: int
        right:
          node: event_field
          event_id: resp
          field: cycle
          sort:
            name: int
      exact: true
    - name: executed_load_generates_ldld_search_${load.op_id}
      inputs:
      - role: exec
        type: LSU.LoadExecuted
      outputs:
      - role: search
        type: LSU.LDLDSearch
      when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: exec
          field: op_id
          sort:
            name: op_id
        right:
          node: literal
          sort:
            name: op_id
          value: ${load.op_id}
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: search
          field: searcher_op_id
          sort:
            name: op_id
        right:
          node: literal
          sort:
            name: op_id
          value: ${load.op_id}
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: search
          field: searcher_ldq_idx
          sort:
            name: bv
            width: 6
        right:
          node: event_field
          event_id: exec
          field: ldq_idx
          sort:
            name: bv
            width: 6
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: search
          field: address
          sort:
            name: address
            width: 64
        right:
          node: event_field
          event_id: exec
          field: address
          sort:
            name: address
            width: 64
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: search
          field: cycle
          sort:
            name: int
        right:
          node: event_field
          event_id: exec
          field: cycle
          sort:
            name: int
      exact: true
    - name: matching_release_marks_observed_${load.op_id}
      inputs:
      - role: release
        type: DCache.ProbeRelease
      outputs:
      - role: obs
        type: LSU.LoadObserved
      when:
        node: call
        function: same_block
        arguments:
        - node: event_field
          event_id: release
          field: address
          sort:
            name: address
            width: 64
        - node: literal
          sort:
            name: address
            width: 64
          value: ${load.address}
        sort:
          name: bool
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: obs
          field: op_id
          sort:
            name: op_id
        right:
          node: literal
          sort:
            name: op_id
          value: ${load.op_id}
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: obs
          field: ldq_idx
          sort:
            name: bv
            width: 6
        right:
          node: literal
          sort:
            name: bv
            width: 6
          value: ${load.ldq_idx}
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: obs
          field: address
          sort:
            name: address
            width: 64
        right:
          node: literal
          sort:
            name: address
            width: 64
          value: ${load.address}
      - node: binary
        op: ge
        left:
          node: event_field
          event_id: obs
          field: cycle
          sort:
            name: int
        right:
          node: event_field
          event_id: release
          field: cycle
          sort:
            name: int
      state_requirements:
      - state: LSU.ldq[${load.ldq_idx}].valid
        at: release
        op: eq
        value:
          node: literal
          sort:
            name: bool
          value: true
      - state: LSU.ldq[${load.ldq_idx}].addr_valid
        at: release
        op: eq
        value:
          node: literal
          sort:
            name: bool
          value: true
      - state: LSU.ldq[${load.ldq_idx}].addr_is_virtual
        at: release
        op: eq
        value:
          node: literal
          sort:
            name: bool
          value: false
      state_mode: guard
      exact: true
    - name: ldld_search_ends_executing_window_${load.op_id}
      inputs:
      - role: search
        type: LSU.LDLDSearch
      when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: search
          field: searcher_op_id
          sort:
            name: op_id
        right:
          node: literal
          sort:
            name: op_id
          value: ${load.op_id}
      state_updates:
      - state: LSU.ldq[${load.ldq_idx}].executing_now
        at: search
        value:
          node: literal
          sort:
            name: bool
          value: false
- over: local_stores
