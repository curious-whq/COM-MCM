      - {state: "L2.line[${line.line_id}].busy", at: release, op: eq, value: {node: literal, sort: {name: bool}, value: false}}
      state_updates:
      - {state: "L2.line[${line.line_id}].busy", at: release, value: {node: literal, sort: {name: bool}, value: true}}
      - {state: "L2.line[${line.line_id}].current_txn", at: release, value: {node: event_field, event_id: release, field: txn_id, sort: {name: op_id}}}
      - {state: "L2.line[${line.line_id}].state", at: release, value: {node: literal, sort: {name: string}, value: TIP}}
      - {state: "L2.line[${line.line_id}].owner", at: release, value: {node: literal, sort: {name: int}, value: -1}}
      - {state: "L2.line[${line.line_id}].h1_perm", at: release, value: {node: literal, sort: {name: string}, value: N}}
      exact: false

    - name: release_ack_support_${product.repeat_index}
      inputs: [{role: release, type: TL.Release}]
      outputs: [{role: ack, type: TL.ReleaseAck}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: release, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${eviction.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: release, field: line_id, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${line.line_id}"}}
      output_when: {node: binary, op: eq, left: {node: event_field, event_id: ack, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${eviction.txn_id}"}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: release, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: ack, field: cycle, sort: {name: int}}}
      exact: true

    - name: publish_release_data_${product.repeat_index}
      inputs: [{role: release, type: TL.Release}]
      outputs: [{role: publish, type: Coherence.VersionPublish}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: release, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${eviction.txn_id}"}}
        - {node: event_field, event_id: release, field: has_data, sort: {name: bool}}
      output_when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: publish, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${eviction.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: publish, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${eviction.hart}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: publish, field: path, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: ReleaseData}}
      ensure:
      - {node: binary, op: eq, left: {node: event_field, event_id: publish, field: value, sort: {name: value, width: 64}}, right: {node: event_field, event_id: release, field: value, sort: {name: value, width: 64}}}
      - {node: binary, op: eq, left: {node: event_field, event_id: publish, field: version, sort: {name: int}}, right: {node: event_field, event_id: release, field: version, sort: {name: int}}}
      - {node: binary, op: eq, left: {node: event_field, event_id: publish, field: source_op_id, sort: {name: op_id}}, right: {node: event_field, event_id: release, field: source_op_id, sort: {name: op_id}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: release, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: publish, field: cycle, sort: {name: int}}}
      exact: true
    - name: release_data_is_published_before_ack_${product.repeat_index}
      inputs: [{role: publish, type: Coherence.VersionPublish}, {role: ack, type: TL.ReleaseAck}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: publish, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${eviction.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: publish, field: path, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: ReleaseData}}
        - {node: binary, op: eq, left: {node: event_field, event_id: ack, field: txn_id, sort: {name: op_id}}, right: {node: event_field, event_id: publish, field: txn_id, sort: {name: op_id}}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: publish, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: ack, field: cycle, sort: {name: int}}}
    - name: release_ack_retires_eviction_${product.repeat_index}
      inputs: [{role: ack, type: TL.ReleaseAck}]
      when: {node: binary, op: eq, left: {node: event_field, event_id: ack, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${eviction.txn_id}"}}
      state_requirements:
      - {state: "L2.line[${line.line_id}].busy", at: ack, op: eq, value: {node: literal, sort: {name: bool}, value: true}}
      - {state: "L2.line[${line.line_id}].current_txn", at: ack, op: eq, value: {node: event_field, event_id: ack, field: txn_id, sort: {name: op_id}}}
      state_updates:
      - {state: "L2.line[${line.line_id}].busy", at: ack, value: {node: literal, sort: {name: bool}, value: false}}
