- over: probes
  as: probe
  include:
    state_variables:
    - {name: 'DCache.probe[${probe.source_op_id}].blocked', sort: {name: bool}, initial: false}
    slots:
    - &probe_meta_read_slot {id: 'probe_meta_read_${probe.repeat_index}', type: DCache.ProbeMetaRead, required: false, fields: {source_op_id: '${probe.source_op_id}', address: '${probe.address}', set_index: '${probe.set_index}', tag: '${probe.tag}', probe_param: '${probe.probe_param}'}}
    - {id: 'probe_meta_resp_${probe.repeat_index}', type: DCache.ProbeMetaResp, required: false, fields: {source_op_id: '${probe.source_op_id}', address: '${probe.address}', set_index: '${probe.set_index}', tag: '${probe.tag}', probe_param: '${probe.probe_param}'}}
    - {id: 'probe_mshr_check_${probe.repeat_index}', type: DCache.ProbeMSHRCheck, required: false, fields: {source_op_id: '${probe.source_op_id}', address: '${probe.address}', set_index: '${probe.set_index}', tag: '${probe.tag}', probe_param: '${probe.probe_param}'}}
    - {id: 'probe_retry_${probe.repeat_index}', type: DCache.ProbeRetry, required: false, fields: {source_op_id: '${probe.source_op_id}', address: '${probe.address}', set_index: '${probe.set_index}', tag: '${probe.tag}', reason: mshr-or-writeback-not-ready}}
    transformations:
    - name: 'probe_receive_to_meta_read_${probe.repeat_index}'
      inputs: [{role: receive, type: DCache.ProbeReceive}]
      outputs: [{role: meta_read, type: DCache.ProbeMetaRead}]
      when: &probe_receive_match {node: binary, op: eq, left: {node: event_field, event_id: receive, field: source_op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${probe.source_op_id}'}}
      output_when: {node: binary, op: eq, left: {node: event_field, event_id: meta_read, field: source_op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${probe.source_op_id}'}}
      ensure: [{node: binary, op: eq, left: {node: event_field, event_id: meta_read, field: cycle, sort: {name: int}}, right: {node: binary, op: add, left: {node: event_field, event_id: receive, field: cycle, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}}]
      exact: true
      tags: [probe-fsm, s_invalid-to-s_meta_read, source:dcache.scala:213-222]
    - name: 'probe_meta_read_to_resp_${probe.repeat_index}'
      inputs: [{role: meta_read, type: DCache.ProbeMetaRead}]
      outputs: [{role: meta_resp, type: DCache.ProbeMetaResp}]
      when: {node: binary, op: eq, left: {node: event_field, event_id: meta_read, field: source_op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${probe.source_op_id}'}}
      output_when: {node: binary, op: eq, left: {node: event_field, event_id: meta_resp, field: source_op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${probe.source_op_id}'}}
      ensure: [{node: binary, op: eq, left: {node: event_field, event_id: meta_resp, field: cycle, sort: {name: int}}, right: {node: binary, op: add, left: {node: event_field, event_id: meta_read, field: cycle, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}}]
      exact: true
      tags: [probe-fsm, s_meta_read-to-s_meta_resp, source:dcache.scala:220-225]
    - name: 'probe_meta_resp_to_mshr_check_${probe.repeat_index}'
      inputs: [{role: meta_resp, type: DCache.ProbeMetaResp}]
      outputs: [{role: check, type: DCache.ProbeMSHRCheck}]
      when: {node: binary, op: eq, left: {node: event_field, event_id: meta_resp, field: source_op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${probe.source_op_id}'}}
      output_when: {node: binary, op: eq, left: {node: event_field, event_id: check, field: source_op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${probe.source_op_id}'}}
      ensure: [{node: binary, op: eq, left: {node: event_field, event_id: check, field: cycle, sort: {name: int}}, right: {node: binary, op: add, left: {node: event_field, event_id: meta_resp, field: cycle, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}}]
      exact: true
      tags: [probe-fsm, s_meta_resp-to-s_mshr_req, source:dcache.scala:224-231]
    - name: 'probe_blocked_retries_${probe.repeat_index}'
      inputs: [{role: check, type: DCache.ProbeMSHRCheck}, {role: blocked, type: MSHR.ProbeBlocked}]
      outputs: [{role: retry, type: DCache.ProbeRetry}]
      when: {node: nary, op: and, operands: [{node: binary, op: eq, left: {node: event_field, event_id: check, field: source_op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${probe.source_op_id}'}}, {node: binary, op: eq, left: {node: event_field, event_id: check, field: address, sort: {name: address, width: 64}}, right: {node: event_field, event_id: blocked, field: address, sort: {name: address, width: 64}}}]}
      output_when: {node: binary, op: eq, left: {node: event_field, event_id: retry, field: source_op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${probe.source_op_id}'}}
      ensure: [{node: binary, op: lt, left: {node: event_field, event_id: check, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: retry, field: cycle, sort: {name: int}}}]
      state_updates: [{state: 'DCache.probe[${probe.source_op_id}].blocked', at: blocked, value: {node: literal, sort: {name: bool}, value: true}}]
      exact: true
      tags: [probe-fsm, retry, source:dcache.scala:227-232]

repeat_product:
- axes:
  - {over: requests, as: req}
  - {over: configs, as: config}
  include:
    transformations:
    - name: 'request_port_in_range_${req.repeat_index}_${config.repeat_index}'
      inputs: [{role: valid, type: LSU.DCacheReqValid}]
      outputs: []
      when: {node: binary, op: eq, left: {node: event_field, event_id: valid, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${req.op_id}'}}
      ensure: [{node: binary, op: lt, left: {node: event_field, event_id: valid, field: port, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: '${config.lsu_width}'}}]
      tags: [configuration, lsu-width, source:dcache.scala:454-455]

- axes:
  - {over: requests, as: req}
  - {over: sets, as: set}
