schema_version: umcm.module.v0.15.0
name: boom_dcache_v4
metadata:
  version: 0.21.0
  status: source-derived-bounded
  source:
    repository: https://github.com/riscv-boom/riscv-boom.git
    commit: 58ef2720eae13be26b3008c02b5a74ce29c61c44
    file: src/main/scala/v4/lsu/dcache.scala
    sha256: 82d5562b6d6220be5714716c6b935a001ed6fc54747b4fc925603cabbde9aac4
  configuration:
    family: BOOM-v4-four-way
    geometry: SmallBoom/MediumBoom-compatible
    width_and_banks: selected-by-DCache.ConfigInit
  abstraction:
  - Physical SRAM rows and ECC are represented by per-set, per-way tag/permission/value state.
  - A valid tag always has permission branch, trunk, or dirty; invalidation writes EMPTY_TAG and nothing together.
  - Decoupled stalls are stutter-abstracted, but the source priority order and s0/s1/s2 stage distance are preserved.
  - Cache blocks are line-granular; byte extraction and ECC correction do not affect the memory-order surface.
  - Store-hit data enters the ghost word state at the end of s2 so the source s3/s4/s5 bypass is visible to a next-cycle load; StoreDataWrite still records the physical s3 write one cycle later.
  hierarchy: Tag, permission, data-array, pipeline, nack-cause, and ProbeUnit events are private. LSU, MSHR, and TileLink-facing events are ports only.

ports:
- {name: config_init, direction: input, event_type: DCache.ConfigInit, required_connection: false}
- {name: lsu_req_valid, direction: input, event_type: LSU.DCacheReqValid, required_connection: false}
- {name: req_ready, direction: output, event_type: DCache.ReqReady, required_connection: false}
- {name: req_fire, direction: output, event_type: LSU.DCacheReqFire, required_connection: false}
- {name: load_response, direction: output, event_type: DCache.LoadResponse, required_connection: false}
- {name: request_nack, direction: output, event_type: DCache.RequestNack, required_connection: false}
- {name: load_nack, direction: output, event_type: DCache.LoadNack, required_connection: false}
- {name: store_ack, direction: output, event_type: DCache.StoreAck, required_connection: false}
- {name: probe_receive, direction: input, event_type: DCache.ProbeReceive, required_connection: false}
- {name: probe_release, direction: output, event_type: DCache.ProbeRelease, required_connection: false}
- {name: mshr_admission, direction: output, event_type: DCache.MSHRAdmissionRequest, required_connection: false}
- {name: mshr_request, direction: input, event_type: DCache.MSHRRequest, required_connection: false}
- {name: mshr_blocked, direction: input, event_type: MSHRFile.RequestBlocked, required_connection: false}
- {name: mshr_block_hit, direction: input, event_type: MSHRFile.BlockHit, required_connection: false}
- {name: mshr_replay, direction: input, event_type: MSHR.Replay, required_connection: false}
- {name: mshr_response, direction: input, event_type: MSHR.ResponseDequeue, required_connection: false}
- {name: mshr_meta_read, direction: input, event_type: MSHR.MetaReadRequest, required_connection: false}
- {name: mshr_meta_write, direction: input, event_type: MSHR.MetaWrite, required_connection: false}
- {name: mshr_refill_write, direction: input, event_type: MSHR.RefillWrite, required_connection: false}
- {name: mshr_writeback, direction: input, event_type: MSHR.WritebackRequest, required_connection: false}
- {name: mshr_probe_blocked, direction: input, event_type: MSHR.ProbeBlocked, required_connection: false}

internal_events:
- DCache.PipelineS1
- DCache.PipelineS2
- DCache.TagMatch
- DCache.TagMiss
- DCache.LoadHit
- DCache.StoreHit
- DCache.StoreAckCause
- DCache.StoreWriteCause
- DCache.StoreDataWrite
- DCache.ReplayS1
- DCache.ReplayS2
- DCache.NackCause
- DCache.DataBankConflict
- DCache.ProbeMetaRead
- DCache.ProbeMetaResp
- DCache.ProbeMSHRCheck
- DCache.ProbeRetry
- DCache.ProbeWriteback
- DCache.ProbeAck
- DCache.ProbeMetaWrite

slots: []
state_variables: []
transformations:
# metaReadArb priority: replay > probe > writeback > MSHR meta-read > LSU > prefetch.
# Ready may stutter past a busy cycle, but cannot coincide with an older arbiter input.
- &forbid_ready_replay
  name: ready_blocked_by_replay
  inputs: [{role: ready, type: DCache.ReqReady}, {role: contender, type: MSHR.Replay}]
  outputs: []
  when: &same_cycle
    {node: binary, op: eq, left: {node: event_field, event_id: ready, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: contender, field: cycle, sort: {name: int}}}
  ensure: [&false_expr {node: literal, sort: {name: bool}, value: false}]
  tags: [arbiter, priority-0, source:dcache.scala:533-540]
- name: ready_blocked_by_probe_meta_read
  inputs: [{role: ready, type: DCache.ReqReady}, {role: contender, type: DCache.ProbeMetaRead}]
  outputs: []
  when: *same_cycle
  ensure: [*false_expr]
  tags: [arbiter, priority-1, source:dcache.scala:585-595]
- name: ready_blocked_by_writeback
  inputs: [{role: ready, type: DCache.ReqReady}, {role: contender, type: MSHR.WritebackRequest}]
  outputs: []
  when: *same_cycle
  ensure: [*false_expr]
  tags: [arbiter, priority-2, source:dcache.scala:563-580]
- name: ready_blocked_by_mshr_meta_read
  inputs: [{role: ready, type: DCache.ReqReady}, {role: contender, type: MSHR.MetaReadRequest}]
  outputs: []
  when: *same_cycle
  ensure: [*false_expr]
  tags: [arbiter, priority-3, source:dcache.scala:552-557]
constraints: []

repeat:
- over: configs
  as: config
  include:
    transformations:
    - name: 'supported_four_way_geometry_${config.repeat_index}'
      inputs: [{role: init, type: DCache.ConfigInit}]
      outputs: []
      when: {node: binary, op: eq, left: {node: event_field, event_id: init, field: config_id, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: '${config.config_id}'}}
      ensure:
      - {node: binary, op: eq, left: {node: event_field, event_id: init, field: n_sets, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 64}}
      - {node: binary, op: eq, left: {node: event_field, event_id: init, field: n_ways, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 4}}
      - {node: binary, op: eq, left: {node: event_field, event_id: init, field: n_mshrs, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 2}}
      - {node: binary, op: lt, left: {node: literal, sort: {name: int}, value: 0}, right: {node: event_field, event_id: init, field: lsu_width, sort: {name: int}}}
      - {node: binary, op: lt, left: {node: literal, sort: {name: int}, value: 0}, right: {node: event_field, event_id: init, field: num_banks, sort: {name: int}}}
      tags: [configuration, source:config-mixins.scala:96-192]
    - name: 'one_wide_response_blocks_new_request_${config.repeat_index}'
      inputs: [{role: ready, type: DCache.ReqReady}, {role: contender, type: MSHR.ResponseDequeue}]
      outputs: []
      when: {node: nary, op: and, operands: [{node: binary, op: eq, left: {node: event_field, event_id: ready, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: contender, field: cycle, sort: {name: int}}}, {node: binary, op: eq, left: {node: literal, sort: {name: int}, value: '${config.lsu_width}'}, right: {node: literal, sort: {name: int}, value: 1}}]}
      ensure: [*false_expr]
      tags: [arbiter, one-wide-config, source:dcache.scala:508-512]

- over: sets
  as: set
  include:
    state_variables:
    - {name: 'DCache.set[${set.set_id}].replacement_way', sort: {name: int}, initial: '${set.replacement_way}'}
    - {name: 'DCache.set[${set.set_id}].way[0].tag', sort: {name: int}, initial: '${set.way0_tag}'}
    - {name: 'DCache.set[${set.set_id}].way[0].permission', sort: {name: string}, initial: '${set.way0_permission}'}
    - {name: 'DCache.set[${set.set_id}].way[0].value', sort: {name: value, width: 64}, initial: '${set.way0_value}'}
    - {name: 'DCache.set[${set.set_id}].way[1].tag', sort: {name: int}, initial: '${set.way1_tag}'}
    - {name: 'DCache.set[${set.set_id}].way[1].permission', sort: {name: string}, initial: '${set.way1_permission}'}
    - {name: 'DCache.set[${set.set_id}].way[1].value', sort: {name: value, width: 64}, initial: '${set.way1_value}'}
    - {name: 'DCache.set[${set.set_id}].way[2].tag', sort: {name: int}, initial: '${set.way2_tag}'}
    - {name: 'DCache.set[${set.set_id}].way[2].permission', sort: {name: string}, initial: '${set.way2_permission}'}
    - {name: 'DCache.set[${set.set_id}].way[2].value', sort: {name: value, width: 64}, initial: '${set.way2_value}'}
    - {name: 'DCache.set[${set.set_id}].way[3].tag', sort: {name: int}, initial: '${set.way3_tag}'}
    - {name: 'DCache.set[${set.set_id}].way[3].permission', sort: {name: string}, initial: '${set.way3_permission}'}
    - {name: 'DCache.set[${set.set_id}].way[3].value', sort: {name: value, width: 64}, initial: '${set.way3_value}'}
    transformations:
    - name: 'dynamic_mshr_meta_way0_${set.repeat_index}'
      inputs: [{role: write, type: MSHR.MetaWrite}]
      when: &dynamic_meta_way0 {node: nary, op: and, operands: [{node: binary, op: eq, left: {node: event_field, event_id: write, field: set_index, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: '${set.set_index}'}}, {node: binary, op: eq, left: {node: event_field, event_id: write, field: way_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 0}}]}
      state_updates: [{state: 'DCache.set[${set.set_id}].way[0].tag', at: write, value: {node: event_field, event_id: write, field: tag, sort: {name: int}}}, {state: 'DCache.set[${set.set_id}].way[0].permission', at: write, value: {node: event_field, event_id: write, field: permission, sort: {name: string}}}]
      tags: [mshr-meta-write, dynamic-interface, source:dcache.scala:499-505]
    - name: 'dynamic_mshr_meta_way1_${set.repeat_index}'
      inputs: [{role: write, type: MSHR.MetaWrite}]
      when: {node: nary, op: and, operands: [{node: binary, op: eq, left: {node: event_field, event_id: write, field: set_index, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: '${set.set_index}'}}, {node: binary, op: eq, left: {node: event_field, event_id: write, field: way_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}]}
      state_updates: [{state: 'DCache.set[${set.set_id}].way[1].tag', at: write, value: {node: event_field, event_id: write, field: tag, sort: {name: int}}}, {state: 'DCache.set[${set.set_id}].way[1].permission', at: write, value: {node: event_field, event_id: write, field: permission, sort: {name: string}}}]
      tags: [mshr-meta-write, dynamic-interface, source:dcache.scala:499-505]
    - name: 'dynamic_mshr_meta_way2_${set.repeat_index}'
      inputs: [{role: write, type: MSHR.MetaWrite}]
      when: {node: nary, op: and, operands: [{node: binary, op: eq, left: {node: event_field, event_id: write, field: set_index, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: '${set.set_index}'}}, {node: binary, op: eq, left: {node: event_field, event_id: write, field: way_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 2}}]}
      state_updates: [{state: 'DCache.set[${set.set_id}].way[2].tag', at: write, value: {node: event_field, event_id: write, field: tag, sort: {name: int}}}, {state: 'DCache.set[${set.set_id}].way[2].permission', at: write, value: {node: event_field, event_id: write, field: permission, sort: {name: string}}}]
      tags: [mshr-meta-write, dynamic-interface, source:dcache.scala:499-505]
    - name: 'dynamic_mshr_meta_way3_${set.repeat_index}'
      inputs: [{role: write, type: MSHR.MetaWrite}]
      when: {node: nary, op: and, operands: [{node: binary, op: eq, left: {node: event_field, event_id: write, field: set_index, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: '${set.set_index}'}}, {node: binary, op: eq, left: {node: event_field, event_id: write, field: way_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 3}}]}
      state_updates: [{state: 'DCache.set[${set.set_id}].way[3].tag', at: write, value: {node: event_field, event_id: write, field: tag, sort: {name: int}}}, {state: 'DCache.set[${set.set_id}].way[3].permission', at: write, value: {node: event_field, event_id: write, field: permission, sort: {name: string}}}]
      tags: [mshr-meta-write, dynamic-interface, source:dcache.scala:499-505]
    - name: 'dynamic_mshr_refill_way0_${set.repeat_index}'
      inputs: [{role: write, type: MSHR.RefillWrite}]
      when: &dynamic_refill_way0 {node: nary, op: and, operands: [{node: binary, op: eq, left: {node: event_field, event_id: write, field: set_index, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: '${set.set_index}'}}, {node: binary, op: eq, left: {node: event_field, event_id: write, field: way_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 0}}]}
      state_updates: [{state: 'DCache.set[${set.set_id}].way[0].value', at: write, value: {node: event_field, event_id: write, field: value, sort: {name: value, width: 64}}}]
      tags: [mshr-refill-write, dynamic-interface, source:dcache.scala:457-479]
    - name: 'dynamic_mshr_refill_way1_${set.repeat_index}'
      inputs: [{role: write, type: MSHR.RefillWrite}]
      when: {node: nary, op: and, operands: [{node: binary, op: eq, left: {node: event_field, event_id: write, field: set_index, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: '${set.set_index}'}}, {node: binary, op: eq, left: {node: event_field, event_id: write, field: way_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}]}
      state_updates: [{state: 'DCache.set[${set.set_id}].way[1].value', at: write, value: {node: event_field, event_id: write, field: value, sort: {name: value, width: 64}}}]
      tags: [mshr-refill-write, dynamic-interface, source:dcache.scala:457-479]
    - name: 'dynamic_mshr_refill_way2_${set.repeat_index}'
      inputs: [{role: write, type: MSHR.RefillWrite}]
      when: {node: nary, op: and, operands: [{node: binary, op: eq, left: {node: event_field, event_id: write, field: set_index, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: '${set.set_index}'}}, {node: binary, op: eq, left: {node: event_field, event_id: write, field: way_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 2}}]}
      state_updates: [{state: 'DCache.set[${set.set_id}].way[2].value', at: write, value: {node: event_field, event_id: write, field: value, sort: {name: value, width: 64}}}]
      tags: [mshr-refill-write, dynamic-interface, source:dcache.scala:457-479]
    - name: 'dynamic_mshr_refill_way3_${set.repeat_index}'
      inputs: [{role: write, type: MSHR.RefillWrite}]
      when: {node: nary, op: and, operands: [{node: binary, op: eq, left: {node: event_field, event_id: write, field: set_index, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: '${set.set_index}'}}, {node: binary, op: eq, left: {node: event_field, event_id: write, field: way_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 3}}]}
      state_updates: [{state: 'DCache.set[${set.set_id}].way[3].value', at: write, value: {node: event_field, event_id: write, field: value, sort: {name: value, width: 64}}}]
      tags: [mshr-refill-write, dynamic-interface, source:dcache.scala:457-479]

- over: requests
  as: req
  include:
    state_variables:
    - {name: 'DCache.request[${req.op_id}].pre_s2_nacked', sort: {name: bool}, initial: false}
    slots:
    - {id: 'ready_${req.repeat_index}', type: DCache.ReqReady, required: false, fields: {op_id: '${req.op_id}', port: '${req.port}'}}
    - id: 'fire_${req.repeat_index}'
      type: LSU.DCacheReqFire
      required: false
      fields: &request_fields {op_id: '${req.op_id}', ldq_idx: '${req.ldq_idx}', stq_idx: '${req.stq_idx}', queue_kind: '${req.queue_kind}', queue_idx: '${req.queue_idx}', address: '${req.address}', block_address: '${req.block_address}', set_index: '${req.set_index}', tag: '${req.tag}', bank: '${req.bank}', port: '${req.port}', mem_kind: '${req.mem_kind}', value: '${req.value}'}
    - {id: 's1_${req.repeat_index}', type: DCache.PipelineS1, required: false, fields: *request_fields}
    - {id: 's2_${req.repeat_index}', type: DCache.PipelineS2, required: false, fields: *request_fields}
    - {id: 'nack_cause_bank_${req.repeat_index}', type: DCache.NackCause, required: false, fields: {op_id: '${req.op_id}', address: '${req.address}', port: '${req.port}', reason: data-bank-conflict}}
    - {id: 'nack_cause_probe_${req.repeat_index}', type: DCache.NackCause, required: false, fields: {op_id: '${req.op_id}', address: '${req.address}', port: '${req.port}', reason: probe-meta-write-conflict}}
    - {id: 'nack_cause_victim_${req.repeat_index}', type: DCache.NackCause, required: false, fields: {op_id: '${req.op_id}', address: '${req.address}', port: '${req.port}', reason: mshr-block-hit}}
    - {id: 'nack_cause_wb_${req.repeat_index}', type: DCache.NackCause, required: false, fields: {op_id: '${req.op_id}', address: '${req.address}', port: '${req.port}', reason: writeback-set-conflict}}
    - {id: 'nack_cause_mshr_${req.repeat_index}', type: DCache.NackCause, required: false, fields: {op_id: '${req.op_id}', address: '${req.address}', port: '${req.port}', reason: mshr-not-ready}}
    - {id: 'request_nack_bank_${req.repeat_index}', type: DCache.RequestNack, required: false, fields: {op_id: '${req.op_id}', queue_kind: '${req.queue_kind}', queue_idx: '${req.queue_idx}', address: '${req.address}', port: '${req.port}', reason: data-bank-conflict}}
    - {id: 'request_nack_probe_${req.repeat_index}', type: DCache.RequestNack, required: false, fields: {op_id: '${req.op_id}', queue_kind: '${req.queue_kind}', queue_idx: '${req.queue_idx}', address: '${req.address}', port: '${req.port}', reason: probe-meta-write-conflict}}
    - {id: 'request_nack_victim_${req.repeat_index}', type: DCache.RequestNack, required: false, fields: {op_id: '${req.op_id}', queue_kind: '${req.queue_kind}', queue_idx: '${req.queue_idx}', address: '${req.address}', port: '${req.port}', reason: mshr-block-hit}}
    - {id: 'request_nack_wb_${req.repeat_index}', type: DCache.RequestNack, required: false, fields: {op_id: '${req.op_id}', queue_kind: '${req.queue_kind}', queue_idx: '${req.queue_idx}', address: '${req.address}', port: '${req.port}', reason: writeback-set-conflict}}
    - {id: 'request_nack_mshr_${req.repeat_index}', type: DCache.RequestNack, required: false, fields: {op_id: '${req.op_id}', queue_kind: '${req.queue_kind}', queue_idx: '${req.queue_idx}', address: '${req.address}', port: '${req.port}', reason: mshr-not-ready}}
    - {id: 'load_nack_${req.repeat_index}', type: DCache.LoadNack, required: false, fields: {op_id: '${req.op_id}', ldq_idx: '${req.ldq_idx}', address: '${req.address}', port: '${req.port}'}}
    - {id: 'load_response_${req.repeat_index}', type: DCache.LoadResponse, required: false, fields: {op_id: '${req.op_id}', ldq_idx: '${req.ldq_idx}', address: '${req.address}', port: '${req.port}', set_index: '${req.set_index}'}}
    - {id: 'store_ack_${req.repeat_index}', type: DCache.StoreAck, required: false, fields: {op_id: '${req.op_id}', stq_idx: '${req.stq_idx}', address: '${req.address}', set_index: '${req.set_index}'}}
    - {id: 'store_ack_hit_cause_${req.repeat_index}', type: DCache.StoreAckCause, required: false, fields: {op_id: '${req.op_id}', path: hit}}
    - {id: 'store_ack_miss_cause_${req.repeat_index}', type: DCache.StoreAckCause, required: false, fields: {op_id: '${req.op_id}', path: mshr-accept}}
    transformations:
    - name: 'request_can_wait_for_ready_${req.repeat_index}'
      inputs: [{role: valid, type: LSU.DCacheReqValid}]
      outputs: [{role: ready, type: DCache.ReqReady}]
      when: &valid_for_req {node: binary, op: eq, left: {node: event_field, event_id: valid, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${req.op_id}'}}
      output_when: {node: binary, op: eq, left: {node: event_field, event_id: ready, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${req.op_id}'}}
      ensure:
      - {node: binary, op: le, left: {node: event_field, event_id: valid, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: ready, field: cycle, sort: {name: int}}}
      exact: true
      tags: [s0, ready, source:dcache.scala:508-518]
    - name: 'request_fire_${req.repeat_index}'
      inputs: [{role: valid, type: LSU.DCacheReqValid}, {role: ready, type: DCache.ReqReady}]
      outputs: [{role: fire, type: LSU.DCacheReqFire}]
      when: {node: nary, op: and, operands: [*valid_for_req, {node: binary, op: eq, left: {node: event_field, event_id: ready, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${req.op_id}'}}]}
      output_when: {node: binary, op: eq, left: {node: event_field, event_id: fire, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${req.op_id}'}}
      ensure:
      - {node: binary, op: eq, left: {node: event_field, event_id: fire, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: ready, field: cycle, sort: {name: int}}}
      exact: true
      tags: [s0, fire, source:dcache.scala:612-631]
    - name: 's0_to_s1_${req.repeat_index}'
      inputs: [{role: fire, type: LSU.DCacheReqFire}]
      outputs: [{role: s1, type: DCache.PipelineS1}]
      when: {node: binary, op: eq, left: {node: event_field, event_id: fire, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${req.op_id}'}}
