      when: {node: nary, op: and, operands: [{node: binary, op: eq, left: {node: event_field, event_id: winner_ready, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${winner.op_id}'}}, {node: binary, op: eq, left: {node: event_field, event_id: victim_ready, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: '${victim.op_id}'}}, {node: binary, op: eq, left: {node: literal, sort: {name: int}, value: '${winner.source_cycle}'}, right: {node: literal, sort: {name: int}, value: '${victim.source_cycle}'}}]}
