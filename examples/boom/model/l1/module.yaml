schema_version: umcm.module.v0.15.0
name: dcache
metadata:
  variant: shared
  source: BOOM v4 non-blocking DCache and ProbeUnit abstraction
  parameterized: true
  template_parameters:
  - older_load.op_id
  - older_load.address
  - older_load.ldq_idx
  - older_load.mshr_id
  - younger_load.op_id
  - younger_load.ldq_idx
  - visible_store.op_id
  - visible_store.value
  - init_write.value
  version: 0.15.0
  source_sha256: 82d5562b6d6220be5714716c6b935a001ed6fc54747b4fc925603cabbde9aac4
  status: 'formalized boundary: hit/miss are L1-private; LSU sees only request/response/nack/release'
  hierarchy: all persistent state and pipeline outcome events are private; declared ports are the public surface
ports:
- name: lsu_req_valid
  direction: input
  event_type: LSU.DCacheReqValid
- name: req_ready
  direction: output
  event_type: DCache.ReqReady
- name: req_fire
  direction: output
  event_type: LSU.DCacheReqFire
- name: load_response
  direction: output
  event_type: DCache.LoadResponse
- name: load_nack
  direction: output
  event_type: DCache.LoadNack
- name: probe_receive
  direction: input
  event_type: DCache.ProbeReceive
- name: probe_release
  direction: output
  event_type: DCache.ProbeRelease
- name: long_latency_response
  direction: output
  event_type: DCache.LongLatencyLoadResponse
- name: mshr_request
  direction: output
  event_type: DCache.MSHRRequest
- name: mshr_response
  direction: input
  event_type: MSHR.ResponseDequeue
slots:
- id: dcache_req_ready_0
  type: DCache.ReqReady
  required: false
  fields:
    port: 0
  cycle: 12
  annotations:
    role: interface_ready
- id: dcache_req_fire_0
  type: LSU.DCacheReqFire
  required: true
  fields:
    op_id: ${older_load.op_id}
    ldq_idx: ${older_load.ldq_idx}
    address: ${older_load.address}
    port: 0
  cycle: 12
  annotations:
    role: query_goal
- id: younger_dcache_req_ready
  type: DCache.ReqReady
  required: false
  fields:
    port: 0
  cycle: 4
- id: younger_dcache_req_fire
  type: LSU.DCacheReqFire
  required: false
  fields:
    op_id: ${younger_load.op_id}
    ldq_idx: ${younger_load.ldq_idx}
    address: ${older_load.address}
    port: 0
  cycle: 4
- id: younger_dcache_hit
  type: DCache.LoadHit
  required: false
  fields:
    op_id: ${younger_load.op_id}
    ldq_idx: ${younger_load.ldq_idx}
    address: ${older_load.address}
    value: 0
    port: 0
  cycle: 6
- id: younger_dcache_response
  type: DCache.LoadResponse
  required: false
  fields:
    op_id: ${younger_load.op_id}
    ldq_idx: ${younger_load.ldq_idx}
    address: ${older_load.address}
    value: 0
    port: 0
  cycle: 7
- id: probe_receive
  type: DCache.ProbeReceive
  required: false
  fields:
    source_op_id: ${visible_store.op_id}
    address: ${older_load.address}
  cycle: 9
- id: probe_release
  type: DCache.ProbeRelease
  required: false
  fields:
    source_op_id: ${visible_store.op_id}
    address: ${older_load.address}
  cycle: 10
- id: younger_dcache_nack
  type: DCache.LoadNack
  required: false
  fields:
    op_id: ${younger_load.op_id}
    ldq_idx: ${younger_load.ldq_idx}
    address: ${older_load.address}
    port: 0
  cycle: 6
- id: older_dcache_miss
  type: DCache.LoadMiss
  required: false
  cycle: 14
  fields:
    op_id: ${older_load.op_id}
    ldq_idx: ${older_load.ldq_idx}
    address: ${older_load.address}
    port: 0
  annotations:
    role: selected_miss_path
- id: older_long_latency_response
  type: DCache.LongLatencyLoadResponse
  required: false
  cycle: 18
  fields:
    mshr_id: ${older_load.mshr_id}
    op_id: ${older_load.op_id}
    ldq_idx: ${older_load.ldq_idx}
    address: ${older_load.address}
    value: 1
- id: older_mshr_request
  type: DCache.MSHRRequest
  required: false
  cycle: 14
  fields:
    op_id: ${older_load.op_id}
    queue_kind: ldq
    queue_idx: ${older_load.ldq_idx}
    address: ${older_load.address}
    value: 0
    mem_kind: load
    mshr_id: ${older_load.mshr_id}
    tag_match: false
    old_line_dirty: false
    needs_acquire: true
    grant_has_data: true
    secondary: false
    requires_second_acquire: false
    is_hit_again: false
    is_probe: false
    sdq_id: 0
  annotations:
    role: mshr_file_request
state_variables:
- name: DCache.probe.pending
  sort:
    name: bool
  initial: false
- name: DCache.probe.address
  sort:
    name: address
    width: 64
  initial: EMPTY_ADDR
- name: DCache.probe.source_op_id
  sort:
    name: op_id
  initial: EMPTY
transformations:
- name: dcache_request_acceptance
  inputs:
  - role: valid
    type: LSU.DCacheReqValid
  - role: ready
    type: DCache.ReqReady
  outputs:
  - role: fire
    type: LSU.DCacheReqFire
  when:
    node: nary
    op: and
    operands:
    - node: binary
      op: eq
      left:
        node: event_field
        event_id: valid
        field: cycle
        sort:
          name: int
      right:
        node: event_field
        event_id: ready
        field: cycle
        sort:
          name: int
    - node: binary
      op: eq
      left:
        node: event_field
        event_id: valid
        field: port
        sort:
          name: int
      right:
        node: event_field
        event_id: ready
        field: port
        sort:
          name: int
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: valid
      field: address
      sort:
        name: address
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: port
      sort:
        name: int
    right:
      node: event_field
      event_id: valid
      field: port
      sort:
        name: int
  exact: true
  description: At one cycle and port, request valid plus receiver ready emits the accepted-request event. exact=true also
    requires every observed fire to be justified by such a valid/ready transition.
  tags:
  - interface-transition
  - definition
- name: accepted_younger_request_reaches_private_hit
  inputs:
  - role: request
    type: LSU.DCacheReqFire
  outputs:
  - role: outcome
    type: DCache.LoadHit
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: op_id
      sort: &id001
        name: op_id
    right:
      node: literal
      sort: *id001
      value: ${younger_load.op_id}
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: op_id
      sort: *id001
    right:
      node: event_field
      event_id: outcome
      field: op_id
      sort: *id001
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: ldq_idx
      sort: &id002
        name: bv
        width: 6
    right:
      node: event_field
      event_id: outcome
      field: ldq_idx
      sort: *id002
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: address
      sort: &id003
        name: address
        width: 64
    right:
      node: event_field
      event_id: outcome
      field: address
      sort: *id003
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: port
      sort: &id004
        name: int
    right:
      node: event_field
      event_id: outcome
      field: port
      sort: *id004
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: request
      field: cycle
      sort: *id004
    right:
      node: event_field
      event_id: outcome
      field: cycle
      sort: *id004
  description: L1-private s1/s2 outcome derived from an accepted cache request; no LSU internal state is read.
  tags:
  - l1-private
  - s0-s1-s2
  - hit
- name: successful_younger_hit_produces_response
  inputs:
  - role: hit
    type: DCache.LoadHit
  outputs:
  - role: response
    type: DCache.LoadResponse
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: hit
      field: op_id
      sort:
        name: op_id
    right:
      node: literal
      sort:
        name: op_id
      value: ${younger_load.op_id}
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: hit
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: response
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: hit
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: response
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: hit
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: response
      field: address
      sort:
        name: address
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: hit
      field: value
      sort:
        name: value
        width: 64
    right:
      node: event_field
      event_id: response
      field: value
      sort:
        name: value
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: hit
      field: port
      sort:
        name: int
    right:
      node: event_field
      event_id: response
      field: port
      sort:
        name: int
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: hit
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: response
      field: cycle
      sort:
        name: int
  exact: true
  tags:
  - dcache-hit
  - response
- name: private_nack_requires_prior_accepted_request
  inputs:
  - role: nack
    type: DCache.LoadNack
  outputs:
  - role: request
    type: LSU.DCacheReqFire
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: nack
      field: op_id
      sort: &id005
        name: op_id
    right:
      node: literal
      sort: *id005
      value: ${younger_load.op_id}
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: nack
      field: op_id
      sort: *id005
    right:
      node: event_field
      event_id: request
      field: op_id
      sort: *id005
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: nack
      field: ldq_idx
      sort: &id006
        name: bv
        width: 6
    right:
      node: event_field
      event_id: request
      field: ldq_idx
      sort: *id006
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: nack
      field: address
      sort: &id007
        name: address
        width: 64
    right:
      node: event_field
      event_id: request
      field: address
      sort: *id007
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: nack
      field: port
      sort: &id008
        name: int
    right:
      node: event_field
      event_id: request
      field: port
      sort: *id008
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: request
      field: cycle
      sort: *id008
    right:
      node: event_field
      event_id: nack
      field: cycle
      sort: *id008
  description: A chosen L1 nack must be justified by a prior accepted request; nacks are optional outcomes, not liveness.
  tags:
  - l1-private
  - s2
  - nack
  - causal-support
- name: probe_receive_captures_pending_request
  inputs:
  - role: probe
    type: DCache.ProbeReceive
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_requirements:
  - state: DCache.probe.pending
    at: probe
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: false
  state_updates:
  - state: DCache.probe.pending
    at: probe
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: DCache.probe.address
    at: probe
    value:
      node: event_field
      event_id: probe
      field: address
      sort:
        name: address
        width: 64
  - state: DCache.probe.source_op_id
    at: probe
    value:
      node: event_field
      event_id: probe
      field: source_op_id
      sort:
        name: op_id
  tags:
  - state
  - probe-unit
- name: probe_release_requires_received_probe
  inputs:
  - role: release
    type: DCache.ProbeRelease
  outputs:
  - role: probe
    type: DCache.ProbeReceive
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: release
      field: source_op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: probe
      field: source_op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: release
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: probe
      field: address
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: probe
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: release
      field: cycle
      sort:
        name: int
  state_requirements:
  - state: DCache.probe.pending
    at: release
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: DCache.probe.address
    at: release
    op: eq
    value:
      node: event_field
      event_id: release
      field: address
      sort:
        name: address
        width: 64
  - state: DCache.probe.source_op_id
    at: release
    op: eq
    value:
      node: event_field
      event_id: release
      field: source_op_id
      sort:
        name: op_id
  state_updates:
  - state: DCache.probe.pending
    at: release
    value:
      node: literal
      sort:
        name: bool
      value: false
  tags:
  - state
  - probe-unit
  - interface
- name: accepted_older_request_reaches_private_miss
  inputs:
  - role: request
    type: LSU.DCacheReqFire
  outputs:
  - role: outcome
    type: DCache.LoadMiss
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: op_id
      sort: *id001
    right:
      node: literal
      sort: *id001
      value: ${older_load.op_id}
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: op_id
      sort: *id001
    right:
      node: event_field
      event_id: outcome
      field: op_id
      sort: *id001
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: ldq_idx
      sort: *id002
    right:
      node: event_field
      event_id: outcome
      field: ldq_idx
      sort: *id002
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: address
      sort: *id003
    right:
      node: event_field
      event_id: outcome
      field: address
      sort: *id003
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: port
      sort: *id004
    right:
      node: event_field
      event_id: outcome
      field: port
      sort: *id004
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: request
      field: cycle
      sort: *id004
    right:
      node: event_field
      event_id: outcome
      field: cycle
      sort: *id004
  description: L1-private s1/s2 outcome derived from an accepted cache request; no LSU internal state is read.
  tags:
  - l1-private
  - s0-s1-s2
  - miss
- name: load_miss_enters_mshr_file
  inputs:
  - role: miss
    type: DCache.LoadMiss
  outputs:
  - role: request
    type: DCache.MSHRRequest
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: miss
      field: op_id
      sort: &id009
        name: op_id
    right:
      node: literal
      sort: *id009
      value: ${older_load.op_id}
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: miss
      field: op_id
      sort: *id009
    right:
      node: event_field
      event_id: request
      field: op_id
      sort: *id009
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: miss
      field: address
      sort: &id010
        name: address
        width: 64
    right:
      node: event_field
      event_id: request
      field: address
      sort: *id010
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: miss
      field: cycle
      sort: &id011
        name: int
    right:
      node: event_field
      event_id: request
      field: cycle
      sort: *id011
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: mshr_id
      sort: *id011
    right:
      node: literal
      sort: *id011
      value: ${older_load.mshr_id}
  exact: true
  tags:
  - l1-mshr-interface
- name: mshr_response_queue_to_lsu_long_latency
  inputs:
  - role: response
    type: MSHR.ResponseDequeue
  outputs:
  - role: ll
    type: DCache.LongLatencyLoadResponse
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: response
      field: op_id
      sort: *id009
    right:
      node: literal
      sort: *id009
      value: ${older_load.op_id}
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: response
      field: mshr_id
      sort: *id011
    right:
      node: event_field
      event_id: ll
      field: mshr_id
      sort: *id011
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: response
      field: op_id
      sort: *id009
    right:
      node: event_field
      event_id: ll
      field: op_id
      sort: *id009
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: ll
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: literal
      sort:
        name: bv
        width: 6
      value: ${older_load.ldq_idx}
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: response
      field: address
      sort: *id010
    right:
      node: event_field
      event_id: ll
      field: address
      sort: *id010
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: response
      field: value
      sort: &id012
        name: value
        width: 64
    right:
      node: event_field
      event_id: ll
      field: value
      sort: *id012
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: response
      field: cycle
      sort: *id011
    right:
      node: event_field
      event_id: ll
      field: cycle
      sort: *id011
  exact: true
  output_when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: ll
      field: op_id
      sort: *id009
    right:
      node: literal
      sort: *id009
      value: ${older_load.op_id}
  tags:
  - mshr-response-queue
  - l1-lsu-interface
constraints: []
internal_events:
- DCache.LoadHit
- DCache.LoadMiss
