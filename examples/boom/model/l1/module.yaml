  event_type: DCache.LoadResponse
  required_connection: false
- name: load_nack
  direction: output
  event_type: DCache.LoadNack
  required_connection: false
- name: load_miss
  direction: output
  event_type: DCache.LoadMiss
  required_connection: false
- name: store_ack
  direction: output
  event_type: DCache.StoreAck
  required_connection: false
- name: mshr_request
  direction: output
  event_type: DCache.MSHRRequest
  required_connection: false
- name: mshr_replay
  direction: input
  event_type: MSHR.Replay
  required_connection: false
- name: mshr_response
  direction: input
  event_type: MSHR.ResponseDequeue
  required_connection: false
- name: mshr_refill
  direction: input
  event_type: MSHR.RefillWrite
  required_connection: false
- name: mshr_meta_write
  direction: input
  event_type: MSHR.MetaWrite
  required_connection: false
- name: mshr_wb_request
  direction: input
  event_type: MSHR.WritebackRequest
  required_connection: false
- name: long_latency_response
  direction: output
  event_type: DCache.LongLatencyLoadResponse
  required_connection: false
- name: probe_receive
  direction: input
  event_type: DCache.ProbeReceive
  required_connection: false
- name: probe_release
  direction: output
  event_type: DCache.ProbeRelease
  required_connection: false
- name: ordered
  direction: output
  event_type: DCache.Ordered
  required_connection: false
- name: branch_kill
  direction: input
  event_type: Core.BranchKill
  required_connection: false
- name: exception
  direction: input
  event_type: Core.Exception
  required_connection: false
slots: []
state_variables:
- name: L1.probe.busy
  sort: &id001
    name: bool
  initial: false
- name: L1.probe.address
  sort: &id002
    name: address
    width: 64
  initial: EMPTY_ADDR
- name: L1.writeback.busy
  sort: *id001
  initial: false
- name: L1.lrsc.valid
  sort: *id001
  initial: false
- name: L1.lrsc.address
  sort: *id002
  initial: EMPTY_ADDR
transformations:
- name: l1_ordered_local_quiescence
  inputs: []
  outputs:
  - role: ordered
    type: DCache.Ordered
  when:
    node: literal
    sort:
      name: bool
    value: true
  output_when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  exact: true
  description: Local half of io.lsu.ordered; MSHR fence_rdy is checked by the MSHR model/composition boundary.
  tags:
  - l1
  - fence
  - source:941
  state_requirements:
  - state: L1.probe.busy
    at: ordered
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: false
  - state: L1.writeback.busy
    at: ordered
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: false
  state_mode: guard
constraints: []
repeat:
