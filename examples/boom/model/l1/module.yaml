schema_version: umcm.module.v0.14.0
name: dcache
metadata:
  variant: formal-l1
  source: BOOM v4 BoomNonBlockingDCache + ProbeUnit + WritebackUnit
  parameterized: true
  version: 0.14.0
  abstraction: Memory-order-relevant request pipeline, nack taxonomy, MSHR interfaces, ProbeUnit and WritebackUnit; SRAM bits/replacement internals
    abstracted.
ports:
- name: lsu_req_valid
  direction: input
  event_type: LSU.DCacheReqValid
  required_connection: false
- name: req_ready
  direction: output
  event_type: DCache.ReqReady
  required_connection: false
- name: req_fire
