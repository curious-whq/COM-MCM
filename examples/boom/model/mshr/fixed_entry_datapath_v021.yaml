  abstraction:
  - Two fixed entry IDs match the Small/Medium BOOM nMSHRs=2 configuration.
  - Refill beats are collapsed to one line value while preserving Acquire, GrantData, meta write, data refill, RPQ response and GrantAck order.
  - Entry allocation/readiness and RPQ/SDQ lifetime are owned by boom_mshr_entry_frontend_v021; this child starts only from its public PrimaryAccept.
  - Store replay retains the selected SDQ value and fixed way, but cache-line beats and byte masks are collapsed to one bounded line write.
  hierarchy: TileLink and L1/LSU response messages are public interfaces; line-buffer progress is private.
