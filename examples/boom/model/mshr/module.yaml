      event_id: acquire
      field: mshr_id
      sort:
        name: int
    right:
      node: event_field
      event_id: accept
      field: mshr_id
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: acquire
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: accept
