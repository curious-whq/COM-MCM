schema_version: umcm.module.v0.15.0
name: mshr
metadata:
  variant: shared
  version: 0.15.0
  parameterized: true
  source: BOOM v4 BoomMSHR/BoomMSHRFile/IOMSHR
  scope: Memory-order-relevant primary/secondary miss, RPQ, SDQ, refill, replay, response
    queue, writeback/finish and MMIO behavior.
  abstractions:
  - refill beats summarized by RefillComplete
  - RPQ occupancy represented per bounded request
  - prefetch path excluded from v0.13 memory-order surface
  source_sha256: 7e70d1a095f9543ecb20c2983e925205ef473376fe7e6112173d7e8079069fcf
  hierarchy: all persistent state and transformations are private; declared ports
    are the public surface
ports:
- name: request
  direction: input
  event_type: DCache.MSHRRequest
  required_connection: false
- name: branch_kill
  direction: input
  event_type: Core.BranchKill
  required_connection: false
- name: exception
  direction: input
  event_type: Core.Exception
  required_connection: false
- name: grant_data
  direction: output
  event_type: MSHR.GrantData
- name: grant_no_data
  direction: output
  event_type: MSHR.GrantNoData
  required_connection: false
- name: response
  direction: output
  event_type: MSHR.ResponseDequeue
- name: replay
  direction: output
  event_type: MSHR.Replay
  required_connection: false
- name: refill
  direction: output
  event_type: MSHR.RefillWrite
  required_connection: false
- name: meta_write
  direction: output
  event_type: MSHR.MetaWrite
  required_connection: false
- name: wb_req
  direction: output
  event_type: MSHR.WritebackRequest
  required_connection: false
- name: mem_finish
  direction: output
  event_type: MSHR.MemFinish
  required_connection: false
- name: probe_blocked
  direction: output
  event_type: MSHR.ProbeBlocked
  required_connection: false
- name: fence_blocked
  direction: output
  event_type: MSHR.FenceBlocked
  required_connection: false
- name: io_request
  direction: input
  event_type: IOMSHR.Request
  required_connection: false
- name: io_response
  direction: output
  event_type: IOMSHR.Response
  required_connection: false
slots: []
state_variables: []
transformations: []
constraints: []
repeat:
- over: mshr_instances
  as: inst
  include:
    state_variables:
    - name: MSHR[${inst.mshr_id}].state
      sort: &id001
        name: string
      initial: INVALID
    - name: MSHR[${inst.mshr_id}].req_op_id
      sort: &id003
        name: op_id
      initial: EMPTY
    - name: MSHR[${inst.mshr_id}].req_address
      sort: &id006
        name: address
        width: 64
      initial: EMPTY_ADDR
    - name: MSHR[${inst.mshr_id}].req_kind
      sort: *id001
      initial: NONE
    - name: MSHR[${inst.mshr_id}].req_needs_wb
      sort: &id002
        name: bool
      initial: false
    - name: MSHR[${inst.mshr_id}].grant_had_data
      sort: *id002
      initial: false
    - name: MSHR[${inst.mshr_id}].line_value
      sort: &id004
        name: value
        width: 64
      initial: UNSET_VALUE
    - name: MSHR[${inst.mshr_id}].line_source_op_id
      sort: *id003
      initial: EMPTY
    - name: MSHR[${inst.mshr_id}].grantack_valid
      sort: *id002
      initial: false
    - name: MSHR[${inst.mshr_id}].commit_line
      sort: *id002
      initial: false
    - name: MSHR[${inst.mshr_id}].probe_rdy
      sort: *id002
      initial: true
    slots:
    - id: mshr_acquire_${inst.repeat_index}
      type: MSHR.AcquireBlock
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        op_id: ${inst.op_id}
        address: ${inst.address}
    - id: mshr_grant_data_${inst.repeat_index}
      type: MSHR.GrantData
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        op_id: ${inst.op_id}
        source_op_id:
          $expr:
            node: symbol
            name: mshr::${inst.mshr_id}::grant_source
            sort: *id003
        address: ${inst.address}
        value:
          $expr:
            node: symbol
            name: mshr::${inst.mshr_id}::grant_value
            sort: *id004
    - id: mshr_grant_no_data_${inst.repeat_index}
      type: MSHR.GrantNoData
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        op_id: ${inst.op_id}
        address: ${inst.address}
    - id: mshr_lb_write_${inst.repeat_index}
      type: MSHR.LineBufferWrite
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
        value:
          $expr:
            node: symbol
            name: mshr::${inst.mshr_id}::lb_value
            sort: *id004
    - id: mshr_refill_complete_${inst.repeat_index}
      type: MSHR.RefillComplete
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        op_id: ${inst.op_id}
        source_op_id:
          $expr:
            node: symbol
            name: mshr::${inst.mshr_id}::refill_source
            sort: *id003
        address: ${inst.address}
        value:
          $expr:
            node: symbol
            name: mshr::${inst.mshr_id}::refill_value
            sort: *id004
    - id: mshr_meta_read_${inst.repeat_index}
      type: MSHR.MetaReadRequest
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
    - id: mshr_meta_resp_clean_${inst.repeat_index}
      type: MSHR.MetaReadResponse
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
        valid: true
        needs_writeback: false
    - id: mshr_meta_resp_dirty_${inst.repeat_index}
      type: MSHR.MetaReadResponse
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
        valid: true
        needs_writeback: true
    - id: mshr_meta_clear_${inst.repeat_index}
      type: MSHR.MetaClear
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
    - id: mshr_wb_req_${inst.repeat_index}
      type: MSHR.WritebackRequest
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
    - id: mshr_wb_done_${inst.repeat_index}
      type: MSHR.WritebackDone
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
    - id: mshr_commit_line_${inst.repeat_index}
      type: MSHR.CommitLine
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
    - id: mshr_refill_write_${inst.repeat_index}
      type: MSHR.RefillWrite
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
    - id: mshr_meta_write_${inst.repeat_index}
      type: MSHR.MetaWrite
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
    - id: mshr_mem_finish_${inst.repeat_index}
      type: MSHR.MemFinish
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
    - id: mshr_probe_blocked_${inst.repeat_index}
      type: MSHR.ProbeBlocked
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        address: ${inst.address}
        reason: busy
    - id: mshr_fence_blocked_${inst.repeat_index}
      type: MSHR.FenceBlocked
      required: false
      fields:
        mshr_id: ${inst.mshr_id}
        reason: busy
    transformations:
    - name: acquire_${inst.mshr_id}
      inputs:
      - role: accept
        type: MSHR.PrimaryAccept
      outputs:
      - role: acquire
        type: MSHR.AcquireBlock
      when:
        node: nary
        op: and
        operands:
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: accept
            field: mshr_id
            sort: &id005
              name: int
          right:
            node: literal
            sort: *id005
            value: ${inst.mshr_id}
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: accept
            field: needs_acquire
            sort: *id002
          right:
            node: literal
            sort: *id002
            value: true
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: accept
          field: op_id
          sort: *id003
        right:
          node: event_field
          event_id: acquire
          field: op_id
          sort: *id003
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: accept
          field: mshr_id
          sort: *id005
        right:
          node: event_field
          event_id: acquire
          field: mshr_id
          sort: *id005
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: accept
          field: address
          sort: *id006
        right:
          node: event_field
          event_id: acquire
          field: address
          sort: *id006
      - node: binary
        op: lt
        left:
          node: event_field
          event_id: accept
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: acquire
          field: cycle
          sort: *id005
      state_requirements:
      - state: MSHR[${inst.mshr_id}].state
        at: acquire
        op: eq
        value:
          node: literal
          sort: *id001
          value: REFILL_REQ
      state_updates:
      - state: MSHR[${inst.mshr_id}].state
        at: acquire
        value:
          node: literal
          sort: *id001
          value: REFILL_RESP
      - state: MSHR[${inst.mshr_id}].probe_rdy
        at: acquire
        value:
          node: literal
          sort: *id002
          value: true
      exact: true
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: acquire
          field: mshr_id
          sort: *id005
        right:
          node: literal
          sort: *id005
          value: ${inst.mshr_id}
      tags:
      - mshr-fsm
      - tilelink
    - name: grant_data_${inst.mshr_id}
      inputs:
      - role: acquire
        type: MSHR.AcquireBlock
      outputs:
      - role: grant
        type: MSHR.GrantData
      when:
        node: nary
        op: and
        operands:
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: acquire
            field: mshr_id
            sort: *id005
          right:
            node: literal
            sort: *id005
            value: ${inst.mshr_id}
        - node: binary
          op: eq
          left:
            node: literal
            sort: *id002
            value: ${inst.grant_has_data}
          right:
            node: literal
            sort: *id002
            value: true
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: acquire
          field: mshr_id
          sort: *id005
        right:
          node: event_field
          event_id: grant
          field: mshr_id
          sort: *id005
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: acquire
          field: op_id
          sort: *id003
        right:
          node: event_field
          event_id: grant
          field: op_id
          sort: *id003
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: acquire
          field: address
          sort: *id006
        right:
          node: event_field
          event_id: grant
          field: address
          sort: *id006
      - node: binary
        op: lt
        left:
          node: event_field
          event_id: acquire
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: grant
          field: cycle
          sort: *id005
      state_requirements:
      - state: MSHR[${inst.mshr_id}].state
        at: grant
        op: eq
        value:
          node: literal
          sort: *id001
          value: REFILL_RESP
      state_updates:
      - state: MSHR[${inst.mshr_id}].grant_had_data
        at: grant
        value:
          node: literal
          sort: *id002
          value: true
      - state: MSHR[${inst.mshr_id}].line_value
        at: grant
        value:
          node: event_field
          event_id: grant
          field: value
          sort: *id004
      - state: MSHR[${inst.mshr_id}].line_source_op_id
        at: grant
        value:
          node: event_field
          event_id: grant
          field: source_op_id
          sort: *id003
      exact: true
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: mshr_id
          sort: *id005
        right:
          node: literal
          sort: *id005
          value: ${inst.mshr_id}
      tags:
      - grant-data
    - name: grant_no_data_${inst.mshr_id}
      inputs:
      - role: acquire
        type: MSHR.AcquireBlock
      outputs:
      - role: grant
        type: MSHR.GrantNoData
      when:
        node: nary
        op: and
        operands:
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: acquire
            field: mshr_id
            sort: *id005
          right:
            node: literal
            sort: *id005
            value: ${inst.mshr_id}
        - node: binary
          op: eq
          left:
            node: literal
            sort: *id002
            value: ${inst.grant_has_data}
          right:
            node: literal
            sort: *id002
            value: false
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: acquire
          field: mshr_id
          sort: *id005
        right:
          node: event_field
          event_id: grant
          field: mshr_id
          sort: *id005
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: acquire
          field: op_id
          sort: *id003
        right:
          node: event_field
          event_id: grant
          field: op_id
          sort: *id003
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: acquire
          field: address
          sort: *id006
        right:
          node: event_field
          event_id: grant
          field: address
          sort: *id006
      - node: binary
        op: lt
        left:
          node: event_field
          event_id: acquire
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: grant
          field: cycle
          sort: *id005
      state_requirements:
      - state: MSHR[${inst.mshr_id}].state
        at: grant
        op: eq
        value:
          node: literal
          sort: *id001
          value: REFILL_RESP
      state_updates:
      - state: MSHR[${inst.mshr_id}].state
        at: grant
        value:
          node: literal
          sort: *id001
          value: DRAIN_RPQ
      - state: MSHR[${inst.mshr_id}].grant_had_data
        at: grant
        value:
          node: literal
          sort: *id002
          value: false
      - state: MSHR[${inst.mshr_id}].grantack_valid
        at: grant
        value:
          node: literal
          sort: *id002
          value: true
      - state: MSHR[${inst.mshr_id}].probe_rdy
        at: grant
        value:
          node: literal
          sort: *id002
          value: false
      exact: true
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: mshr_id
          sort: *id005
        right:
          node: literal
          sort: *id005
          value: ${inst.mshr_id}
      tags:
      - permission-grant
    - name: grant_writes_lb_${inst.mshr_id}
      inputs:
      - role: grant
        type: MSHR.GrantData
      outputs:
      - role: write
        type: MSHR.LineBufferWrite
      when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: mshr_id
          sort: *id005
        right:
          node: literal
          sort: *id005
          value: ${inst.mshr_id}
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: mshr_id
          sort: *id005
        right:
          node: event_field
          event_id: write
          field: mshr_id
          sort: *id005
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: address
          sort: *id006
        right:
          node: event_field
          event_id: write
          field: address
          sort: *id006
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: value
          sort: *id004
        right:
          node: event_field
          event_id: write
          field: value
          sort: *id004
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: write
          field: cycle
          sort: *id005
      exact: true
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: write
          field: mshr_id
          sort: *id005
        right:
          node: literal
          sort: *id005
          value: ${inst.mshr_id}
    - name: refill_complete_${inst.mshr_id}
      inputs:
      - role: grant
        type: MSHR.GrantData
      outputs:
      - role: complete
        type: MSHR.RefillComplete
      when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: mshr_id
          sort: *id005
        right:
          node: literal
          sort: *id005
          value: ${inst.mshr_id}
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: mshr_id
          sort: *id005
        right:
          node: event_field
          event_id: complete
          field: mshr_id
          sort: *id005
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: op_id
          sort: *id003
        right:
          node: event_field
          event_id: complete
          field: op_id
          sort: *id003
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: source_op_id
          sort: *id003
        right:
          node: event_field
          event_id: complete
          field: source_op_id
          sort: *id003
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: address
          sort: *id006
        right:
          node: event_field
          event_id: complete
          field: address
          sort: *id006
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: value
          sort: *id004
        right:
          node: event_field
          event_id: complete
          field: value
          sort: *id004
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: grant
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: complete
          field: cycle
          sort: *id005
      state_requirements:
      - state: MSHR[${inst.mshr_id}].state
        at: complete
        op: eq
        value:
          node: literal
          sort: *id001
          value: REFILL_RESP
      state_updates:
      - state: MSHR[${inst.mshr_id}].state
        at: complete
        value:
          node: literal
          sort: *id001
          value: DRAIN_RPQ_LOADS
      - state: MSHR[${inst.mshr_id}].grantack_valid
        at: complete
        value:
          node: literal
          sort: *id002
          value: true
      - state: MSHR[${inst.mshr_id}].commit_line
        at: complete
        value:
          node: literal
          sort: *id002
          value: false
      - state: MSHR[${inst.mshr_id}].probe_rdy
        at: complete
        value:
          node: literal
          sort: *id002
          value: true
      exact: true
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: complete
          field: mshr_id
          sort: *id005
        right:
          node: literal
          sort: *id005
          value: ${inst.mshr_id}
      tags:
      - refill-complete
    - name: meta_read_when_rpq_empty_${inst.mshr_id}
      inputs:
      - role: meta
        type: MSHR.MetaReadRequest
      outputs: []
      when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: meta
          field: mshr_id
          sort: *id005
        right:
          node: literal
          sort: *id005
          value: ${inst.mshr_id}
      ensure: []
      state_requirements:
      - state: MSHR[${inst.mshr_id}].state
        at: meta
        op: eq
        value:
          node: literal
          sort: *id001
          value: DRAIN_RPQ_LOADS
      state_updates:
      - state: MSHR[${inst.mshr_id}].state
        at: meta
        value:
          node: literal
          sort: *id001
          value: META_RESP
      - state: MSHR[${inst.mshr_id}].probe_rdy
        at: meta
        value:
          node: literal
          sort: *id002
          value: false
      tags:
      - meta
      - rpq-empty-boundary
    - name: dirty_meta_clear_${inst.mshr_id}
      inputs:
      - role: resp
        type: MSHR.MetaReadResponse
      outputs:
      - role: clear
        type: MSHR.MetaClear
      when:
        node: nary
        op: and
        operands:
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: resp
            field: mshr_id
            sort: *id005
          right:
            node: literal
            sort: *id005
            value: ${inst.mshr_id}
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: resp
            field: valid
            sort: *id002
          right:
            node: literal
            sort: *id002
            value: true
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: resp
            field: needs_writeback
            sort: *id002
          right:
            node: literal
            sort: *id002
            value: true
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: resp
          field: address
          sort: *id006
        right:
          node: event_field
          event_id: clear
          field: address
          sort: *id006
      - node: binary
        op: lt
        left:
          node: event_field
          event_id: resp
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: clear
          field: cycle
          sort: *id005
