      - role: insert
        type: MSHR.RPQInsert
      outputs:
      - role: replay
        type: MSHR.Replay
      when:
        node: nary
        op: and
        operands:
        - node: nary
          op: or
          operands:
          - node: binary
            op: ne
            left:
              node: literal
              sort: *id001
              value: ${mreq.mem_kind}
            right:
              node: literal
              sort: *id001
              value: load
          - node: binary
            op: eq
            left:
              node: literal
              sort: *id001
              value: ${mreq.mem_kind}
            right:
              node: literal
              sort: *id001
              value: lr
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: insert
            field: op_id
            sort: *id003
          right:
            node: literal
            sort: *id003
            value: ${mreq.op_id}
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: insert
          field: mshr_id
          sort: *id005
        right:
          node: event_field
          event_id: replay
          field: mshr_id
          sort: *id005
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: insert
          field: op_id
          sort: *id003
        right:
          node: event_field
          event_id: replay
          field: op_id
          sort: *id003
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: insert
          field: address
          sort: *id006
        right:
          node: event_field
          event_id: replay
          field: address
          sort: *id006
      - node: binary
        op: lt
        left:
          node: event_field
          event_id: insert
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: replay
          field: cycle
          sort: *id005
      state_requirements:
      - state: MSHR[${mreq.mshr_id}].state
        at: replay
        op: eq
        value:
          node: literal
          sort: *id001
          value: DRAIN_RPQ
      - state: MSHR.req[${mreq.op_id}].rpq_valid
        at: replay
        op: eq
        value:
          node: literal
          sort: *id002
          value: true
      - state: MSHR.req[${mreq.op_id}].killed
        at: replay
        op: eq
        value:
          node: literal
          sort: *id002
          value: false
      exact: true
      state_mode: guard
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: replay
          field: op_id
          sort: *id003
        right:
          node: literal
          sort: *id003
          value: ${mreq.op_id}
    - name: replay_state_${mreq.op_id}
      inputs:
      - role: replay
        type: MSHR.Replay
      outputs: []
      when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: replay
          field: op_id
          sort: *id003
        right:
          node: literal
          sort: *id003
          value: ${mreq.op_id}
      ensure: []
      state_updates:
      - state: MSHR.req[${mreq.op_id}].rpq_valid
        at: replay
        value:
          node: literal
          sort: *id002
          value: false
    - name: replay_dequeue_${mreq.op_id}
      inputs:
      - role: replay
        type: MSHR.Replay
      outputs:
      - role: deq
        type: MSHR.RPQDequeue
      when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: replay
          field: op_id
          sort: *id003
        right:
          node: literal
          sort: *id003
          value: ${mreq.op_id}
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: replay
          field: op_id
          sort: *id003
        right:
          node: event_field
          event_id: deq
          field: op_id
          sort: *id003
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: replay
          field: mshr_id
          sort: *id005
        right:
          node: event_field
          event_id: deq
          field: mshr_id
          sort: *id005
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: replay
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: deq
          field: cycle
          sort: *id005
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: deq
          field: disposition
          sort: *id001
        right:
          node: literal
          sort: *id001
          value: replay
    - name: sdq_alloc_${mreq.op_id}
      inputs:
      - role: request
        type: DCache.MSHRRequest
      outputs:
      - role: alloc
        type: MSHR.SDQAllocate
      when:
        node: nary
        op: and
        operands:
        - node: binary
          op: eq
          left:
            node: literal
            sort: *id001
            value: ${mreq.mem_kind}
          right:
            node: literal
            sort: *id001
            value: store
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: request
            field: op_id
            sort: *id003
          right:
            node: literal
            sort: *id003
            value: ${mreq.op_id}
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: request
          field: op_id
          sort: *id003
        right:
          node: event_field
          event_id: alloc
          field: op_id
          sort: *id003
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: alloc
          field: sdq_id
          sort: *id005
        right:
          node: literal
          sort: *id005
          value: ${mreq.sdq_id}
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: request
          field: value
          sort: *id004
        right:
          node: event_field
          event_id: alloc
          field: value
          sort: *id004
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: request
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: alloc
          field: cycle
          sort: *id005
      state_requirements:
      - state: MSHR.req[${mreq.op_id}].sdq_valid
        at: request
        op: eq
        value:
          node: literal
          sort: *id002
          value: false
      state_updates:
      - state: MSHR.req[${mreq.op_id}].sdq_valid
        at: alloc
        value:
          node: literal
          sort: *id002
          value: true
      exact: true
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: alloc
          field: op_id
          sort: *id003
        right:
          node: literal
          sort: *id003
          value: ${mreq.op_id}
    - name: sdq_free_${mreq.op_id}
      inputs:
      - role: replay
        type: MSHR.Replay
      outputs:
      - role: free
        type: MSHR.SDQFree
      when:
        node: nary
        op: and
        operands:
        - node: binary
          op: eq
          left:
            node: literal
            sort: *id001
            value: ${mreq.mem_kind}
          right:
            node: literal
            sort: *id001
            value: store
        - node: binary
          op: eq
          left:
            node: event_field
            event_id: replay
            field: op_id
            sort: *id003
          right:
            node: literal
            sort: *id003
            value: ${mreq.op_id}
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: replay
          field: op_id
          sort: *id003
        right:
          node: event_field
          event_id: free
          field: op_id
          sort: *id003
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: free
          field: sdq_id
          sort: *id005
        right:
          node: literal
          sort: *id005
          value: ${mreq.sdq_id}
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: replay
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: free
          field: cycle
          sort: *id005
      state_requirements:
      - state: MSHR.req[${mreq.op_id}].sdq_valid
        at: free
        op: eq
        value:
          node: literal
          sort: *id002
          value: true
      state_updates:
      - state: MSHR.req[${mreq.op_id}].sdq_valid
        at: free
        value:
          node: literal
          sort: *id002
          value: false
      exact: true
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: free
          field: op_id
          sort: *id003
        right:
          node: literal
          sort: *id003
          value: ${mreq.op_id}
- over: io_requests
  as: ioreq
  include:
    state_variables:
    - name: IOMSHR[${ioreq.io_id}].state
      sort: *id001
      initial: IDLE
    slots:
    - id: io_access_${ioreq.repeat_index}
      type: IOMSHR.MemAccess
      required: false
      fields:
        op_id: ${ioreq.op_id}
        address: ${ioreq.address}
        mem_kind: ${ioreq.mem_kind}
        io_id: ${ioreq.io_id}
    - id: io_ack_${ioreq.repeat_index}
      type: IOMSHR.MemAck
      required: false
      fields:
        op_id: ${ioreq.op_id}
        value: ${ioreq.value}
        io_id: ${ioreq.io_id}
    - id: io_resp_${ioreq.repeat_index}
      type: IOMSHR.Response
      required: false
      fields:
        op_id: ${ioreq.op_id}
        value: ${ioreq.value}
        io_id: ${ioreq.io_id}
    transformations:
    - name: io_access_${ioreq.op_id}
      inputs:
      - role: request
        type: IOMSHR.Request
      outputs:
      - role: access
        type: IOMSHR.MemAccess
      when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: request
          field: op_id
          sort: *id003
        right:
          node: literal
          sort: *id003
          value: ${ioreq.op_id}
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: request
          field: op_id
          sort: *id003
        right:
          node: event_field
          event_id: access
          field: op_id
          sort: *id003
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: request
          field: address
          sort: *id006
        right:
          node: event_field
          event_id: access
          field: address
          sort: *id006
      - node: binary
        op: lt
        left:
          node: event_field
          event_id: request
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: access
          field: cycle
          sort: *id005
      state_requirements:
      - state: IOMSHR[${ioreq.io_id}].state
        at: request
        op: eq
        value:
          node: literal
          sort: *id001
          value: IDLE
      state_updates:
      - state: IOMSHR[${ioreq.io_id}].state
        at: access
        value:
          node: literal
          sort: *id001
          value: MEM_ACK
      exact: true
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: access
          field: op_id
          sort: *id003
        right:
          node: literal
          sort: *id003
          value: ${ioreq.op_id}
    - name: io_ack_${ioreq.op_id}
      inputs:
      - role: access
        type: IOMSHR.MemAccess
      outputs:
      - role: ack
        type: IOMSHR.MemAck
      when:
        node: literal
        sort: *id002
        value: true
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: access
          field: op_id
          sort: *id003
        right:
          node: event_field
          event_id: ack
          field: op_id
          sort: *id003
      - node: binary
        op: lt
        left:
          node: event_field
          event_id: access
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: ack
          field: cycle
          sort: *id005
      state_requirements:
      - state: IOMSHR[${ioreq.io_id}].state
        at: ack
        op: eq
        value:
          node: literal
          sort: *id001
          value: MEM_ACK
      state_updates:
      - state: IOMSHR[${ioreq.io_id}].state
        at: ack
        value:
          node: ite
          condition:
            node: binary
            op: eq
            left:
              node: literal
              sort: *id001
              value: ${ioreq.mem_kind}
            right:
              node: literal
              sort: *id001
              value: load
          then:
            node: literal
            sort: *id001
            value: RESP
          else:
            node: literal
            sort: *id001
            value: IDLE
      exact: true
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: ack
          field: op_id
          sort: *id003
        right:
          node: literal
          sort: *id003
          value: ${ioreq.op_id}
    - name: io_response_${ioreq.op_id}
      inputs:
      - role: ack
        type: IOMSHR.MemAck
      outputs:
      - role: resp
        type: IOMSHR.Response
      when:
        node: binary
        op: eq
        left:
          node: literal
          sort: *id001
          value: ${ioreq.mem_kind}
        right:
          node: literal
          sort: *id001
          value: load
      ensure:
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: ack
          field: op_id
          sort: *id003
        right:
          node: event_field
          event_id: resp
          field: op_id
          sort: *id003
      - node: binary
        op: eq
        left:
          node: event_field
          event_id: ack
          field: value
          sort: *id004
        right:
          node: event_field
          event_id: resp
          field: value
          sort: *id004
      - node: binary
        op: lt
        left:
          node: event_field
          event_id: ack
          field: cycle
          sort: *id005
        right:
          node: event_field
          event_id: resp
          field: cycle
          sort: *id005
      state_requirements:
      - state: IOMSHR[${ioreq.io_id}].state
        at: resp
        op: eq
        value:
          node: literal
          sort: *id001
          value: RESP
      state_updates:
      - state: IOMSHR[${ioreq.io_id}].state
        at: resp
        value:
          node: literal
          sort: *id001
          value: IDLE
      exact: true
      output_when:
        node: binary
        op: eq
        left:
          node: event_field
          event_id: resp
          field: op_id
          sort: *id003
        right:
          node: literal
          sort: *id003
          value: ${ioreq.op_id}
