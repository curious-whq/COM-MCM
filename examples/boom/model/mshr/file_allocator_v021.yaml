schema_version: umcm.module.v0.15.0
name: boom_mshr_file_allocator_v021
metadata:
  version: 0.21.0
  component: BOOM v4 BoomMSHRFile allocation and matching
  source_repository: https://github.com/riscv-boom/riscv-boom.git
  source_commit: 58ef2720eae13be26b3008c02b5a74ce29c61c44
  source_files:
  - src/main/scala/v4/lsu/mshrs.scala:535-540
  - src/main/scala/v4/lsu/mshrs.scala:571-578
  - src/main/scala/v4/lsu/mshrs.scala:592-678
  - src/main/scala/v4/lsu/mshrs.scala:726-730
  - rocket-chip/src/main/scala/tilelink/Metadata.scala:98-110
  - rocket-chip/src/main/scala/rocket/Consts.scala:80-86
  configuration: Small/Medium BOOM nMSHRs=2
  bounded_abstractions:
  - block_address/set_index/tag are supplied by the DCache boundary instead of bit slicing inside this module
  - RegNext around AgePriorityEncoder is represented at the accepted-request cycle
  - MSHR phase and RPQ/SDQ capacity readiness remain child-entry interface
    obligations when this allocator is composed with the detailed BoomMSHR model;
    v0.21 now discharges them through PrimaryReady/SecondaryReady when
    mshr_entry_ready_integrated is enabled
ports:
- {name: admission, direction: input, event_type: DCache.MSHRAdmissionRequest, required_connection: false}
- {name: finish, direction: input, event_type: MSHR.MemFinish, required_connection: false}
- {name: primary_ready, direction: input, event_type: MSHRFile.PrimaryReady, required_connection: false}
- {name: secondary_ready, direction: input, event_type: MSHRFile.SecondaryReady, required_connection: false}
- {name: request, direction: output, event_type: DCache.MSHRRequest, required_connection: false}
- {name: blocked, direction: output, event_type: MSHRFile.RequestBlocked, required_connection: false}
internal_events:
- MSHRFile.PrimaryPermit
- MSHRFile.SecondaryPermit
state_variables:
