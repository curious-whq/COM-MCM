schema_version: umcm.module.v0.15.0
name: boom_mshr_entry_frontend_v021
metadata:
  version: 0.21.0
  component: BOOM v4 fixed MSHR entry acceptance, RPQ and SDQ readiness
  source:
    repository: https://github.com/riscv-boom/riscv-boom.git
    commit: 58ef2720eae13be26b3008c02b5a74ce29c61c44
    file: src/main/scala/v4/lsu/mshrs.scala
    sha256: 7e70d1a095f9543ecb20c2983e925205ef473376fe7e6112173d7e8079069fcf
    lines: [120, 163, 202, 240, 550, 560, 598, 678, 726, 741]
  configuration: Small/Medium BOOM nMSHRs=2, nRPQ=16, nSDQ=17
  bounded_abstractions:
  - The v0.21 blind bound has at most four memory operations, so RPQ and SDQ capacity cannot exhaust; their per-request lifetime is still explicit.
  - REFILL_REQ and DRAIN_RPQ are retained as entry phases; all source phases forbidden to secondary acceptance are represented by INVALID or FINISHING.
  - Prefetch requests are excluded by the existing v0.21 memory-operation domain.
  hierarchy: Entry phase and RPQ/SDQ valid bits are private; PrimaryReady, SecondaryReady and accept events are the MSHRFile-entry interfaces.
ports:
- {name: admission, direction: input, event_type: DCache.MSHRAdmissionRequest, required_connection: false}
- {name: request, direction: input, event_type: DCache.MSHRRequest, required_connection: false}
- {name: primary_ready, direction: output, event_type: MSHRFile.PrimaryReady, required_connection: false}
- {name: secondary_ready, direction: output, event_type: MSHRFile.SecondaryReady, required_connection: false}
- {name: primary_accept, direction: output, event_type: MSHR.PrimaryAccept, required_connection: false}
- {name: secondary_accept, direction: output, event_type: MSHR.SecondaryMissAccept, required_connection: false}
- {name: meta_write, direction: input, event_type: MSHR.MetaWrite, required_connection: false}
- {name: finish, direction: input, event_type: MSHR.MemFinish, required_connection: false}
- {name: replay, direction: input, event_type: MSHR.Replay, required_connection: false}
- {name: response, direction: input, event_type: MSHR.ResponseDequeue, required_connection: false}
internal_events:
- MSHR.RPQInsert
- MSHR.SDQAllocate
- MSHR.SDQFree
state_variables:
- {name: 'MSHREntry[0].phase', sort: {name: string}, initial: INVALID}
- {name: 'MSHREntry[0].block_address', sort: {name: address, width: 64}, initial: EMPTY_ADDR}
- {name: 'MSHREntry[1].phase', sort: {name: string}, initial: INVALID}
- {name: 'MSHREntry[1].block_address', sort: {name: address, width: 64}, initial: EMPTY_ADDR}
slots: []
transformations:
- name: entry_0_finishing_after_meta_write
  inputs: [{role: write, type: MSHR.MetaWrite}]
  outputs: []
  when: {node: binary, op: eq, left: {node: event_field, event_id: write, field: mshr_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 0}}
  state_requirements: [{state: 'MSHREntry[0].phase', at: write, op: ne, value: {node: literal, sort: {name: string}, value: INVALID}}]
  state_updates: [{state: 'MSHREntry[0].phase', at: write, value: {node: literal, sort: {name: string}, value: FINISHING}}]
  tags: [source:mshrs.scala:346-365, secondary-not-ready]
- name: entry_1_finishing_after_meta_write
  inputs: [{role: write, type: MSHR.MetaWrite}]
  outputs: []
  when: {node: binary, op: eq, left: {node: event_field, event_id: write, field: mshr_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}
  state_requirements: [{state: 'MSHREntry[1].phase', at: write, op: ne, value: {node: literal, sort: {name: string}, value: INVALID}}]
  state_updates: [{state: 'MSHREntry[1].phase', at: write, value: {node: literal, sort: {name: string}, value: FINISHING}}]
  tags: [source:mshrs.scala:346-365, secondary-not-ready]
- name: entry_0_invalid_after_finish
  inputs: [{role: finish, type: MSHR.MemFinish}]
  outputs: []
  when: {node: binary, op: eq, left: {node: event_field, event_id: finish, field: mshr_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 0}}
  state_requirements: [{state: 'MSHREntry[0].phase', at: finish, op: ne, value: {node: literal, sort: {name: string}, value: INVALID}}]
  state_updates:
  - {state: 'MSHREntry[0].phase', at: finish, value: {node: literal, sort: {name: string}, value: INVALID}}
  - {state: 'MSHREntry[0].block_address', at: finish, value: {node: literal, sort: {name: address, width: 64}, value: EMPTY_ADDR}}
  tags: [source:mshrs.scala:361-365]
- name: entry_1_invalid_after_finish
  inputs: [{role: finish, type: MSHR.MemFinish}]
  outputs: []
  when: {node: binary, op: eq, left: {node: event_field, event_id: finish, field: mshr_id, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}
  state_requirements: [{state: 'MSHREntry[1].phase', at: finish, op: ne, value: {node: literal, sort: {name: string}, value: INVALID}}]
  state_updates:
  - {state: 'MSHREntry[1].phase', at: finish, value: {node: literal, sort: {name: string}, value: INVALID}}
  - {state: 'MSHREntry[1].block_address', at: finish, value: {node: literal, sort: {name: address, width: 64}, value: EMPTY_ADDR}}
