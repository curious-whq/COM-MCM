      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: evict, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: release, field: cycle, sort: {name: int}}}
      state_requirements:
      - {state: "L1.h1.line[${line.line_id}].perm", at: release, op: ne, value: {node: literal, sort: {name: string}, value: N}}
      - {state: "L1.h1.line[${line.line_id}].dirty", at: release, op: eq, value: {node: literal, sort: {name: bool}, value: false}}
      - {state: "L1.h1.line[${line.line_id}].value", at: release, op: eq, value: {node: event_field, event_id: release, field: value, sort: {name: value, width: 64}}}
      - {state: "L1.h1.line[${line.line_id}].version", at: release, op: eq, value: {node: event_field, event_id: release, field: version, sort: {name: int}}}
      - {state: "L1.h1.line[${line.line_id}].source", at: release, op: eq, value: {node: event_field, event_id: release, field: source_op_id, sort: {name: op_id}}}
      state_mode: guard
      exact: true

    - name: release_ack_clears_h0_${product.repeat_index}
      inputs: [{role: ack, type: TL.ReleaseAck}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: ack, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${eviction.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: ack, field: line_id, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${line.line_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: ack, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 0}}
      state_updates:
      - {state: "L1.h0.line[${line.line_id}].perm", at: ack, value: {node: literal, sort: {name: string}, value: N}}
      - {state: "L1.h0.line[${line.line_id}].dirty", at: ack, value: {node: literal, sort: {name: bool}, value: false}}
    - name: release_ack_clears_h1_${product.repeat_index}
      inputs: [{role: ack, type: TL.ReleaseAck}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: ack, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${eviction.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: ack, field: line_id, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${line.line_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: ack, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}
      state_updates:
      - {state: "L1.h1.line[${line.line_id}].perm", at: ack, value: {node: literal, sort: {name: string}, value: N}}
      - {state: "L1.h1.line[${line.line_id}].dirty", at: ack, value: {node: literal, sort: {name: bool}, value: false}}

- axes:
  - {over: accesses, as: before}
  - {over: accesses, as: after}
  include:
    transformations:
    - name: explicit_access_dependency_${product.repeat_index}
      inputs: [{role: complete, type: Coherence.AccessComplete}, {role: access, type: Coherence.Access}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: complete, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${before.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${after.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: after_op_id, sort: {name: op_id}}, right: {node: event_field, event_id: complete, field: op_id, sort: {name: op_id}}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: complete, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: access, field: cycle, sort: {name: int}}}

- axes:
  - {over: accesses, as: access}
  - {over: evictions, as: eviction}
  include:
    transformations:
    - name: explicit_eviction_dependency_${product.repeat_index}
      inputs: [{role: complete, type: Coherence.AccessComplete}, {role: evict, type: Coherence.Evict}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: complete, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: evict, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${eviction.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: evict, field: after_op_id, sort: {name: op_id}}, right: {node: event_field, event_id: complete, field: op_id, sort: {name: op_id}}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: complete, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: evict, field: cycle, sort: {name: int}}}
