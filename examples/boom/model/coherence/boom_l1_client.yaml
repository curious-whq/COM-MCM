schema_version: umcm.module.v0.15.0
name: boom_l1_coherence_client
metadata:
  version: 0.18.0
  source: BOOM v4 non-blocking DCache TileLink client
  source_commit: 58ef2720eae13be26b3008c02b5a74ce29c61c44
  chipyard_commit: 4180463d52bc0a6b4c004530601ccdabebf0ab7d
  source_files:
  - src/main/scala/v4/lsu/dcache.scala:24-212,818-860
  - src/main/scala/v4/lsu/mshrs.scala:106-199,242-259,361-365,513-718
  source_sha256:
    dcache.scala: 82d5562b6d6220be5714716c6b935a001ed6fc54747b4fc925603cabbde9aac4
    mshrs.scala: 7e70d1a095f9543ecb20c2983e925205ef473376fe7e6112173d7e8079069fcf
  scope: Two-hart, line-granular L1 permission/data client for inner TileLink A/B/C/D/E transactions.
  abstractions:
  - Cache pipeline and arrays are summarized by per-hart line permission, value, version, source, and dirty state.
  - Multi-beat messages are one atomic line event.
  - Access and eviction are high-level root requests; hit/miss, Acquire grow, ProbeAckData, and GrantAck are derived.
  hierarchy: Client line state and path selection are private; only declared root and TileLink/coherence events are public.
ports:
- {name: line_init, direction: input, event_type: Coherence.LineInit, required_connection: false}
- {name: access, direction: input, event_type: Coherence.Access, required_connection: false}
- {name: evict, direction: input, event_type: Coherence.Evict, required_connection: false}
- {name: acquire, direction: output, event_type: TL.Acquire}
- {name: probe, direction: input, event_type: TL.Probe}
- {name: probe_ack, direction: output, event_type: TL.ProbeAck}
- {name: grant, direction: input, event_type: TL.Grant}
- {name: grant_ack, direction: output, event_type: TL.GrantAck}
- {name: release, direction: output, event_type: TL.Release}
- {name: release_ack, direction: input, event_type: TL.ReleaseAck}
- {name: load_result, direction: output, event_type: Coherence.LoadResult, required_connection: false}
- {name: store_performed, direction: output, event_type: Coherence.StorePerformed, required_connection: false}
- {name: access_complete, direction: output, event_type: Coherence.AccessComplete, required_connection: false}
internal_events: []
slots: []
state_variables: []
transformations: []
constraints: []

repeat:
- over: lines
  as: line
  include:
    state_variables:
    - {name: "L1.h0.line[${line.line_id}].perm", sort: {name: string}, initial: N}
    - {name: "L1.h0.line[${line.line_id}].dirty", sort: {name: bool}, initial: false}
    - {name: "L1.h0.line[${line.line_id}].value", sort: {name: value, width: 64}, initial: "${line.value}"}
    - {name: "L1.h0.line[${line.line_id}].version", sort: {name: int}, initial: "${line.version}"}
    - {name: "L1.h0.line[${line.line_id}].source", sort: {name: op_id}, initial: "${line.source_op_id}"}
    - {name: "L1.h1.line[${line.line_id}].perm", sort: {name: string}, initial: N}
    - {name: "L1.h1.line[${line.line_id}].dirty", sort: {name: bool}, initial: false}
    - {name: "L1.h1.line[${line.line_id}].value", sort: {name: value, width: 64}, initial: "${line.value}"}
    - {name: "L1.h1.line[${line.line_id}].version", sort: {name: int}, initial: "${line.version}"}
    - {name: "L1.h1.line[${line.line_id}].source", sort: {name: op_id}, initial: "${line.source_op_id}"}

- over: accesses
  as: access
  include:
    slots:
    - id: l1_acquire_${access.repeat_index}
      type: TL.Acquire
      required: false
      fields:
        txn_id: ${access.op_id}
        hart: ${access.hart}
        line_id: ${access.line_id}
        address: ${access.address}
        grow: {$expr: {node: symbol, name: "l1::${access.op_id}::grow", sort: {name: string}}}
        need_data: {$expr: {node: symbol, name: "l1::${access.op_id}::need_data", sort: {name: bool}}}
    - id: l1_load_result_${access.repeat_index}
      type: Coherence.LoadResult
      required: false
      fields:
        op_id: ${access.op_id}
        hart: ${access.hart}
        line_id: ${access.line_id}
        address: ${access.address}
        value: {$expr: {node: symbol, name: "l1::${access.op_id}::load_value", sort: {name: value, width: 64}}}
        version: {$expr: {node: symbol, name: "l1::${access.op_id}::load_version", sort: {name: int}}}
        source_op_id: {$expr: {node: symbol, name: "l1::${access.op_id}::load_source", sort: {name: op_id}}}
        path: {$expr: {node: symbol, name: "l1::${access.op_id}::load_path", sort: {name: string}}}
    - id: l1_store_performed_${access.repeat_index}
      type: Coherence.StorePerformed
      required: false
      fields:
        op_id: ${access.op_id}
        hart: ${access.hart}
        line_id: ${access.line_id}
        address: ${access.address}
        value: ${access.write_value}
        version: {$expr: {node: symbol, name: "l1::${access.op_id}::store_version", sort: {name: int}}}
        source_op_id: ${access.op_id}
        path: {$expr: {node: symbol, name: "l1::${access.op_id}::store_path", sort: {name: string}}}
    - id: l1_access_complete_${access.repeat_index}
      type: Coherence.AccessComplete
      required: false
      fields: {op_id: "${access.op_id}", hart: "${access.hart}", program_index: "${access.program_index}", mem_kind: "${access.mem_kind}"}
    - id: l1_grant_ack_${access.repeat_index}
      type: TL.GrantAck
      required: false
      fields:
        txn_id: ${access.op_id}
        hart: ${access.hart}
        sink_id: {$expr: {node: symbol, name: "l1::${access.op_id}::sink", sort: {name: int}}}
    - id: l1_probe_ack_${access.repeat_index}_h0
      type: TL.ProbeAck
      required: false
      fields:
        txn_id: ${access.op_id}
        hart: 0
        line_id: ${access.line_id}
        address: ${access.address}
        cap: {$expr: {node: symbol, name: "l1::${access.op_id}::h0::probe_cap", sort: {name: string}}}
        has_data: {$expr: {node: symbol, name: "l1::${access.op_id}::h0::probe_data", sort: {name: bool}}}
        value: {$expr: {node: symbol, name: "l1::${access.op_id}::h0::probe_value", sort: {name: value, width: 64}}}
        version: {$expr: {node: symbol, name: "l1::${access.op_id}::h0::probe_version", sort: {name: int}}}
        source_op_id: {$expr: {node: symbol, name: "l1::${access.op_id}::h0::probe_source", sort: {name: op_id}}}
    - id: l1_probe_ack_${access.repeat_index}_h1
      type: TL.ProbeAck
      required: false
      fields:
        txn_id: ${access.op_id}
        hart: 1
        line_id: ${access.line_id}
        address: ${access.address}
        cap: {$expr: {node: symbol, name: "l1::${access.op_id}::h1::probe_cap", sort: {name: string}}}
        has_data: {$expr: {node: symbol, name: "l1::${access.op_id}::h1::probe_data", sort: {name: bool}}}
        value: {$expr: {node: symbol, name: "l1::${access.op_id}::h1::probe_value", sort: {name: value, width: 64}}}
        version: {$expr: {node: symbol, name: "l1::${access.op_id}::h1::probe_version", sort: {name: int}}}
        source_op_id: {$expr: {node: symbol, name: "l1::${access.op_id}::h1::probe_source", sort: {name: op_id}}}

- over: evictions
  as: eviction
  include:
    slots:
    - id: l1_release_${eviction.repeat_index}
      type: TL.Release
      required: false
      fields:
        txn_id: ${eviction.txn_id}
        hart: ${eviction.hart}
        line_id: ${eviction.line_id}
        address: ${eviction.address}
        shrink: {$expr: {node: symbol, name: "l1::${eviction.txn_id}::shrink", sort: {name: string}}}
        has_data: {$expr: {node: symbol, name: "l1::${eviction.txn_id}::release_data", sort: {name: bool}}}
        value: {$expr: {node: symbol, name: "l1::${eviction.txn_id}::release_value", sort: {name: value, width: 64}}}
        version: {$expr: {node: symbol, name: "l1::${eviction.txn_id}::release_version", sort: {name: int}}}
        source_op_id: {$expr: {node: symbol, name: "l1::${eviction.txn_id}::release_source", sort: {name: op_id}}}

repeat_product:
- axes:
  - {over: accesses, as: access}
  - {over: lines, as: line}
  include:
    transformations:
    - name: load_access_must_complete_${product.repeat_index}
      inputs: [{role: access, type: Coherence.Access}]
      outputs: [{role: result, type: Coherence.LoadResult}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: line_id, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${line.line_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: mem_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: load}}
      ensure:
      - {node: binary, op: eq, left: {node: event_field, event_id: result, field: op_id, sort: {name: op_id}}, right: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: access, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: result, field: cycle, sort: {name: int}}}
      - node: nary
        op: or
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: result, field: path, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: hit}}
        - {node: binary, op: eq, left: {node: event_field, event_id: result, field: path, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: refill}}
    - name: store_access_must_complete_${product.repeat_index}
      inputs: [{role: access, type: Coherence.Access}]
      outputs: [{role: store, type: Coherence.StorePerformed}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: line_id, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${line.line_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: mem_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: store}}
      ensure:
      - {node: binary, op: eq, left: {node: event_field, event_id: store, field: op_id, sort: {name: op_id}}, right: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: access, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: store, field: cycle, sort: {name: int}}}
      - node: nary
        op: or
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: store, field: path, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: hit}}
        - {node: binary, op: eq, left: {node: event_field, event_id: store, field: path, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: refill}}

    - name: load_hit_h0_${product.repeat_index}
      inputs: [{role: access, type: Coherence.Access}]
      outputs: [{role: result, type: Coherence.LoadResult}]
      when: &load_h0
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: line_id, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${line.line_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 0}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: mem_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: load}}
      output_when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: result, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: result, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 0}}
        - {node: binary, op: eq, left: {node: event_field, event_id: result, field: path, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: hit}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: access, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: result, field: cycle, sort: {name: int}}}
      state_requirements:
      - {state: "L1.h0.line[${line.line_id}].perm", at: access, op: ne, value: {node: literal, sort: {name: string}, value: N}}
      - {state: "L1.h0.line[${line.line_id}].value", at: result, op: eq, value: {node: event_field, event_id: result, field: value, sort: {name: value, width: 64}}}
      - {state: "L1.h0.line[${line.line_id}].version", at: result, op: eq, value: {node: event_field, event_id: result, field: version, sort: {name: int}}}
      - {state: "L1.h0.line[${line.line_id}].source", at: result, op: eq, value: {node: event_field, event_id: result, field: source_op_id, sort: {name: op_id}}}
      state_mode: guard
      exact: true
    - name: load_hit_h1_${product.repeat_index}
      inputs: [{role: access, type: Coherence.Access}]
      outputs: [{role: result, type: Coherence.LoadResult}]
      when: &load_h1
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: line_id, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${line.line_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: mem_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: load}}
      output_when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: result, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: result, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}
        - {node: binary, op: eq, left: {node: event_field, event_id: result, field: path, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: hit}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: access, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: result, field: cycle, sort: {name: int}}}
      state_requirements:
      - {state: "L1.h1.line[${line.line_id}].perm", at: access, op: ne, value: {node: literal, sort: {name: string}, value: N}}
      - {state: "L1.h1.line[${line.line_id}].value", at: result, op: eq, value: {node: event_field, event_id: result, field: value, sort: {name: value, width: 64}}}
      - {state: "L1.h1.line[${line.line_id}].version", at: result, op: eq, value: {node: event_field, event_id: result, field: version, sort: {name: int}}}
      - {state: "L1.h1.line[${line.line_id}].source", at: result, op: eq, value: {node: event_field, event_id: result, field: source_op_id, sort: {name: op_id}}}
      state_mode: guard
      exact: true

    - name: load_refill_${product.repeat_index}
      inputs: [{role: access, type: Coherence.Access}, {role: grant, type: TL.Grant}]
      outputs: [{role: result, type: Coherence.LoadResult}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: line_id, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${line.line_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: mem_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: load}}
        - {node: binary, op: eq, left: {node: event_field, event_id: grant, field: txn_id, sort: {name: op_id}}, right: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}}
        - {node: event_field, event_id: grant, field: has_data, sort: {name: bool}}
      output_when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: result, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: result, field: path, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: refill}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: grant, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: result, field: cycle, sort: {name: int}}}
      - {node: binary, op: eq, left: {node: event_field, event_id: result, field: value, sort: {name: value, width: 64}}, right: {node: event_field, event_id: grant, field: value, sort: {name: value, width: 64}}}
      - {node: binary, op: eq, left: {node: event_field, event_id: result, field: version, sort: {name: int}}, right: {node: event_field, event_id: grant, field: version, sort: {name: int}}}
      - {node: binary, op: eq, left: {node: event_field, event_id: result, field: source_op_id, sort: {name: op_id}}, right: {node: event_field, event_id: grant, field: source_op_id, sort: {name: op_id}}}
      exact: true

    - name: store_hit_h0_${product.repeat_index}
      inputs: [{role: access, type: Coherence.Access}]
      outputs: [{role: store, type: Coherence.StorePerformed}]
      when: &store_h0
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: line_id, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${line.line_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 0}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: mem_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: store}}
      output_when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: store, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: store, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 0}}
        - {node: binary, op: eq, left: {node: event_field, event_id: store, field: path, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: hit}}
      state_requirements:
      - {state: "L1.h0.line[${line.line_id}].perm", at: access, op: eq, value: {node: literal, sort: {name: string}, value: T}}
      state_mode: guard
      exact: true
    - name: store_hit_h1_${product.repeat_index}
      inputs: [{role: access, type: Coherence.Access}]
      outputs: [{role: store, type: Coherence.StorePerformed}]
      when: &store_h1
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: line_id, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${line.line_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: mem_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: store}}
      output_when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: store, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: store, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}
        - {node: binary, op: eq, left: {node: event_field, event_id: store, field: path, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: hit}}
      state_requirements:
      - {state: "L1.h1.line[${line.line_id}].perm", at: access, op: eq, value: {node: literal, sort: {name: string}, value: T}}
      state_mode: guard
      exact: true
    - name: store_refill_${product.repeat_index}
      inputs: [{role: access, type: Coherence.Access}, {role: grant, type: TL.Grant}]
      outputs: [{role: store, type: Coherence.StorePerformed}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: access, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
