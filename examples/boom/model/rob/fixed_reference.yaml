schema_version: umcm.module.v0.14.0
name: rob
metadata:
  variant: fixed
  source: Architectural operation and recovery boundary abstraction
  parameterized: true
  template_parameters:
  - older_load.op_id
  - older_load.address
  - older_load.ldq_idx
  - older_load.mshr_id
  - younger_load.op_id
  - younger_load.ldq_idx
  - visible_store.op_id
  - visible_store.value
  - init_write.value
  version: 0.14.0
ports:
- name: memory_order_exception
  direction: input
  event_type: Core.MemoryOrderingException
- name: arch_load
  direction: output
  event_type: Arch.Load
- name: arch_store
  direction: output
  event_type: Arch.Store
- name: commit_load
  direction: output
  event_type: Arch.CommitLoad
- name: branch_kill
  direction: output
  event_type: Core.BranchKill
- name: exception
  direction: output
  event_type: Core.Exception
- name: squash_load
  direction: output
  event_type: Core.SquashLoad
slots:
- id: branch_kill_0
  type: Core.BranchKill
  required: false
  fields:
    op_id: ${older_load.op_id}
  cycle: 3
  annotations:
    role: optional_defense
- id: exception_0
  type: Core.Exception
  required: false
  fields:
    hart: 0
  cycle: 3
  annotations:
    role: optional_defense
- id: younger_squash
  type: Core.SquashLoad
  required: true
  fields:
    op_id: ${younger_load.op_id}
    ldq_idx: ${younger_load.ldq_idx}
    reason: memory_ordering_exception
state_variables: []
transformations:
- name: memory_ordering_exception_emits_squash
  inputs:
  - role: exception
    type: Core.MemoryOrderingException
  outputs:
  - role: squash
    type: Core.SquashLoad
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: squash
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: exception
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: squash
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: exception
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: exception
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: squash
      field: cycle
      sort:
        name: int
  exact: true
  tags:
  - fixed
  - rob-recovery
  - module-boundary
  description: ROB/recovery converts the LSU memory-ordering exception into a squash event.
- name: memory_ordering_exception_blocks_matching_commit
  inputs:
  - role: exception
    type: Core.MemoryOrderingException
  - role: commit
    type: Arch.CommitLoad
  outputs: []
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: exception
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: commit
      field: op_id
      sort:
        name: op_id
  ensure:
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: commit
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: exception
      field: cycle
      sort:
        name: int
  exact: false
  tags:
  - fixed
  - rob-recovery
  - retirement-block
  description: A memory-ordering exception forbids a later architectural commit of the same load.
constraints: []
