schema_version: umcm.composition.v0.15.0
name: boom-memory-buggy
horizon: 24
metadata:
  version: 0.15.0
  purpose: generic LSQ + current L1/MSHR witness support
  encapsulation: strict
  hierarchy: ports-only-public-surface
parameters:
  mshr_tilelink_ports_enabled: false
  mshr_grant_port_direction: output
  mshr_internal_grant_generation: true
modules:
- name: lsu
  path: ../model/lsu/module.yaml
- name: dcache
  path: ../model/l1/module.yaml
- name: mshr
  path: ../model/mshr/module.yaml
- name: coherence
  path: ../model/coherence/module.yaml
- name: rob
  path: ../model/rob/buggy.yaml
connections:
- name: core_arch_load_to_lsu
  source:
    module: rob
    port: arch_load
  target:
    module: lsu
    port: arch_load
  mode: shared_event
- name: core_commit_load_to_lsu
  source:
    module: rob
    port: commit_load
  target:
    module: lsu
    port: commit_load
  mode: shared_event
- name: core_branch_kill_to_lsu
  source:
    module: rob
    port: branch_kill
  target:
    module: lsu
    port: branch_kill
  mode: shared_event
- name: core_exception_to_lsu
  source:
    module: rob
    port: exception
  target:
    module: lsu
    port: exception
  mode: shared_event
- name: lsu_memory_order_exception_to_rob
  source:
    module: lsu
    port: memory_order_exception
  target:
    module: rob
    port: memory_order_exception
  mode: shared_event
- name: rob_squash_to_lsu
  source:
    module: rob
    port: squash_load
  target:
    module: lsu
    port: squash_load
  mode: shared_event
- name: lsu_request_valid_to_dcache
  source:
    module: lsu
    port: dcache_req_valid
  target:
    module: dcache
    port: lsu_req_valid
  mode: shared_event
- name: dcache_ready_to_lsu
  source:
    module: dcache
    port: req_ready
  target:
    module: lsu
    port: dcache_req_ready
  mode: shared_event
- name: dcache_accept_to_lsu
  source:
    module: dcache
    port: req_fire
  target:
    module: lsu
    port: dcache_req_fire
  mode: shared_event
- name: dcache_hit_response_to_lsu
  source:
    module: dcache
    port: load_response
  target:
    module: lsu
    port: dcache_load_response
  mode: shared_event
- name: dcache_nack_to_lsu
  source:
    module: dcache
    port: load_nack
  target:
    module: lsu
    port: dcache_load_nack
  mode: shared_event
- name: dcache_probe_release_to_lsu
  source:
    module: dcache
    port: probe_release
  target:
    module: lsu
    port: dcache_probe_release
  mode: shared_event
- name: dcache_long_latency_response_to_lsu
  source:
    module: dcache
    port: long_latency_response
  target:
    module: lsu
    port: dcache_long_latency_response
  mode: shared_event
- name: core_store_to_coherence
  source:
    module: rob
    port: arch_store
  target:
    module: coherence
    port: visible_store
  mode: shared_event
- name: coherence_probe_to_dcache
  source:
    module: coherence
    port: probe_receive
  target:
    module: dcache
    port: probe_receive
  mode: shared_event
- name: mshr_grant_to_coherence
  source:
    module: mshr
    port: grant_data
  target:
    module: coherence
    port: grant_data
  mode: shared_event
- name: dcache_mshr_request_to_mshr
  source:
    module: dcache
    port: mshr_request
  target:
    module: mshr
    port: request
  mode: shared_event
- name: mshr_response_to_dcache
  source:
    module: mshr
    port: response
  target:
    module: dcache
    port: mshr_response
  mode: shared_event
- name: core_branch_kill_to_mshr
  source:
    module: rob
    port: branch_kill
  target:
    module: mshr
    port: branch_kill
  mode: shared_event
- name: core_exception_to_mshr
  source:
    module: rob
    port: exception
  target:
    module: mshr
    port: exception
  mode: shared_event
constraints:
- node: binary
  op: lt
  left:
    node: event_field
    event_id: store_visible
    field: cycle
    sort:
      name: int
  right:
    node: event_field
    event_id: probe_receive
    field: cycle
    sort:
      name: int
- node: binary
  op: lt
  left:
    node: event_field
    event_id: commit_older
    field: cycle
    sort:
      name: int
  right:
    node: event_field
    event_id: commit_younger
    field: cycle
    sort:
      name: int
- node: unary
  op: not
  operand:
    node: event_field
    event_id: memory_order_exception_1
    field: occurs
    sort:
      name: bool
- node: unary
  op: not
  operand:
    node: event_field
    event_id: younger_squash
    field: occurs
    sort:
      name: bool
- node: unary
  op: not
  operand:
    node: event_field
    event_id: branch_kill_0
    field: occurs
    sort:
      name: bool
- node: unary
  op: not
  operand:
    node: event_field
    event_id: exception_0
    field: occurs
    sort:
      name: bool
roles:
- name: init_write
  event_type: Arch.InitWrite
  exports:
    op_id: fields.op_id
    address: fields.address
    value: fields.value
- name: older_load
  event_type: Arch.Load
  where:
    fields.hart: 0
    fields.program_index: 0
  exports:
    op_id: fields.op_id
    address: fields.address
    ldq_idx: annotations.microarch.ldq_idx
    mshr_id: annotations.microarch.mshr_id
- name: younger_load
  event_type: Arch.Load
  where:
    fields.hart: 0
    fields.program_index: 1
  exports:
    op_id: fields.op_id
    address: fields.address
    ldq_idx: annotations.microarch.ldq_idx
- name: visible_store
  event_type: Arch.Store
  where:
    fields.hart: 1
    fields.program_index: 0
  exports:
    op_id: fields.op_id
    address: fields.address
    value: fields.value
- name: loads
  event_type: Arch.Load
  cardinality: many
  min_matches: 1
  exports:
    op_id: fields.op_id
    address: fields.address
    hart: fields.hart
    program_index: fields.program_index
    cycle: cycle
    ldq_idx: annotations.microarch.ldq_idx
    byte_mask: fields.byte_mask
  derived:
    dispatch_event_type: {kind: constant, value: Arch.Load}
  description: All observed loads in this bounded trace; used to instantiate generic LDQ entry state and lifecycle rules.
- name: local_stores
  event_type: Arch.Store
  where:
    fields.hart: 0
  cardinality: many
  min_matches: 0
  exports:
    op_id: fields.op_id
    address: fields.address
    value: fields.value
    hart: fields.hart
    program_index: fields.program_index
    byte_mask: fields.byte_mask
    cycle: cycle
    stq_idx: annotations.microarch.stq_idx
    is_amo: annotations.microarch.is_amo
  derived:
    dispatch_event_type: {kind: constant, value: Arch.Store}
- name: fences
  event_type: Arch.Fence
  where:
    fields.hart: 0
  cardinality: many
  min_matches: 0
  exports:
    op_id: fields.op_id
    hart: fields.hart
    program_index: fields.program_index
    cycle: cycle
    stq_idx: annotations.microarch.stq_idx
  derived:
    dispatch_event_type: {kind: constant, value: Arch.Fence}
- name: mshr_requests
  event_type: Arch.Load
  where:
    annotations.microarch.uses_mshr: true
  cardinality: many
  min_matches: 1
  exports:
    op_id: fields.op_id
    queue_kind: annotations.microarch.queue_kind
    queue_idx: annotations.microarch.queue_idx
    address: fields.address
    value: annotations.microarch.value
    mem_kind: annotations.microarch.mem_kind
    mshr_id: annotations.microarch.mshr_id
    tag_match: annotations.microarch.tag_match
    old_line_dirty: annotations.microarch.old_line_dirty
    needs_acquire: annotations.microarch.needs_acquire
    grant_has_data: annotations.microarch.grant_has_data
    secondary: annotations.microarch.secondary
    requires_second_acquire: annotations.microarch.requires_second_acquire
    is_hit_again: annotations.microarch.is_hit_again
    is_probe: annotations.microarch.is_probe
    sdq_id: annotations.microarch.sdq_id
  description: All bounded cacheable operations explicitly routed through an MSHR in this trace.
- name: mshr_instances
  event_type: Arch.Load
  where:
    annotations.microarch.uses_mshr: true
  cardinality: many
  min_matches: 1
  distinct_by: annotations.microarch.mshr_id
  exports:
    op_id: fields.op_id
    address: fields.address
    mshr_id: annotations.microarch.mshr_id
    grant_has_data: annotations.microarch.grant_has_data
    needs_acquire: annotations.microarch.needs_acquire
  description: One representative primary request per concrete MSHR id.
- name: io_requests
  event_type: IOMSHR.Request
  cardinality: many
  min_matches: 0
  exports:
    op_id: fields.op_id
    address: fields.address
    value: fields.value
    mem_kind: fields.mem_kind
    io_id: fields.io_id
