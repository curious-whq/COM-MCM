schema_version: umcm.composition.v0.15.0
name: boom-sifive-inclusive-coherence-blind-v021
horizon: 32
metadata:
  version: 0.21.0
  purpose: Source-pinned BOOM L1 TileLink client plus the matching Chipyard SiFive InclusiveCache.
  encapsulation: strict
  hierarchy: ports-only-public-surface
  bounds: {harts: 2, transactions_per_line: serialized, transfer: one-line-event}
modules:
- {name: boom_l1_coherence_client_v021, path: ../model/search/boom_l1_client_v021.yaml}
- {name: sifive_inclusive_l2_v021, path: ../model/search/inclusive_l2_v021.yaml}
connections:
- name: l1_acquire_to_l2
  source: {module: boom_l1_coherence_client_v021, port: acquire}
  target: {module: sifive_inclusive_l2_v021, port: acquire}
  mode: shared_event
- name: l2_probe_to_l1
  source: {module: sifive_inclusive_l2_v021, port: probe}
  target: {module: boom_l1_coherence_client_v021, port: probe}
  mode: shared_event
- name: l1_probe_ack_to_l2
  source: {module: boom_l1_coherence_client_v021, port: probe_ack}
  target: {module: sifive_inclusive_l2_v021, port: probe_ack}
  mode: shared_event
- name: l2_grant_to_l1
  source: {module: sifive_inclusive_l2_v021, port: grant}
  target: {module: boom_l1_coherence_client_v021, port: grant}
  mode: shared_event
- name: l1_grant_ack_to_l2
  source: {module: boom_l1_coherence_client_v021, port: grant_ack}
  target: {module: sifive_inclusive_l2_v021, port: grant_ack}
  mode: shared_event
- name: l1_release_to_l2
  source: {module: boom_l1_coherence_client_v021, port: release}
  target: {module: sifive_inclusive_l2_v021, port: release}
  mode: shared_event
- name: l2_release_ack_to_l1
  source: {module: sifive_inclusive_l2_v021, port: release_ack}
  target: {module: boom_l1_coherence_client_v021, port: release_ack}
  mode: shared_event
constraints: []
roles:
- name: lines
  event_type: Coherence.LineInit
  cardinality: many
  min_matches: 1
  distinct_by: fields.line_id
  exports:
    line_id: fields.line_id
    address: fields.address
    value: fields.value
    version: fields.version
    source_op_id: fields.source_op_id
    h0_perm: fields.h0_perm
    h1_perm: fields.h1_perm
    l2_state: fields.l2_state
    owner: fields.owner
- name: accesses
  event_type: Coherence.Access
  cardinality: many
  min_matches: 1
  exports:
    op_id: fields.op_id
    hart: fields.hart
    program_index: fields.program_index
    line_id: fields.line_id
    address: fields.address
    mem_kind: fields.mem_kind
    write_value: fields.write_value
    after_op_id: fields.after_op_id
- name: evictions
  event_type: Coherence.Evict
  cardinality: many
  min_matches: 0
  exports:
    txn_id: fields.txn_id
    hart: fields.hart
    line_id: fields.line_id
    address: fields.address
    after_op_id: fields.after_op_id
