schema_version: umcm.composition.v0.15.0
name: xiangshan-scalar-load-replay-v0.7
horizon: 56
metadata:
  version: 0.7.0
  stage: 7
  purpose: Stage 5 aligned scalar-load failure feeding the Stage 7 replay queue.
  encapsulation: strict
  hierarchy: ports-only-public-surface
modules:
- {name: scalar_load_pipeline, path: ../model/load/scalar_pipeline.yaml}
- {name: load_replay_queue, path: ../model/load/replay_queue.yaml}
connections:
- name: scalar_update_to_replay_queue
  source: {module: scalar_load_pipeline, port: queue_update}
  target: {module: load_replay_queue, port: pipeline_update}
  mode: shared_event
roles:
- name: load_ops
  event_type: Core.MemoryIssue
  where:
    fields.mem_kind: load
    fields.vector: false
  cardinality: many
  min_matches: 1
  exports:
    op_id: fields.op_id
    hart: fields.hart
    program_index: fields.program_index
    rob_idx: fields.rob_idx
    mem_kind: fields.mem_kind
    vaddr: fields.vaddr
    size: fields.size
    byte_mask: fields.byte_mask
    lq_idx: fields.lq_idx
    tlb_instance: fields.tlb_instance
    vpn: fields.vpn
    asid: fields.asid
    vmid: fields.vmid
    translation_stage: fields.translation_stage
constraints: []
