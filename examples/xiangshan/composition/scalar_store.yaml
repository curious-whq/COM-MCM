schema_version: umcm.composition.v0.15.0
name: xiangshan-scalar-store-v0.8
horizon: 40
metadata:
  version: 0.8.0
  stage: 8
  purpose: Executable aligned scalar-store STA S0-S3 plus independent STD data path.
  encapsulation: strict
  hierarchy: ports-only-public-surface
modules:
- {name: scalar_store_pipeline, path: ../model/store/scalar_pipeline.yaml}
connections: []
roles: &store_roles
- name: store_ops
  event_type: Core.MemoryIssue
  where:
    fields.mem_kind: store
    fields.vector: false
  cardinality: many
  min_matches: 1
  exports:
    op_id: fields.op_id
    hart: fields.hart
    program_index: fields.program_index
    rob_idx: fields.rob_idx
    mem_kind: fields.mem_kind
    vaddr: fields.vaddr
    write_value: fields.write_value
    size: fields.size
    byte_mask: fields.byte_mask
    sq_idx: fields.sq_idx
    tlb_instance: fields.tlb_instance
    vpn: fields.vpn
    asid: fields.asid
    vmid: fields.vmid
    translation_stage: fields.translation_stage
- name: translation_observations
  event_type: MMU.TranslateResponse
  cardinality: many
  min_matches: 0
  exports:
    op_id: fields.op_id
    paddr: fields.paddr
- name: address_observations
  event_type: Store.AddressReady
  cardinality: many
  min_matches: 0
  exports:
    op_id: fields.op_id
    sq_idx: fields.sq_idx
    address: fields.address
- name: data_observations
  event_type: Store.DataReady
  cardinality: many
  min_matches: 0
  exports:
    op_id: fields.op_id
    sq_idx: fields.sq_idx
    value: fields.value
constraints: []
