schema_version: umcm.composition.v0.15.0
name: xiangshan-scalar-store-sbuffer-v0.10
horizon: 80
metadata:
  version: 0.10.0
  stage: 10
  purpose: Integrated scalar store pipeline, VSQ retirement, PSQ commit/drain, SBuffer merge/drain, and L1D acceptance.
  encapsulation: strict
  hierarchy: ports-only-public-surface
modules:
- {name: scalar_store_pipeline, path: ../model/store/scalar_pipeline.yaml}
- {name: virtual_store_queue, path: ../model/store/virtual_queue.yaml}
- {name: physical_store_queue, path: ../model/store/physical_queue.yaml}
- {name: sbuffer, path: ../model/store/sbuffer.yaml}
connections:
- {name: psq_to_sbuffer, source: {module: physical_store_queue, port: store_drain}, target: {module: sbuffer, port: store_drain}, mode: shared_event}
roles:
- name: store_ops
  event_type: Core.MemoryIssue
  where: {fields.mem_kind: store, fields.vector: false}
  cardinality: many
  min_matches: 1
  exports:
    op_id: fields.op_id
    hart: fields.hart
    program_index: fields.program_index
    rob_idx: fields.rob_idx
    mem_kind: fields.mem_kind
    vaddr: fields.vaddr
    write_value: fields.write_value
    size: fields.size
    byte_mask: fields.byte_mask
    sq_idx: fields.sq_idx
    tlb_instance: fields.tlb_instance
    vpn: fields.vpn
    asid: fields.asid
    vmid: fields.vmid
    translation_stage: fields.translation_stage
- name: load_ops
  event_type: Core.MemoryIssue
  where: {fields.mem_kind: load, fields.vector: false}
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, hart: fields.hart, program_index: fields.program_index, rob_idx: fields.rob_idx, byte_mask: fields.byte_mask, lq_idx: fields.lq_idx}
- name: layouts
  event_type: Store.Layout
  cardinality: many
  min_matches: 0
  exports:
    op_id: fields.op_id
    sq_idx: fields.sq_idx
    kind: fields.kind
    cross_page: fields.cross_page
    low_address: fields.low_address
    high_address: fields.high_address
    low_value: fields.low_value
    high_value: fields.high_value
    low_mask: fields.low_mask
    high_mask: fields.high_mask
- name: unaligned_tails
  event_type: Store.UnalignedTailReady
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, sq_idx: fields.sq_idx, address: fields.address}
- name: translation_observations
  event_type: MMU.TranslateResponse
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, paddr: fields.paddr}
- name: address_observations
  event_type: Store.AddressReady
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, sq_idx: fields.sq_idx, address: fields.address}
- name: data_observations
  event_type: Store.DataReady
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, sq_idx: fields.sq_idx, value: fields.value}
- name: sbuffer_entries
  event_type: SBuffer.LineLayout
  cardinality: many
  min_matches: 1
  exports:
    entry_id: fields.entry_id
    hart: fields.hart
    entry_order: fields.entry_order
    line_address: fields.line_address
    member_count: fields.member_count
    first_op_id: fields.first_op_id
    first_beat: fields.first_beat
    first_address: fields.first_address
    first_value: fields.first_value
    first_drain_mask: fields.first_drain_mask
    first_line_data: fields.first_line_data
    first_line_mask: fields.first_line_mask
    second_op_id: fields.second_op_id
    second_beat: fields.second_beat
    second_address: fields.second_address
    second_value: fields.second_value
    second_drain_mask: fields.second_drain_mask
    second_line_data: fields.second_line_data
    second_line_mask: fields.second_line_mask
    drain_reason: fields.drain_reason
- name: fences
  event_type: Core.FenceRequest
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, hart: fields.hart, fence_kind: fields.fence_kind, cycle: cycle}
constraints: []
