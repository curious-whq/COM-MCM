schema_version: umcm.composition.v0.15.0
name: xiangshan-scalar-store-physical-queue-v0.9
horizon: 64
metadata:
  version: 0.9.0
  stage: 9
  purpose: Integrated scalar STA/STD, VirtualStoreQueue retirement, PhysicalStoreQueue commit, and cached SBuffer handoff.
  encapsulation: strict
  hierarchy: ports-only-public-surface
modules:
- {name: scalar_store_pipeline, path: ../model/store/scalar_pipeline.yaml}
- {name: virtual_store_queue, path: ../model/store/virtual_queue.yaml}
- {name: physical_store_queue, path: ../model/store/physical_queue.yaml}
connections: []
roles:
- name: store_ops
  event_type: Core.MemoryIssue
  where:
    fields.mem_kind: store
    fields.vector: false
  cardinality: many
  min_matches: 1
  exports:
    op_id: fields.op_id
    hart: fields.hart
    program_index: fields.program_index
    rob_idx: fields.rob_idx
    mem_kind: fields.mem_kind
    vaddr: fields.vaddr
    write_value: fields.write_value
    size: fields.size
    byte_mask: fields.byte_mask
    sq_idx: fields.sq_idx
    tlb_instance: fields.tlb_instance
    vpn: fields.vpn
    asid: fields.asid
    vmid: fields.vmid
    translation_stage: fields.translation_stage
- name: load_ops
  event_type: Core.MemoryIssue
  where:
    fields.mem_kind: load
    fields.vector: false
  cardinality: many
  min_matches: 0
  exports:
    op_id: fields.op_id
    hart: fields.hart
    program_index: fields.program_index
    rob_idx: fields.rob_idx
    byte_mask: fields.byte_mask
    lq_idx: fields.lq_idx
- name: layouts
  event_type: Store.Layout
  cardinality: many
  min_matches: 0
  exports:
    op_id: fields.op_id
    sq_idx: fields.sq_idx
    kind: fields.kind
    cross_page: fields.cross_page
    low_address: fields.low_address
    high_address: fields.high_address
    low_value: fields.low_value
    high_value: fields.high_value
    low_mask: fields.low_mask
    high_mask: fields.high_mask
- name: unaligned_tails
  event_type: Store.UnalignedTailReady
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, sq_idx: fields.sq_idx, address: fields.address}
- name: translation_observations
  event_type: MMU.TranslateResponse
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, paddr: fields.paddr}
- name: address_observations
  event_type: Store.AddressReady
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, sq_idx: fields.sq_idx, address: fields.address}
- name: data_observations
  event_type: Store.DataReady
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, sq_idx: fields.sq_idx, value: fields.value}
constraints: []
