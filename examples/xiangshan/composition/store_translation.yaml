schema_version: umcm.composition.v0.15.0
name: xiangshan-store-translation-v0.8
horizon: 48
metadata:
  version: 0.8.0
  stage: 8
  purpose: Integrated scalar-store STA/STD pipeline and Stage 3 L1 store DTLB hit path.
  encapsulation: strict
  hierarchy: ports-only-public-surface
modules:
- {name: scalar_store_pipeline, path: ../model/store/scalar_pipeline.yaml}
- {name: dtlb, path: ../model/mmu/l1_dtlb.yaml}
connections:
- name: scalar_store_to_l1_dtlb
  source: {module: scalar_store_pipeline, port: translate_request}
  target: {module: dtlb, port: store_request}
  mode: shared_event
- name: l1_dtlb_to_scalar_store
  source: {module: dtlb, port: response}
  target: {module: scalar_store_pipeline, port: translate_response}
  mode: shared_event
roles:
- name: store_ops
  event_type: Core.MemoryIssue
  where:
    fields.mem_kind: store
    fields.vector: false
  cardinality: many
  min_matches: 1
  exports:
    op_id: fields.op_id
    hart: fields.hart
    program_index: fields.program_index
    rob_idx: fields.rob_idx
    mem_kind: fields.mem_kind
    vaddr: fields.vaddr
    write_value: fields.write_value
    size: fields.size
    byte_mask: fields.byte_mask
    sq_idx: fields.sq_idx
    tlb_instance: fields.tlb_instance
    vpn: fields.vpn
    asid: fields.asid
    vmid: fields.vmid
    translation_stage: fields.translation_stage
- name: pages
  event_type: MMU.PageMap
  cardinality: many
  min_matches: 1
  exports:
    map_id: fields.map_id
    hart: fields.hart
    entry_id: fields.entry_id
    tlb_instance: fields.tlb_instance
    vpn: fields.vpn
    paddr: fields.paddr
    asid: fields.asid
    vmid: fields.vmid
    translation_stage: fields.translation_stage
    initial_valid: fields.initial_valid
- name: translation_requests
  event_type: MMU.TranslateRequest
  cardinality: many
  min_matches: 1
  exports:
    op_id: fields.op_id
    hart: fields.hart
    tlb_instance: fields.tlb_instance
    vaddr: fields.vaddr
    vpn: fields.vpn
    attempt: fields.attempt
    access_kind: fields.access_kind
    size: fields.size
    asid: fields.asid
    vmid: fields.vmid
    translation_stage: fields.translation_stage
- name: translation_observations
  event_type: MMU.TranslateResponse
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, paddr: fields.paddr}
- name: address_observations
  event_type: Store.AddressReady
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, sq_idx: fields.sq_idx, address: fields.address}
- name: data_observations
  event_type: Store.DataReady
  cardinality: many
  min_matches: 0
  exports: {op_id: fields.op_id, sq_idx: fields.sq_idx, value: fields.value}
constraints: []
