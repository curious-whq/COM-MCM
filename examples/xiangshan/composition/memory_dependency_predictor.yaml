schema_version: umcm.composition.v0.15.0
name: xiangshan-memory-dependency-predictor-v0.7
horizon: 48
metadata:
  version: 0.7.0
  stage: 7
  purpose: Executable SSIT training and lookup with bounded LFST allocation, predicted wait, store-issue release, and redirect recovery.
  encapsulation: strict
  hierarchy: ports-only-public-surface
modules:
- {name: memory_dependency_predictor, path: ../model/core/memory_dependency_predictor.yaml}
connections: []
roles:
- name: mdp_entries
  event_type: MDP.EntryConfig
  cardinality: many
  min_matches: 1
  exports:
    entry_id: fields.entry_id
    hart: fields.hart
    pc: fields.pc
    initial_valid: fields.initial_valid
    initial_ssid: fields.initial_ssid
    initial_strict: fields.initial_strict
- name: mdp_trainings
  event_type: MDP.Train
  cardinality: many
  min_matches: 0
  exports:
    txn_id: fields.txn_id
    hart: fields.hart
    load_pc: fields.load_pc
    store_pc: fields.store_pc
- name: mdp_lookups
  event_type: MDP.Lookup
  cardinality: many
  min_matches: 1
  exports:
    op_id: fields.op_id
    hart: fields.hart
    program_index: fields.program_index
    rob_idx: fields.rob_idx
    pc: fields.pc
    mem_kind: fields.mem_kind
constraints: []
