  - SQ.Allocate
  - SQ.RedirectRecover
  - SQ.Retire
  private_state_names:
  - VSQ[SQHEAD].allocated
  - VSQ[SQTAIL].allocated
  private_transformation_names:
  - committed_store_retires_vsq_0
  - committed_store_retires_vsq_1
  - redirect_recovery_reclaims_vsq_0
  - redirect_recovery_reclaims_vsq_1
  - redirect_selects_live_vsq_entry_0
  - redirect_selects_live_vsq_entry_1
  - store_issue_allocates_vsq_0
  - store_issue_allocates_vsq_1
  - younger_vsq_retire_waits_for_older_0
  - younger_vsq_retire_waits_for_older_1
  - younger_vsq_retire_waits_for_older_2
  - younger_vsq_retire_waits_for_older_3
