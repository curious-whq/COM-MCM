- axes:
  - {over: mdp_lookups, as: store_lookup}
  - {over: mdp_lookups, as: load_lookup}
  include:
    slots:
    - id: wait_prediction_${product.repeat_index}
      type: MDP.WaitPrediction
      required: false
      fields:
        op_id: ${load_lookup.op_id}
        source_op_id: ${store_lookup.op_id}
        hart: ${load_lookup.hart}
        pc: ${load_lookup.pc}
        ssid: {$expr: {node: symbol, name: "mdp::${store_lookup.op_id}::${load_lookup.op_id}::ssid", sort: {name: int}}}
        wait_for_rob_idx: ${store_lookup.rob_idx}
        strict: {$expr: {node: symbol, name: "mdp::${load_lookup.op_id}::strict", sort: {name: bool}}}
    transformations:
    - name: matching_pending_store_predicts_load_wait_${product.repeat_index}
      inputs:
      - {role: store_read, type: MDP.SSITRead}
      - {role: allocate, type: MDP.LFSTAllocate}
      - {role: load_read, type: MDP.SSITRead}
      outputs: [{role: prediction, type: MDP.WaitPrediction}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: store_read, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${store_lookup.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: allocate, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${store_lookup.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: load_read, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${load_lookup.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: store_read, field: mem_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: store}}
        - {node: binary, op: eq, left: {node: event_field, event_id: load_read, field: mem_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: load}}
        - {node: binary, op: eq, left: {node: event_field, event_id: store_read, field: ssid, sort: {name: int}}, right: {node: event_field, event_id: load_read, field: ssid, sort: {name: int}}}
        - {node: binary, op: lt, left: {node: literal, sort: {name: int}, value: "${store_lookup.program_index}"}, right: {node: literal, sort: {name: int}, value: "${load_lookup.program_index}"}}
      output_when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: prediction, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${load_lookup.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: prediction, field: source_op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${store_lookup.op_id}"}}
      ensure:
      - {node: binary, op: eq, left: {node: event_field, event_id: prediction, field: ssid, sort: {name: int}}, right: {node: event_field, event_id: load_read, field: ssid, sort: {name: int}}}
      - {node: binary, op: eq, left: {node: event_field, event_id: prediction, field: strict, sort: {name: bool}}, right: {node: event_field, event_id: load_read, field: strict, sort: {name: bool}}}
      - {node: binary, op: eq, left: {node: event_field, event_id: prediction, field: cycle, sort: {name: int}}, right: {node: binary, op: add, left: {node: event_field, event_id: load_read, field: cycle, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: 1}}}
      state_requirements:
      - {state: "LFST[${store_lookup.op_id}].pending", at: load_read, op: eq, value: {node: literal, sort: {name: bool}, value: true}}
      state_mode: guard
      exact: true
      tags: [mdp, lfst, prediction, source:StoreSet.scala:450-485]
    - name: wait_prediction_delays_load_until_store_issue_${product.repeat_index}
      inputs:
      - {role: prediction, type: MDP.WaitPrediction}
      - {role: store_issue, type: Core.MemoryIssue}
      - {role: load_issue, type: Core.MemoryIssue}
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: prediction, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${load_lookup.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: prediction, field: source_op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${store_lookup.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: store_issue, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${store_lookup.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: load_issue, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${load_lookup.op_id}"}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: prediction, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: store_issue, field: cycle, sort: {name: int}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: store_issue, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: load_issue, field: cycle, sort: {name: int}}}
      tags: [mdp, ordering-only, source:Dispatch.scala:778-792]
