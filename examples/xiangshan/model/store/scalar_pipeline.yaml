repeat_product:
- axes:
  - {over: translation_observations, as: translation}
  - {over: address_observations, as: address_observation}
  include:
    transformations:
    - name: observed_store_address_matches_translation_${product.repeat_index}
      inputs:
      - {role: response, type: MMU.TranslateResponse}
      - {role: address, type: Store.AddressReady}
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: response, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${translation.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: response, field: paddr, sort: {name: address, width: 64}}, right: {node: literal, sort: {name: address, width: 64}, value: "${translation.paddr}"}}
        - {node: unary, op: not, operand: {node: event_field, event_id: response, field: replay, sort: {name: bool}}}
        - {node: unary, op: not, operand: {node: event_field, event_id: response, field: fault, sort: {name: bool}}}
        - {node: binary, op: eq, left: {node: event_field, event_id: address, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${address_observation.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: address, field: sq_idx, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${address_observation.sq_idx}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: address, field: address, sort: {name: address, width: 64}}, right: {node: literal, sort: {name: address, width: 64}, value: "${address_observation.address}"}}
        - {node: binary, op: eq, left: {node: literal, sort: {name: op_id}, value: "${translation.op_id}"}, right: {node: literal, sort: {name: op_id}, value: "${address_observation.op_id}"}}
      ensure:
      - {node: binary, op: eq, left: {node: event_field, event_id: response, field: paddr, sort: {name: address, width: 64}}, right: {node: event_field, event_id: address, field: address, sort: {name: address, width: 64}}}
      tags: [store, observed-output, address-integrity]
- axes:
  - {over: store_ops, as: store}
  - {over: data_observations, as: data_observation}
  include:
    transformations:
    - name: observed_store_data_matches_std_${product.repeat_index}
      inputs: [{role: data, type: Store.DataReady}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: literal, sort: {name: op_id}, value: "${store.op_id}"}, right: {node: literal, sort: {name: op_id}, value: "${data_observation.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: data, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${data_observation.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: data, field: sq_idx, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${data_observation.sq_idx}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: data, field: value, sort: {name: value, width: 64}}, right: {node: literal, sort: {name: value, width: 64}, value: "${data_observation.value}"}}
      ensure:
      - {node: binary, op: eq, left: {node: event_field, event_id: data, field: value, sort: {name: value, width: 64}}, right: {node: literal, sort: {name: value, width: 64}, value: "${store.write_value}"}}
      - {node: binary, op: eq, left: {node: event_field, event_id: data, field: sq_idx, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${store.sq_idx}"}}
      - {node: binary, op: eq, left: {node: event_field, event_id: data, field: byte_mask, sort: {name: bv, width: 64}}, right: {node: literal, sort: {name: bv, width: 64}, value: "${store.byte_mask}"}}
      tags: [store, observed-output, data-integrity]
