        - {node: binary, op: eq, left: {node: event_field, event_id: invalidate, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: lookup, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: lt, left: {node: event_field, event_id: sfence, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: request, field: cycle, sort: {name: int}}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: invalidate, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: lookup, field: cycle, sort: {name: int}}}
      tags: [l2tlb, sfence, lookup-order]

- axes:
  - {over: backend_requests, as: op}
  - {over: pages, as: page}
  - {over: protection_regions, as: protection}
  include:
    slots:
    - id: pmp_check_${product.repeat_index}
      type: MMU.ProtectionCheck
      required: false
      fields: &pmp_check_fields
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        map_id: ${page.map_id}
        region_id: ${protection.region_id}
        vpn: ${op.vpn}
        paddr: ${page.paddr}
        access_kind: ${op.access_kind}
        translation_stage: ${op.translation_stage}
        check_kind: pmp
        allowed: ${protection.pmp_allow}
    - id: pma_check_${product.repeat_index}
      type: MMU.ProtectionCheck
      required: false
      fields:
        <<: *pmp_check_fields
        check_kind: pma
        allowed: ${protection.pma_allow}
        cacheable: ${protection.cacheable}
    - id: bitmap_check_${product.repeat_index}
      type: MMU.ProtectionCheck
      required: false
      fields:
        <<: *pmp_check_fields
        check_kind: bitmap
        allowed: {$expr: {node: symbol, name: "protect::${op.txn_id}::bitmap", sort: {name: bool}}}
    - id: mpt_check_${product.repeat_index}
      type: MMU.ProtectionCheck
      required: false
      fields:
        <<: *pmp_check_fields
        check_kind: mpt
        allowed: {$expr: {node: symbol, name: "protect::${op.txn_id}::mpt", sort: {name: bool}}}
    - id: backend_success_response_${product.repeat_index}
      type: MMU.PTWResponse
      required: false
      fields:
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        vaddr: ${op.vaddr}
        vpn: ${op.vpn}
        access_kind: ${op.access_kind}
        asid: ${op.asid}
        vmid: ${op.vmid}
        translation_stage: ${op.translation_stage}
        paddr: ${page.paddr}
        gpaddr: ${page.gpaddr}
        cacheable: ${protection.cacheable}
        fault: false
        cause: none
    - id: backend_access_fault_${product.repeat_index}
      type: MMU.TranslationFault
      required: false
      fields:
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        map_id: ${page.map_id}
        region_id: ${protection.region_id}
        vpn: ${op.vpn}
        paddr: ${page.paddr}
        gpaddr: ${page.gpaddr}
        access_kind: ${op.access_kind}
        translation_stage: ${op.translation_stage}
        fault: true
        fault_source: protection
        cause: "${op.access_kind}_access_fault"
    - id: backend_access_fault_response_${product.repeat_index}
      type: MMU.PTWResponse
      required: false
      fields:
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        vaddr: ${op.vaddr}
        vpn: ${op.vpn}
        access_kind: ${op.access_kind}
        asid: ${op.asid}
        vmid: ${op.vmid}
        translation_stage: ${op.translation_stage}
        paddr: ${page.paddr}
        gpaddr: ${page.gpaddr}
        cacheable: ${protection.cacheable}
        fault: true
        cause: "${op.access_kind}_access_fault"
    - id: l2tlb_refill_${product.repeat_index}
      type: MMU.L2TLBRefill
      required: false
      fields:
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        map_id: ${page.map_id}
        region_id: ${protection.region_id}
        vpn: ${op.vpn}
        paddr: ${page.paddr}
        gpaddr: ${page.gpaddr}
        asid: ${op.asid}
        vmid: ${op.vmid}
        access_kind: ${op.access_kind}
        translation_stage: ${op.translation_stage}
        level: ${page.page_level}
    transformations:
    - name: resolved_translation_checks_pmp_${product.repeat_index}
      inputs: [{role: resolved, type: MMU.PTWResolved}]
      outputs: [{role: check, type: MMU.ProtectionCheck}]
      when: &resolved_region_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: resolved, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: resolved, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
        - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${op.access_kind}"}, right: {node: literal, sort: {name: string}, value: "${protection.access_kind}"}}
        - {node: binary, op: eq, left: {node: literal, sort: {name: int}, value: "${op.hart}"}, right: {node: literal, sort: {name: int}, value: "${protection.hart}"}}
      output_when: &pmp_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: region_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${protection.region_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: check_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: pmp}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: resolved, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: check, field: cycle, sort: {name: int}}}
      exact: true
      tags: [protection, pmp, source:PMP.scala:190-289,368-520]
    - name: resolved_translation_checks_pma_${product.repeat_index}
      inputs: [{role: resolved, type: MMU.PTWResolved}]
      outputs: [{role: check, type: MMU.ProtectionCheck}]
      when: *resolved_region_scope
      output_when: &pma_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: region_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${protection.region_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: check_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: pma}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: resolved, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: check, field: cycle, sort: {name: int}}}
      exact: true
      tags: [protection, pma, source:PMA.scala:201-265]
    - name: resolved_translation_checks_bitmap_${product.repeat_index}
      inputs: [{role: resolved, type: MMU.PTWResolved}]
      outputs: [{role: check, type: MMU.ProtectionCheck}]
      when: *resolved_region_scope
      output_when: &bitmap_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: region_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${protection.region_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: check_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: bitmap}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: resolved, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: check, field: cycle, sort: {name: int}}}
      - node: binary
        op: eq
        left: {node: event_field, event_id: check, field: allowed, sort: {name: bool}}
        right:
          node: nary
          op: or
          operands:
          - {node: unary, op: not, operand: {node: literal, sort: {name: bool}, value: "${protection.bitmap_enabled}"}}
          - {node: literal, sort: {name: bool}, value: "${protection.bitmap_allow}"}
      exact: true
      tags: [protection, bitmap, default-config, source:BitmapCheck.scala:124-358]
    - name: resolved_translation_checks_mpt_${product.repeat_index}
      inputs: [{role: resolved, type: MMU.PTWResolved}]
      outputs: [{role: check, type: MMU.ProtectionCheck}]
      when: *resolved_region_scope
      output_when: &mpt_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: region_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${protection.region_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: check, field: check_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: mpt}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: resolved, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: check, field: cycle, sort: {name: int}}}
      - node: binary
        op: eq
        left: {node: event_field, event_id: check, field: allowed, sort: {name: bool}}
        right:
          node: nary
          op: or
          operands:
          - {node: unary, op: not, operand: {node: literal, sort: {name: bool}, value: "${protection.mpt_enabled}"}}
          - {node: literal, sort: {name: bool}, value: "${protection.mpt_allow}"}
      exact: true
      tags: [protection, mpt, optional-config, source:MptChecker.scala:31-151,758-947]
    - name: protection_allows_response_${product.repeat_index}
      inputs:
      - {role: pmp, type: MMU.ProtectionCheck}
      - {role: pma, type: MMU.ProtectionCheck}
      - {role: bitmap, type: MMU.ProtectionCheck}
      - {role: mpt, type: MMU.ProtectionCheck}
      outputs: [{role: response, type: MMU.PTWResponse}]
      when: &all_protection_allows
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: pmp, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: pmp, field: check_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: pmp}}
        - {node: event_field, event_id: pmp, field: allowed, sort: {name: bool}}
        - {node: binary, op: eq, left: {node: event_field, event_id: pma, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: pma, field: check_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: pma}}
        - {node: event_field, event_id: pma, field: allowed, sort: {name: bool}}
        - {node: binary, op: eq, left: {node: event_field, event_id: bitmap, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: bitmap, field: check_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: bitmap}}
        - {node: event_field, event_id: bitmap, field: allowed, sort: {name: bool}}
        - {node: binary, op: eq, left: {node: event_field, event_id: mpt, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: mpt, field: check_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: mpt}}
        - {node: event_field, event_id: mpt, field: allowed, sort: {name: bool}}
      output_when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: response, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: unary, op: not, operand: {node: event_field, event_id: response, field: fault, sort: {name: bool}}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: pmp, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: response, field: cycle, sort: {name: int}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: pma, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: response, field: cycle, sort: {name: int}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: bitmap, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: response, field: cycle, sort: {name: int}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: mpt, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: response, field: cycle, sort: {name: int}}}
      - {node: binary, op: eq, left: {node: event_field, event_id: response, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.op_id}"}}
      - {node: binary, op: eq, left: {node: event_field, event_id: response, field: vpn, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${op.vpn}"}}
      - {node: binary, op: eq, left: {node: event_field, event_id: response, field: paddr, sort: {name: address, width: 64}}, right: {node: literal, sort: {name: address, width: 64}, value: "${page.paddr}"}}
      - {node: binary, op: eq, left: {node: event_field, event_id: response, field: gpaddr, sort: {name: address, width: 64}}, right: {node: literal, sort: {name: address, width: 64}, value: "${page.gpaddr}"}}
      exact: true
      tags: [translation-backend, success, response]
    - name: protection_denial_raises_access_fault_${product.repeat_index}
      inputs:
      - {role: pmp, type: MMU.ProtectionCheck}
      - {role: pma, type: MMU.ProtectionCheck}
      - {role: bitmap, type: MMU.ProtectionCheck}
      - {role: mpt, type: MMU.ProtectionCheck}
      outputs: [{role: fault, type: MMU.TranslationFault}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: pmp, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: pma, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: bitmap, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: mpt, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - node: nary
          op: or
          operands:
          - {node: unary, op: not, operand: {node: event_field, event_id: pmp, field: allowed, sort: {name: bool}}}
          - {node: unary, op: not, operand: {node: event_field, event_id: pma, field: allowed, sort: {name: bool}}}
          - {node: unary, op: not, operand: {node: event_field, event_id: bitmap, field: allowed, sort: {name: bool}}}
          - {node: unary, op: not, operand: {node: event_field, event_id: mpt, field: allowed, sort: {name: bool}}}
      output_when: &access_fault_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: fault, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: fault, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: fault, field: region_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${protection.region_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: fault, field: cause, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${op.access_kind}_access_fault"}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: pmp, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: fault, field: cycle, sort: {name: int}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: pma, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: fault, field: cycle, sort: {name: int}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: bitmap, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: fault, field: cycle, sort: {name: int}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: mpt, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: fault, field: cycle, sort: {name: int}}}
      exact: true
      tags: [protection, access-fault]
    - name: access_fault_returns_to_l1_${product.repeat_index}
      inputs: [{role: fault, type: MMU.TranslationFault}]
      outputs: [{role: response, type: MMU.PTWResponse}]
      when: *access_fault_scope
      output_when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: response, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: event_field, event_id: response, field: fault, sort: {name: bool}}
        - {node: binary, op: eq, left: {node: event_field, event_id: response, field: cause, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${op.access_kind}_access_fault"}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: fault, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: response, field: cycle, sort: {name: int}}}
      - {node: binary, op: eq, left: {node: event_field, event_id: response, field: paddr, sort: {name: address, width: 64}}, right: {node: literal, sort: {name: address, width: 64}, value: "${page.paddr}"}}
      exact: true
      tags: [protection, access-fault, response]
    - name: successful_walk_refills_l2_${product.repeat_index}
      inputs:
      - {role: miss, type: MMU.L2TLBMiss}
      - {role: pmp, type: MMU.ProtectionCheck}
      - {role: pma, type: MMU.ProtectionCheck}
      - {role: bitmap, type: MMU.ProtectionCheck}
      - {role: mpt, type: MMU.ProtectionCheck}
      outputs: [{role: refill, type: MMU.L2TLBRefill}]
      when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: miss, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - *all_protection_allows
      output_when: &l2_refill_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: refill, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: refill, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: refill, field: region_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${protection.region_id}"}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: pmp, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: refill, field: cycle, sort: {name: int}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: pma, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: refill, field: cycle, sort: {name: int}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: bitmap, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: refill, field: cycle, sort: {name: int}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: mpt, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: refill, field: cycle, sort: {name: int}}}
      state_updates:
