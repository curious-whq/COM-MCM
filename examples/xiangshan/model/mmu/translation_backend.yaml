schema_version: umcm.module.v0.15.0
name: translation_backend
metadata:
  version: 0.4.0
  stage: 4
  source_commit: 50cdcfc2c45d0631591310435835c0180c105489
  source_files:
  - src/main/scala/xiangshan/cache/mmu/L2TLB.scala:61-180,220-241,320-459,476-620,758-864
  - src/main/scala/xiangshan/cache/mmu/L2TLBMissQueue.scala:30-45
  - src/main/scala/xiangshan/cache/mmu/PageTableCache.scala:120-389,588-874,1068-1284
  - src/main/scala/xiangshan/cache/mmu/PageTableWalker.scala:104-802,804-1389,1391-1729
  - src/main/scala/xiangshan/cache/mmu/MMUBundle.scala:780-900,920-1005,1163-1235,1405-1501
  - src/main/scala/xiangshan/cache/mmu/BitmapCheck.scala:31-104,124-358,364-517
  - src/main/scala/xiangshan/cache/mmu/MptChecker.scala:31-151,758-947,1175-1347
  - src/main/scala/xiangshan/backend/fu/PMP.scala:190-289,368-520
  - src/main/scala/xiangshan/backend/fu/PMA.scala:201-265
  - src/main/scala/xiangshan/Parameters.scala:48-80,665-681
  - src/main/scala/top/Configs.scala:241-251
  scope: bounded L2TLB lookup/refill, S1/G-stage PTW, page/guest-page/access faults, PMP/PMA, BitmapCheck, optional MPT, and SFENCE/HFENCE invalidation
  hierarchy: L2TLB, walker, refill, fault, and protection decisions are private; L1 DTLB communication uses public PTW ports
  abstractions:
  - finite PageMap records stand for already-decoded PTE chains; stage validity/access flags summarize leaf format, R/W/X/U/A/D, PBMT, NAPOT, superpage alignment, and privilege checks
  - finite ProtectionMap regions summarize the first matching PMP/PMA entry and the selected Bitmap or MPT permission result
  - DefaultConfig enables BitmapCheck and disables MPT; MPT is retained as a mutually-exclusive optional configuration path
  - exact page-table memory addresses, TileLink beats, cache replacement, walker arbitration, and merge capacity are omitted while causal stage order and fault class are preserved
  - each bounded request has one matching PageMap and one matching ProtectionMap region
ports:
- {name: ptw_request, direction: input, event_type: MMU.PTWRequest, required_connection: false}
- {name: ptw_response, direction: output, event_type: MMU.PTWResponse}
- {name: sfence, direction: input, event_type: Core.SFence, required_connection: false}
internal_events:
- MMU.L2TLBLookup
- MMU.L2TLBHit
- MMU.L2TLBMiss
- MMU.L2TLBRefill
- MMU.L2TLBInvalidate
- MMU.PTWWalk
- MMU.PTWStageComplete
- MMU.PTWResolved
- MMU.TranslationFault
- MMU.ProtectionCheck
slots: []
state_variables: []
transformations: []
constraints: []

repeat:
- over: pages
  as: page
  include:
    state_variables:
    - name: L2TLB.entry[${page.tlb_instance}.${page.map_id}].valid
      sort: {name: bool}
      initial: ${page.l2_initial_valid}
      description: Valid state for one finite combined L2 translation entry.
    slots:
    - id: l2tlb_invalidate_${page.repeat_index}
      type: MMU.L2TLBInvalidate
      required: false
      fields:
        fence_id: {$expr: {node: symbol, name: "l2tlb::${page.map_id}::fence_id", sort: {name: op_id}}}
        hart: ${page.hart}
        tlb_instance: ${page.tlb_instance}
        map_id: ${page.map_id}
        vpn: ${page.vpn}
        asid: ${page.asid}
        vmid: ${page.vmid}
        translation_stage: ${page.translation_stage}
    transformations:
    - name: sfence_invalidates_l2_entry_${page.repeat_index}
      inputs: [{role: sfence, type: Core.SFence}]
      outputs: [{role: invalidate, type: MMU.L2TLBInvalidate}]
      when: &l2_sfence_matches_page
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.hart}"}}
        - node: nary
          op: or
          operands:
          - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: flush_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: all}}
          - node: nary
            op: and
            operands:
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: flush_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: vpn}}
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: vpn, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.vpn}"}}
          - node: nary
            op: and
            operands:
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: flush_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: asid}}
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: asid, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.asid}"}}
          - node: nary
            op: and
            operands:
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: flush_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: vpn_asid}}
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: vpn, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.vpn}"}}
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: asid, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.asid}"}}
          - node: nary
            op: and
            operands:
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: flush_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: hfence_vvma}}
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: vpn, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.vpn}"}}
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: asid, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.asid}"}}
            - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${page.translation_stage}"}, right: {node: literal, sort: {name: string}, value: all}}
          - node: nary
            op: and
            operands:
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: flush_kind, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: hfence_gvma}}
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: vpn, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.vpn}"}}
            - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: vmid, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.vmid}"}}
            - node: nary
              op: or
              operands:
              - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${page.translation_stage}"}, right: {node: literal, sort: {name: string}, value: all}}
              - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${page.translation_stage}"}, right: {node: literal, sort: {name: string}, value: s2}}
      output_when:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: invalidate, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: invalidate, field: tlb_instance, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${page.tlb_instance}"}}
      ensure:
      - {node: binary, op: eq, left: {node: event_field, event_id: sfence, field: op_id, sort: {name: op_id}}, right: {node: event_field, event_id: invalidate, field: fence_id, sort: {name: op_id}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: sfence, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: invalidate, field: cycle, sort: {name: int}}}
      state_updates:
      - {state: "L2TLB.entry[${page.tlb_instance}.${page.map_id}].valid", at: invalidate, value: {node: literal, sort: {name: bool}, value: false}}
      exact: true
      tags: [l2tlb, sfence, hfence, invalidate, source:L2TLB.scala:81-100]

repeat_product:
- axes:
  - {over: backend_requests, as: op}
  - {over: pages, as: page}
  include:
    slots:
    - id: l2tlb_lookup_${product.repeat_index}
      type: MMU.L2TLBLookup
      required: false
      fields: &l2_lookup_fields
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        map_id: ${page.map_id}
        vpn: ${op.vpn}
        asid: ${op.asid}
        vmid: ${op.vmid}
        access_kind: ${op.access_kind}
        translation_stage: ${op.translation_stage}
        hit: {$expr: {node: symbol, name: "l2tlb::${op.txn_id}::hit", sort: {name: bool}}}
    - id: l2tlb_hit_${product.repeat_index}
      type: MMU.L2TLBHit
      required: false
      fields: *l2_lookup_fields
    - id: l2tlb_miss_${product.repeat_index}
      type: MMU.L2TLBMiss
      required: false
      fields:
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        map_id: ${page.map_id}
        vpn: ${op.vpn}
        asid: ${op.asid}
        vmid: ${op.vmid}
        access_kind: ${op.access_kind}
        translation_stage: ${op.translation_stage}
    - id: ptw_s1_walk_${product.repeat_index}
      type: MMU.PTWWalk
      required: false
      fields: &s1_walk_fields
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        map_id: ${page.map_id}
        vpn: ${op.vpn}
        asid: ${op.asid}
        vmid: ${op.vmid}
        access_kind: ${op.access_kind}
        translation_stage: ${op.translation_stage}
        stage: s1
        walk_source: l2_s1
        level: ${page.page_level}
    - id: ptw_s1_complete_${product.repeat_index}
      type: MMU.PTWStageComplete
      required: false
      fields: *s1_walk_fields
    - id: ptw_s2_walk_from_s1_${product.repeat_index}
      type: MMU.PTWWalk
      required: false
      fields: &s2_walk_fields
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        map_id: ${page.map_id}
        vpn: ${op.vpn}
        gpaddr: ${page.gpaddr}
        asid: ${op.asid}
        vmid: ${op.vmid}
        access_kind: ${op.access_kind}
        translation_stage: ${op.translation_stage}
        stage: s2
        walk_source: s1_complete
        level: ${page.page_level}
    - id: ptw_s2_only_walk_${product.repeat_index}
      type: MMU.PTWWalk
      required: false
      fields:
        <<: *s2_walk_fields
        walk_source: l2_s2
    - id: ptw_s2_complete_${product.repeat_index}
      type: MMU.PTWStageComplete
      required: false
      fields: *s2_walk_fields
    - id: ptw_resolved_l2_${product.repeat_index}
      type: MMU.PTWResolved
      required: false
      fields: &resolved_fields
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        map_id: ${page.map_id}
        vpn: ${op.vpn}
        gpaddr: ${page.gpaddr}
        paddr: ${page.paddr}
        asid: ${op.asid}
        vmid: ${op.vmid}
        access_kind: ${op.access_kind}
        translation_stage: ${op.translation_stage}
        resolution_source: l2
        level: ${page.page_level}
    - id: ptw_resolved_s1_${product.repeat_index}
      type: MMU.PTWResolved
      required: false
      fields:
        <<: *resolved_fields
        resolution_source: s1
    - id: ptw_resolved_s2_${product.repeat_index}
      type: MMU.PTWResolved
      required: false
      fields:
        <<: *resolved_fields
        resolution_source: s2
    - id: ptw_page_fault_walk_${product.repeat_index}
      type: MMU.TranslationFault
      required: false
      fields: &page_fault_fields
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        map_id: ${page.map_id}
        region_id: {$expr: {node: symbol, name: "fault::${op.txn_id}::region", sort: {name: op_id}}}
        vpn: ${op.vpn}
        paddr: ${page.paddr}
        gpaddr: ${page.gpaddr}
        asid: ${op.asid}
        vmid: ${op.vmid}
        access_kind: ${op.access_kind}
        translation_stage: ${op.translation_stage}
        stage: s1
        fault: true
        fault_source: s1_walk
        cause: "${op.access_kind}_page_fault"
    - id: ptw_page_fault_l2_${product.repeat_index}
      type: MMU.TranslationFault
      required: false
      fields:
        <<: *page_fault_fields
        fault_source: l2
    - id: ptw_guest_page_fault_walk_${product.repeat_index}
      type: MMU.TranslationFault
      required: false
      fields: &guest_fault_fields
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        map_id: ${page.map_id}
        region_id: {$expr: {node: symbol, name: "fault::${op.txn_id}::region", sort: {name: op_id}}}
        vpn: ${op.vpn}
        paddr: ${page.paddr}
        gpaddr: ${page.gpaddr}
        asid: ${op.asid}
        vmid: ${op.vmid}
        access_kind: ${op.access_kind}
        translation_stage: ${op.translation_stage}
        stage: s2
        fault: true
        fault_source: s2_walk
        cause: "${op.access_kind}_guest_page_fault"
    - id: ptw_guest_page_fault_l2_${product.repeat_index}
      type: MMU.TranslationFault
      required: false
      fields:
        <<: *guest_fault_fields
        fault_source: l2
    - id: ptw_page_fault_response_${product.repeat_index}
      type: MMU.PTWResponse
      required: false
      fields:
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        vaddr: ${op.vaddr}
        vpn: ${op.vpn}
        access_kind: ${op.access_kind}
        asid: ${op.asid}
        vmid: ${op.vmid}
        translation_stage: ${op.translation_stage}
        paddr: ${page.paddr}
        gpaddr: ${page.gpaddr}
        cacheable: false
        fault: true
        cause: "${op.access_kind}_page_fault"
    - id: ptw_guest_page_fault_response_${product.repeat_index}
      type: MMU.PTWResponse
      required: false
      fields:
        txn_id: ${op.txn_id}
        op_id: ${op.op_id}
        hart: ${op.hart}
        tlb_instance: ${op.tlb_instance}
        vaddr: ${op.vaddr}
        vpn: ${op.vpn}
        access_kind: ${op.access_kind}
        asid: ${op.asid}
        vmid: ${op.vmid}
        translation_stage: ${op.translation_stage}
        paddr: ${page.paddr}
        gpaddr: ${page.gpaddr}
        cacheable: false
        fault: true
        cause: "${op.access_kind}_guest_page_fault"
    transformations:
    - name: ptw_request_looks_up_l2_${product.repeat_index}
      inputs: [{role: request, type: MMU.PTWRequest}]
      outputs: [{role: lookup, type: MMU.L2TLBLookup}]
      when: &backend_request_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: request, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: request, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.op_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: request, field: hart, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.hart}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: request, field: tlb_instance, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${page.tlb_instance}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: request, field: vpn, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.vpn}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: request, field: asid, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.asid}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: request, field: vmid, sort: {name: int}}, right: {node: literal, sort: {name: int}, value: "${page.vmid}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: request, field: translation_stage, sort: {name: string}}, right: {node: literal, sort: {name: string}, value: "${page.translation_stage}"}}
      output_when: &l2_lookup_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: lookup, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: lookup, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: request, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: lookup, field: cycle, sort: {name: int}}}
      state_requirements:
      - {state: "L2TLB.entry[${page.tlb_instance}.${page.map_id}].valid", at: lookup, op: eq, value: {node: event_field, event_id: lookup, field: hit, sort: {name: bool}}}
      exact: true
      tags: [l2tlb, lookup, source:L2TLB.scala:220-241,320-420]
    - name: l2_lookup_hits_${product.repeat_index}
      inputs: [{role: lookup, type: MMU.L2TLBLookup}]
      outputs: [{role: hit, type: MMU.L2TLBHit}]
      when:
        node: nary
        op: and
        operands:
        - *l2_lookup_scope
        - {node: event_field, event_id: lookup, field: hit, sort: {name: bool}}
      output_when: &l2_hit_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: hit, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: hit, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: lookup, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: hit, field: cycle, sort: {name: int}}}
      exact: true
      tags: [l2tlb, hit, source:PageTableCache.scala:588-874]
    - name: l2_lookup_misses_${product.repeat_index}
      inputs: [{role: lookup, type: MMU.L2TLBLookup}]
      outputs: [{role: miss, type: MMU.L2TLBMiss}]
      when:
        node: nary
        op: and
        operands:
        - *l2_lookup_scope
        - {node: unary, op: not, operand: {node: event_field, event_id: lookup, field: hit, sort: {name: bool}}}
      output_when: &l2_miss_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: miss, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
        - {node: binary, op: eq, left: {node: event_field, event_id: miss, field: map_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${page.map_id}"}}
      ensure:
      - {node: binary, op: lt, left: {node: event_field, event_id: lookup, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: miss, field: cycle, sort: {name: int}}}
      exact: true
      tags: [l2tlb, miss, miss-queue, source:L2TLBMissQueue.scala:30-45]
    - name: l2_hit_resolves_valid_mapping_${product.repeat_index}
      inputs: [{role: hit, type: MMU.L2TLBHit}]
      outputs: [{role: resolved, type: MMU.PTWResolved}]
      when:
        node: nary
        op: and
        operands:
        - *l2_hit_scope
        - &mapping_valid
          node: nary
          op: or
          operands:
          - node: nary
            op: and
            operands:
            - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${page.translation_stage}"}, right: {node: literal, sort: {name: string}, value: s1}}
            - {node: literal, sort: {name: bool}, value: "${page.stage1_valid}"}
            - {node: literal, sort: {name: bool}, value: "${page.stage1_access_allowed}"}
          - node: nary
            op: and
            operands:
            - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${page.translation_stage}"}, right: {node: literal, sort: {name: string}, value: s2}}
            - {node: literal, sort: {name: bool}, value: "${page.stage2_valid}"}
            - {node: literal, sort: {name: bool}, value: "${page.stage2_access_allowed}"}
          - node: nary
            op: and
            operands:
            - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${page.translation_stage}"}, right: {node: literal, sort: {name: string}, value: all}}
            - {node: literal, sort: {name: bool}, value: "${page.stage1_valid}"}
            - {node: literal, sort: {name: bool}, value: "${page.stage1_access_allowed}"}
            - {node: literal, sort: {name: bool}, value: "${page.stage2_valid}"}
            - {node: literal, sort: {name: bool}, value: "${page.stage2_access_allowed}"}
      output_when: &resolved_l2_scope
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: resolved, field: txn_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${op.txn_id}"}}
