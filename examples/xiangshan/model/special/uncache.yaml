repeat_product:
- axes:
  - {over: buffer_entries, as: older}
  - {over: buffer_entries, as: younger}
  include:
    constraints:
    - node: binary
      op: implies
      left:
        node: nary
        op: and
        operands:
        - {node: binary, op: lt, left: {node: literal, sort: {name: int}, value: "${older.entry_order}"}, right: {node: literal, sort: {name: int}, value: "${younger.entry_order}"}}
        - {node: event_field, event_id: "uncache_memory_request_${younger.repeat_index}", field: occurs, sort: {name: bool}}
        - node: nary
          op: or
          operands:
          - {node: unary, op: not, operand: {node: literal, sort: {name: bool}, value: "${younger.outstanding_enabled}"}}
