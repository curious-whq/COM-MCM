        - {node: binary, op: lt, left: {node: event_field, event_id: "uncache_return_${older.repeat_index}", field: cycle, sort: {name: int}}, right: {node: event_field, event_id: "uncache_memory_request_${younger.repeat_index}", field: cycle, sort: {name: int}}}
