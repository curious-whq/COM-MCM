        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: event_field, event_id: writeback, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
        - node: nary
          op: or
          operands:
          - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${access.mem_kind}"}, right: {node: literal, sort: {name: string}, value: load}}
          - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${access.region}"}, right: {node: literal, sort: {name: string}, value: mmio}}
      ensure:
      - node: binary
        op: implies
        left: {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${access.mem_kind}"}, right: {node: literal, sort: {name: string}, value: load}}
        right: {node: binary, op: eq, left: {node: event_field, event_id: writeback, field: value, sort: {name: value, width: 64}}, right: {node: event_field, event_id: response, field: value, sort: {name: value, width: 64}}}
      - {node: binary, op: lt, left: {node: event_field, event_id: wakeup, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: writeback, field: cycle, sort: {name: int}}}
