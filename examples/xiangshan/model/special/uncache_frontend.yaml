    - name: denied_or_corrupt_uncache_response_faults_${access.repeat_index}
      inputs:
      - {role: wakeup, type: Uncache.FrontendWakeup}
      - {role: response, type: Uncache.Response}
      outputs: [{role: fault, type: Core.MemoryFault}]
      when:
        node: nary
        op: and
