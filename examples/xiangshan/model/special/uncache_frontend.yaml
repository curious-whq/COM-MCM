    - name: derived_cancel_marks_frontend_cancelled_${access.repeat_index}
      inputs: [{role: cancel, type: Uncache.FrontendCancel}]
      outputs: []
      when: {node: binary, op: eq, left: {node: event_field, event_id: cancel, field: op_id, sort: {name: op_id}}, right: {node: literal, sort: {name: op_id}, value: "${access.op_id}"}}
      state_updates:
      - {state: "UncacheFrontend[${access.op_id}].cancelled", at: cancel, value: {node: literal, sort: {name: bool}, value: true}}
