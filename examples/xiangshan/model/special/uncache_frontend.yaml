    constraints:
    - node: nary
      op: or
      operands:
      - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${access.region}"}, right: {node: literal, sort: {name: string}, value: cacheable}}
      - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${access.region}"}, right: {node: literal, sort: {name: string}, value: nc}}
      - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${access.region}"}, right: {node: literal, sort: {name: string}, value: mmio}}
    - {node: binary, op: eq, left: {node: literal, sort: {name: bool}, value: "${access.cacheable}"}, right: {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${access.region}"}, right: {node: literal, sort: {name: string}, value: cacheable}}}
    - {node: binary, op: eq, left: {node: literal, sort: {name: bool}, value: "${access.nc}"}, right: {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${access.region}"}, right: {node: literal, sort: {name: string}, value: nc}}}
    - {node: binary, op: eq, left: {node: literal, sort: {name: bool}, value: "${access.mmio}"}, right: {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${access.region}"}, right: {node: literal, sort: {name: string}, value: mmio}}}
    - node: binary
      op: implies
      left: {node: unary, op: not, operand: {node: literal, sort: {name: bool}, value: "${access.cacheable}"}}
      right: {node: literal, sort: {name: bool}, value: "${access.aligned}"}

- over: issued_memory_ops
  as: op
  include:
    slots:
    - id: frontend_commit_marker_${op.repeat_index}
      type: Core.MemoryCommit
      required: false
      fields: {op_id: "${op.op_id}", hart: "${op.hart}", rob_idx: "${op.rob_idx}", mem_kind: "${op.mem_kind}"}

repeat_product:
- axes:
  - {over: issued_memory_ops, as: older}
  - {over: accesses, as: target}
  include:
    constraints:
    - node: binary
      op: implies
      left:
        node: nary
        op: and
        operands:
        - {node: binary, op: eq, left: {node: literal, sort: {name: string}, value: "${target.region}"}, right: {node: literal, sort: {name: string}, value: mmio}}
        - {node: binary, op: eq, left: {node: literal, sort: {name: int}, value: "${older.hart}"}, right: {node: literal, sort: {name: int}, value: "${target.hart}"}}
        - {node: binary, op: lt, left: {node: literal, sort: {name: int}, value: "${older.program_index}"}, right: {node: literal, sort: {name: int}, value: "${target.program_index}"}}
        - {node: event_field, event_id: "frontend_request_${target.repeat_index}", field: occurs, sort: {name: bool}}
      right:
        node: nary
        op: and
        operands:
        - {node: event_field, event_id: "frontend_commit_marker_${older.repeat_index}", field: occurs, sort: {name: bool}}
        - {node: binary, op: lt, left: {node: event_field, event_id: "frontend_commit_marker_${older.repeat_index}", field: cycle, sort: {name: int}}, right: {node: event_field, event_id: "frontend_request_${target.repeat_index}", field: cycle, sort: {name: int}}}
