            then: {node: literal, sort: {name: string}, value: load_access_fault}
            else: {node: literal, sort: {name: string}, value: store_access_fault}
          else: {node: literal, sort: {name: string}, value: hardware_error}
      - {node: binary, op: lt, left: {node: event_field, event_id: wakeup, field: cycle, sort: {name: int}}, right: {node: event_field, event_id: fault, field: cycle, sort: {name: int}}}
      state_updates:
      - {state: "UncacheFrontend[${access.op_id}].core_completed", at: fault, value: {node: literal, sort: {name: bool}, value: true}}
      exact: true
      tags: [uncache, access-fault, hardware-error, source:LoadQueueUncache.scala:192-239,NewStoreQueue.scala:1043-1066]
    - name: redirect_cancels_live_uncache_frontend_${access.repeat_index}
      inputs:
