schema_version: umcm.events.v0.1
metadata:
  model: boom-v4-load-load-seed
  description: >-
    BOOM Load-Load witness event catalog through LSU retry translation and the
    LSU-to-DCache request-acceptance transition. valid, ready, and fire are
    interface observations consumed by ordinary Transformation rules. Later
    iterations add probe, response, order-failure and architectural execution-graph events.
events:
  - name: Arch.InitWrite
    module: Architecture
    layer: architectural
    visibility: architectural
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: address
        sort: {name: address, width: 64}
      - name: value
        sort: {name: value, width: 64}

  - name: Arch.Load
    module: Architecture
    layer: architectural
    visibility: architectural
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: hart
        sort: int
      - name: program_index
        sort: int
      - name: address
        sort: {name: address, width: 64}
      - name: value
        sort: {name: value, width: 64}
        required: false

  - name: Arch.Store
    module: Architecture
    layer: architectural
    visibility: architectural
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: hart
        sort: int
      - name: program_index
        sort: int
      - name: address
        sort: {name: address, width: 64}
      - name: value
        sort: {name: value, width: 64}

  - name: Arch.CommitLoad
    module: ROB
    layer: architectural-boundary
    visibility: public
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: value
        sort: {name: value, width: 64}

  - name: LSU.TLBMiss
    module: LSU
    layer: lsu
    visibility: internal
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: ldq_idx
        sort: {name: bv, width: 6}
        required: false
      - name: vaddr
        sort: {name: address, width: 64}
        required: false

  - name: LSU.RetryEnqueue
    module: LSU
    layer: lsu
    visibility: internal
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: ldq_idx
        sort: {name: bv, width: 6}
        required: false
      - name: vaddr
        sort: {name: address, width: 64}
        required: false

  - name: LSU.RetryIssue
    module: LSU
    layer: lsu
    visibility: internal
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: ldq_idx
        sort: {name: bv, width: 6}
        required: false
      - name: vaddr
        sort: {name: address, width: 64}
        required: false

  - name: LSU.TLBHit
    module: LSU
    layer: lsu
    visibility: internal
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: ldq_idx
        sort: {name: bv, width: 6}
      - name: vaddr
        sort: {name: address, width: 64}
      - name: paddr
        sort: {name: address, width: 64}

  - name: LSU.DCacheReqValid
    module: LSU
    layer: lsu-dcache-interface
    visibility: public
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: ldq_idx
        sort: {name: bv, width: 6}
      - name: address
        sort: {name: address, width: 64}
      - name: port
        sort: int

  - name: DCache.ReqReady
    module: DCache
    layer: lsu-dcache-interface
    visibility: public
    fields:
      - name: port
        sort: int

  - name: LSU.DCacheReqFire
    module: LSU+DCache
    layer: lsu-dcache-interface
    visibility: public
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: ldq_idx
        sort: {name: bv, width: 6}
      - name: address
        sort: {name: address, width: 64}
      - name: port
        sort: int

  - name: Core.BranchKill
    module: Core
    layer: control
    visibility: public
    fields:
      - name: op_id
        sort: op_id
        identity: true

  - name: Core.Exception
    module: Core
    layer: control
    visibility: public
    fields:
      - name: hart
        sort: int

  - name: DCache.LoadResponse
    module: DCache
    layer: l1
    visibility: public
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: address
        sort: {name: address, width: 64}
      - name: value
        sort: {name: value, width: 64}

  - name: DCache.ProbeRelease
    module: DCache
    layer: l1
    visibility: public
    fields:
      - name: address
        sort: {name: address, width: 64}

  - name: LSU.LoadObserved
    module: LSU
    layer: lsu
    visibility: internal
    fields:
      - name: op_id
        sort: op_id
        identity: true
      - name: address
        sort: {name: address, width: 64}
