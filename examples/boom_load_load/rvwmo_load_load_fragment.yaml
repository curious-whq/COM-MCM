schema_version: umcm.graph_model.v0.1
model: rvwmo-load-load-fragment-v0.7
metadata:
  scope: Same-address committed scalar loads and writes for the BOOM witness.
  limitation: This is a deliberately small RVWMO fragment, not a complete RVWMO implementation.
projection:
  init_write_event: Arch.InitWrite
  load_event: Arch.Load
  store_event: Arch.Store
  load_commit_event: Arch.CommitLoad
  id_field: op_id
  address_field: address
  value_field: value
  hart_field: hart
  program_index_field: program_index
  require_committed_loads: false
  rf_hints:
  - event_type: MSHR.GrantData
    read_id_field: op_id
    write_id_field: source_op_id
    address_field: address
    value_field: value
ppo_rules:
- load_load_different_write
derived_relations:
- name: hb
  op: union
  relations:
  - ppo
  - rfe
- name: ar
  op: union
  relations:
  - hb
  - fr
  - co
axioms:
- name: rvwmo_load_load_order_fragment
  kind: acyclic
  relations:
  - ppo
  - rfe
  - fr
  - co
  description: The witness must not contain an ordering cycle formed by preserved load-load order, external reads-from, coherence, and from-read.
