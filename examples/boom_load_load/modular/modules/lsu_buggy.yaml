        name: op_id
    right:
      node: literal
      sort:
        name: op_id
      value: L1
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: executed
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: executed
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: executed
      field: address
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: request
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: executed
      field: cycle
      sort:
        name: int
  state_requirements:
  - state: LSU.ldq.L1.valid
    at: executed
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.ldq.L1.addr_valid
    at: executed
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.ldq.L1.addr_is_virtual
    at: executed
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: false
  - state: LSU.ldq.L1.address
    at: executed
    op: eq
    value:
