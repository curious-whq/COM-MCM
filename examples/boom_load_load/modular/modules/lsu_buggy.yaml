      field: address
      sort:
        name: address
        width: 64
  state_updates:
  - state: LSU.ldq.L1.executed
    at: executed
    value:
      node: literal
      sort:
        name: bool
      value: true
  exact: true
  tags:
  - state
  - ldq
  - l1
  output_when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: executed
      field: op_id
      sort: &id001
        name: op_id
    right:
      node: literal
      sort: *id001
      value: L1
