    type: Arch.Load
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: literal
      sort:
        name: op_id
      value: L1
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: load
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: load
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: valid
      field: address
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: load
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
  tags:
  - causal-support
  - l1
- name: l1_accepted_request_marks_executed
  inputs:
  - role: request
    type: LSU.DCacheReqFire
  outputs:
  - role: executed
    type: LSU.LoadExecuted
  when:
    node: binary
    op: eq
    left:
      node: event_field
