schema_version: umcm.module.v0.9.0
name: lsu
metadata:
  variant: buggy
  stage: 9
  source: BOOM v4 LSU load/retry/order-failure abstraction
ports:
- name: arch_load
  direction: input
  event_type: Arch.Load
- name: commit_load
  direction: input
  event_type: Arch.CommitLoad
- name: branch_kill
  direction: input
  event_type: Core.BranchKill
- name: exception
  direction: input
  event_type: Core.Exception
- name: squash_load
  direction: input
  event_type: Core.SquashLoad
- name: dcache_req_ready
  direction: input
  event_type: DCache.ReqReady
- name: dcache_req_fire
  direction: input
  event_type: LSU.DCacheReqFire
- name: dcache_load_hit
  direction: input
  event_type: DCache.LoadHit
- name: dcache_load_response
  direction: input
  event_type: DCache.LoadResponse
- name: dcache_load_nack
  direction: input
  event_type: DCache.LoadNack
- name: dcache_load_miss
  direction: input
  event_type: DCache.LoadMiss
- name: dcache_probe_release
  direction: input
  event_type: DCache.ProbeRelease
- name: dcache_long_latency_response
  direction: input
  event_type: DCache.LongLatencyLoadResponse
- name: dcache_req_valid
  direction: output
  event_type: LSU.DCacheReqValid
- name: load_executed
  direction: output
  event_type: LSU.LoadExecuted
- name: load_succeeded
  direction: output
  event_type: LSU.LoadSucceeded
- name: memory_order_exception
  direction: output
  event_type: Core.MemoryOrderingException
slots:
- id: l0_tlb_miss
  type: LSU.TLBMiss
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
  cycle: 1
  annotations:
    role: causal_predecessor
- id: retry_enqueue_0
  type: LSU.RetryEnqueue
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
  cycle: 2
  annotations:
    role: state_write
- id: retry_issue_0
  type: LSU.RetryIssue
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
  cycle: 12
  annotations:
    role: state_read_and_dequeue
- id: l0_tlb_hit
  type: LSU.TLBHit
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
    paddr: x
  cycle: 12
  annotations:
    role: translated_retry
- id: dcache_req_valid_0
  type: LSU.DCacheReqValid
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
    port: 0
  cycle: 12
  annotations:
    role: interface_valid
- id: l1_dcache_req_valid
  type: LSU.DCacheReqValid
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    port: 0
  cycle: 4
- id: l1_load_executed
  type: LSU.LoadExecuted
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
  cycle: 5
- id: l1_load_succeeded
  type: LSU.LoadSucceeded
  required: true
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    value: 0
  cycle: 7
  annotations:
    role: query_goal_old_value
- id: l1_load_observed
  type: LSU.LoadObserved
  required: true
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
  cycle: 11
  annotations:
    role: query_goal_observed
- id: l0_ldld_search
  type: LSU.LDLDSearch
  required: true
  cycle: 13
  fields:
    searcher_op_id: L0
    searcher_ldq_idx: 0
    address: x
    port: 0
  annotations:
    role: query_goal
    source: older_retry_ldld_search
- id: l0_l1_ldld_conflict
  type: LSU.LDLDConflict
  required: true
  cycle: 13
  fields:
    older_op_id: L0
    older_ldq_idx: 0
    younger_op_id: L1
    younger_ldq_idx: 1
    address: x
  annotations:
    role: query_goal
    source: boom_ldld_guard
- id: ldld_assert_violation
  type: LSU.AssertViolation
  required: true
  cycle: 13
  fields:
    property: older_retry_found_observed_younger_load
    older_op_id: L0
    younger_op_id: L1
    address: x
  annotations:
    non_functional_monitor: true
- id: l1_order_fail
  type: LSU.LoadOrderFail
  required: false
  cycle: 13
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
- id: l0_load_executed
  type: LSU.LoadExecuted
  required: false
  cycle: 13
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
  annotations:
    role: l0_ldq_executed
- id: l0_load_succeeded
  type: LSU.LoadSucceeded
  required: true
  cycle: 17
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
    value: 1
  annotations:
    role: query_goal_new_value
state_variables:
- name: LSU.retry_queue.valid
  sort:
    name: bool
  initial: false
- name: LSU.retry_queue.op_id
  sort:
    name: op_id
  initial: EMPTY
- name: LSU.retry_queue.ldq_idx
  sort:
    name: bv
    width: 6
  initial: 63
- name: LSU.retry_queue.vaddr
  sort:
    name: address
    width: 64
  initial: EMPTY_ADDR
- name: LSU.ldq.L1.valid
  sort:
    name: bool
  initial: true
- name: LSU.ldq.L1.addr_valid
  sort:
    name: bool
  initial: true
- name: LSU.ldq.L1.addr_is_virtual
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.address
  sort:
    name: address
    width: 64
  initial: x
- name: LSU.ldq.L1.executed
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.succeeded
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.observed
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.value
  sort:
    name: value
    width: 64
  initial: UNSET_VALUE
- name: LSU.ldq.L1.order_fail
  sort:
    name: bool
  initial: false
  description: Whether the younger L1 entry has been marked as a memory-order failure.
- name: LSU.ldq.L1.squashed
  sort:
    name: bool
  initial: false
  description: Whether recovery has invalidated the dynamic younger load.
- name: LSU.ldq.L1.executing_now
  sort:
    name: bool
  initial: false
  description: Abstraction of s1_executing_loads(L1) at the older load search cycle.
- name: LSU.ldq.L0.valid
  sort:
    name: bool
  initial: true
- name: LSU.ldq.L0.executed
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L0.succeeded
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L0.value
  sort:
    name: value
    width: 64
  initial: UNSET_VALUE
transformations:
- name: dcache_valid_requires_retry_tlb_hit
  inputs:
  - role: valid
    type: LSU.DCacheReqValid
  outputs:
  - role: issue
    type: LSU.RetryIssue
  - role: hit
    type: LSU.TLBHit
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: literal
      sort:
        name: op_id
      value: L0
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: issue
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: hit
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: issue
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: hit
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: issue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: hit
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: vaddr
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: hit
      field: vaddr
      sort:
        name: address
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: hit
      field: paddr
      sort:
        name: address
        width: 64
  description: Only L0 in this witness is generated from the retry queue.
  tags:
  - causal-support
  - translation
- name: retry_issue_requires_enqueue
  inputs:
  - role: issue
    type: LSU.RetryIssue
  outputs:
  - role: enqueue
    type: LSU.RetryEnqueue
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: enqueue
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: enqueue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: vaddr
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: enqueue
      field: vaddr
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: enqueue
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: issue
      field: cycle
      sort:
        name: int
  tags:
  - causal-support
- name: retry_enqueue_requires_tlb_miss
  inputs:
  - role: enqueue
    type: LSU.RetryEnqueue
  outputs:
  - role: miss
    type: LSU.TLBMiss
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: enqueue
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: miss
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: enqueue
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: miss
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: enqueue
      field: vaddr
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: miss
      field: vaddr
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: miss
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: enqueue
      field: cycle
      sort:
        name: int
  tags:
  - causal-support
- name: retry_enqueue_writes_state
  inputs:
  - role: enqueue
    type: LSU.RetryEnqueue
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_requirements:
  - state: LSU.retry_queue.valid
    at: enqueue
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: false
  state_updates:
  - state: LSU.retry_queue.valid
    at: enqueue
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.retry_queue.op_id
    at: enqueue
    value:
      node: event_field
      event_id: enqueue
      field: op_id
      sort:
        name: op_id
  - state: LSU.retry_queue.ldq_idx
    at: enqueue
    value:
      node: event_field
      event_id: enqueue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - state: LSU.retry_queue.vaddr
    at: enqueue
    value:
      node: event_field
      event_id: enqueue
      field: vaddr
      sort:
        name: address
        width: 64
  tags:
  - state
  - retry-queue
- name: retry_issue_reads_and_dequeues_state
  inputs:
