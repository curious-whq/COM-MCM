      event_id: response
      field: value
      sort:
        name: value
        width: 64
    right:
      node: event_field
      event_id: succeeded
      field: value
      sort:
        name: value
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: response
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: succeeded
      field: cycle
      sort:
