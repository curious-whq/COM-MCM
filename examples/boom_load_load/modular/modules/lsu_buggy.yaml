    type: LSU.RetryIssue
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_requirements:
  - state: LSU.retry_queue.valid
    at: issue
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.retry_queue.op_id
    at: issue
    op: eq
    value:
      node: event_field
      event_id: issue
      field: op_id
      sort:
        name: op_id
  - state: LSU.retry_queue.ldq_idx
    at: issue
    op: eq
    value:
      node: event_field
      event_id: issue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - state: LSU.retry_queue.vaddr
    at: issue
    op: eq
    value:
      node: event_field
      event_id: issue
      field: vaddr
      sort:
        name: address
        width: 64
  state_updates:
  - state: LSU.retry_queue.valid
    at: issue
    value:
      node: literal
      sort:
        name: bool
      value: false
  tags:
  - state
  - retry-queue
- name: branch_kill_flushes_matching_retry
  inputs:
  - role: kill
    type: Core.BranchKill
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_requirements:
  - state: LSU.retry_queue.valid
    at: kill
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.retry_queue.op_id
    at: kill
    op: eq
    value:
      node: event_field
      event_id: kill
      field: op_id
      sort:
        name: op_id
  state_updates:
  - state: LSU.retry_queue.valid
    at: kill
    value:
      node: literal
      sort:
        name: bool
      value: false
  tags:
  - state
  - defense
- name: exception_flushes_retry_queue
  inputs:
  - role: exception
    type: Core.Exception
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_updates:
  - state: LSU.retry_queue.valid
    at: exception
    value:
      node: literal
      sort:
        name: bool
      value: false
  tags:
  - state
  - defense
- name: l1_request_requires_arch_load
  inputs:
  - role: valid
    type: LSU.DCacheReqValid
  outputs:
