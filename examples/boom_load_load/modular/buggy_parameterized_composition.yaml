  stage: 11
  purpose: Instantiate reusable LSU/L1/MSHR/Coherence/ROB templates plus generic per-load LDQ families from the input trace.
  legacy_monolith: ../load_load_buggy_mshr_completion.yaml
  parameterized: true
modules:
