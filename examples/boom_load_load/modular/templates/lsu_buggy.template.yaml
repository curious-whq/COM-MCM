schema_version: umcm.module.v0.10.0
name: lsu
metadata:
  variant: buggy
  stage: 10
  source: BOOM v4 LSU load/retry/order-failure abstraction
  parameterized: true
  template_parameters:
  - older_load.op_id
  - older_load.address
  - older_load.ldq_idx
  - older_load.mshr_id
  - younger_load.op_id
  - younger_load.ldq_idx
  - visible_store.op_id
  - visible_store.value
  - init_write.value
ports:
- name: arch_load
  direction: input
  event_type: Arch.Load
- name: commit_load
  direction: input
  event_type: Arch.CommitLoad
- name: branch_kill
  direction: input
  event_type: Core.BranchKill
- name: exception
  direction: input
  event_type: Core.Exception
- name: squash_load
  direction: input
  event_type: Core.SquashLoad
- name: dcache_req_ready
  direction: input
  event_type: DCache.ReqReady
- name: dcache_req_fire
  direction: input
  event_type: LSU.DCacheReqFire
- name: dcache_load_hit
  direction: input
  event_type: DCache.LoadHit
- name: dcache_load_response
  direction: input
  event_type: DCache.LoadResponse
- name: dcache_load_nack
  direction: input
  event_type: DCache.LoadNack
- name: dcache_load_miss
  direction: input
  event_type: DCache.LoadMiss
- name: dcache_probe_release
  direction: input
  event_type: DCache.ProbeRelease
- name: dcache_long_latency_response
  direction: input
  event_type: DCache.LongLatencyLoadResponse
- name: dcache_req_valid
  direction: output
  event_type: LSU.DCacheReqValid
- name: load_executed
  direction: output
  event_type: LSU.LoadExecuted
- name: load_succeeded
  direction: output
  event_type: LSU.LoadSucceeded
- name: memory_order_exception
  direction: output
  event_type: Core.MemoryOrderingException
slots:
- id: older_tlb_miss
  type: LSU.TLBMiss
  required: false
  fields:
    op_id: ${older_load.op_id}
    ldq_idx: ${older_load.ldq_idx}
    vaddr: ${older_load.address}
  cycle: 1
  annotations:
    role: causal_predecessor
- id: retry_enqueue_0
  type: LSU.RetryEnqueue
  required: false
  fields:
    op_id: ${older_load.op_id}
    ldq_idx: ${older_load.ldq_idx}
    vaddr: ${older_load.address}
  cycle: 2
  annotations:
    role: state_write
- id: retry_issue_0
  type: LSU.RetryIssue
  required: false
  fields:
    op_id: ${older_load.op_id}
    ldq_idx: ${older_load.ldq_idx}
    vaddr: ${older_load.address}
  cycle: 12
  annotations:
    role: state_read_and_dequeue
- id: older_tlb_hit
  type: LSU.TLBHit
  required: false
  fields:
    op_id: ${older_load.op_id}
    ldq_idx: ${older_load.ldq_idx}
    vaddr: ${older_load.address}
    paddr: ${older_load.address}
  cycle: 12
  annotations:
    role: translated_retry
- id: dcache_req_valid_0
  type: LSU.DCacheReqValid
  required: false
  fields:
    op_id: ${older_load.op_id}
    ldq_idx: ${older_load.ldq_idx}
    address: ${older_load.address}
    port: 0
  cycle: 12
  annotations:
    role: interface_valid
- id: younger_dcache_req_valid
  type: LSU.DCacheReqValid
  required: false
  fields:
    op_id: ${younger_load.op_id}
    ldq_idx: ${younger_load.ldq_idx}
    address: ${older_load.address}
    port: 0
  cycle: 4
- id: younger_load_executed
  type: LSU.LoadExecuted
  required: false
  fields:
    op_id: ${younger_load.op_id}
    ldq_idx: ${younger_load.ldq_idx}
    address: ${older_load.address}
  cycle: 5
- id: younger_load_succeeded
  type: LSU.LoadSucceeded
  required: true
  fields:
    op_id: ${younger_load.op_id}
    ldq_idx: ${younger_load.ldq_idx}
    address: ${older_load.address}
    value: 0
  cycle: 7
  annotations:
    role: query_goal_old_value
- id: younger_load_observed
  type: LSU.LoadObserved
  required: true
  fields:
    op_id: ${younger_load.op_id}
    ldq_idx: ${younger_load.ldq_idx}
    address: ${older_load.address}
  cycle: 11
  annotations:
    role: query_goal_observed
- id: older_ldld_search
  type: LSU.LDLDSearch
  required: true
  cycle: 13
  fields:
    searcher_op_id: ${older_load.op_id}
    searcher_ldq_idx: ${older_load.ldq_idx}
    address: ${older_load.address}
    port: 0
  annotations:
    role: query_goal
    source: older_retry_ldld_search
- id: older_younger_ldld_conflict
  type: LSU.LDLDConflict
  required: true
  cycle: 13
  fields:
    older_op_id: ${older_load.op_id}
    older_ldq_idx: ${older_load.ldq_idx}
    younger_op_id: ${younger_load.op_id}
    younger_ldq_idx: ${younger_load.ldq_idx}
    address: ${older_load.address}
  annotations:
    role: query_goal
    source: boom_ldld_guard
- id: ldld_assert_violation
  type: LSU.AssertViolation
  required: true
  cycle: 13
  fields:
    property: older_retry_found_observed_younger_load
    older_op_id: ${older_load.op_id}
    younger_op_id: ${younger_load.op_id}
    address: ${older_load.address}
  annotations:
    non_functional_monitor: true
- id: younger_order_fail
  type: LSU.LoadOrderFail
  required: false
  cycle: 13
  fields:
    op_id: ${younger_load.op_id}
    ldq_idx: ${younger_load.ldq_idx}
    address: ${older_load.address}
- id: older_load_executed
  type: LSU.LoadExecuted
  required: false
  cycle: 13
  fields:
    op_id: ${older_load.op_id}
    ldq_idx: ${older_load.ldq_idx}
    address: ${older_load.address}
  annotations:
    role: l0_ldq_executed
- id: older_load_succeeded
  type: LSU.LoadSucceeded
  required: true
  cycle: 17
  fields:
    op_id: ${older_load.op_id}
    ldq_idx: ${older_load.ldq_idx}
    address: ${older_load.address}
    value: 1
  annotations:
    role: query_goal_new_value
state_variables:
- name: LSU.retry_queue.valid
  sort:
    name: bool
  initial: false
- name: LSU.retry_queue.op_id
  sort:
    name: op_id
  initial: EMPTY
- name: LSU.retry_queue.ldq_idx
  sort:
    name: bv
    width: 6
  initial: 63
- name: LSU.retry_queue.vaddr
  sort:
    name: address
    width: 64
  initial: EMPTY_ADDR
- name: LSU.ldq[${younger_load.ldq_idx}].valid
  sort:
    name: bool
  initial: true
- name: LSU.ldq[${younger_load.ldq_idx}].addr_valid
  sort:
    name: bool
  initial: true
- name: LSU.ldq[${younger_load.ldq_idx}].addr_is_virtual
  sort:
    name: bool
  initial: false
- name: LSU.ldq[${younger_load.ldq_idx}].address
  sort:
    name: address
    width: 64
  initial: ${older_load.address}
- name: LSU.ldq[${younger_load.ldq_idx}].executed
  sort:
    name: bool
  initial: false
- name: LSU.ldq[${younger_load.ldq_idx}].succeeded
  sort:
    name: bool
  initial: false
- name: LSU.ldq[${younger_load.ldq_idx}].observed
  sort:
    name: bool
  initial: false
- name: LSU.ldq[${younger_load.ldq_idx}].value
  sort:
    name: value
    width: 64
  initial: UNSET_VALUE
- name: LSU.ldq[${younger_load.ldq_idx}].order_fail
  sort:
    name: bool
  initial: false
  description: Whether the younger ${younger_load.op_id} entry has been marked as a memory-order failure.
- name: LSU.ldq[${younger_load.ldq_idx}].squashed
  sort:
    name: bool
  initial: false
  description: Whether recovery has invalidated the dynamic younger load.
- name: LSU.ldq[${younger_load.ldq_idx}].executing_now
  sort:
    name: bool
  initial: false
  description: Abstraction of s1_executing_loads(${younger_load.op_id}) at the older load search cycle.
- name: LSU.ldq[${older_load.ldq_idx}].valid
  sort:
    name: bool
  initial: true
- name: LSU.ldq[${older_load.ldq_idx}].executed
  sort:
    name: bool
  initial: false
- name: LSU.ldq[${older_load.ldq_idx}].succeeded
  sort:
    name: bool
  initial: false
- name: LSU.ldq[${older_load.ldq_idx}].value
  sort:
    name: value
    width: 64
  initial: UNSET_VALUE
transformations:
- name: dcache_valid_requires_retry_tlb_hit
  inputs:
  - role: valid
    type: LSU.DCacheReqValid
  outputs:
  - role: issue
    type: LSU.RetryIssue
  - role: hit
    type: LSU.TLBHit
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: literal
      sort:
        name: op_id
      value: ${older_load.op_id}
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: issue
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: hit
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: issue
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: hit
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: issue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: hit
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: vaddr
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: hit
      field: vaddr
      sort:
        name: address
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: hit
      field: paddr
      sort:
        name: address
        width: 64
  description: Only ${older_load.op_id} in this witness is generated from the retry queue.
  tags:
  - causal-support
  - translation
- name: retry_issue_requires_enqueue
  inputs:
  - role: issue
    type: LSU.RetryIssue
  outputs:
  - role: enqueue
    type: LSU.RetryEnqueue
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: enqueue
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: enqueue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: vaddr
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: enqueue
      field: vaddr
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: enqueue
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: issue
      field: cycle
      sort:
        name: int
  tags:
  - causal-support
- name: retry_enqueue_requires_tlb_miss
  inputs:
  - role: enqueue
    type: LSU.RetryEnqueue
  outputs:
  - role: miss
    type: LSU.TLBMiss
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: enqueue
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: miss
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: enqueue
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: miss
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: enqueue
      field: vaddr
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: miss
      field: vaddr
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: miss
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: enqueue
      field: cycle
      sort:
        name: int
  tags:
  - causal-support
- name: retry_enqueue_writes_state
  inputs:
  - role: enqueue
    type: LSU.RetryEnqueue
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_requirements:
  - state: LSU.retry_queue.valid
    at: enqueue
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: false
  state_updates:
  - state: LSU.retry_queue.valid
    at: enqueue
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.retry_queue.op_id
    at: enqueue
    value:
      node: event_field
      event_id: enqueue
      field: op_id
      sort:
        name: op_id
  - state: LSU.retry_queue.ldq_idx
    at: enqueue
    value:
      node: event_field
      event_id: enqueue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - state: LSU.retry_queue.vaddr
    at: enqueue
    value:
      node: event_field
      event_id: enqueue
      field: vaddr
      sort:
        name: address
        width: 64
  tags:
  - state
  - retry-queue
- name: retry_issue_reads_and_dequeues_state
  inputs:
  - role: issue
    type: LSU.RetryIssue
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_requirements:
  - state: LSU.retry_queue.valid
    at: issue
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.retry_queue.op_id
    at: issue
    op: eq
    value:
      node: event_field
      event_id: issue
      field: op_id
      sort:
        name: op_id
  - state: LSU.retry_queue.ldq_idx
    at: issue
    op: eq
    value:
      node: event_field
      event_id: issue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - state: LSU.retry_queue.vaddr
    at: issue
    op: eq
    value:
      node: event_field
      event_id: issue
      field: vaddr
      sort:
        name: address
        width: 64
  state_updates:
  - state: LSU.retry_queue.valid
    at: issue
    value:
      node: literal
      sort:
        name: bool
      value: false
  tags:
  - state
  - retry-queue
- name: branch_kill_flushes_matching_retry
  inputs:
  - role: kill
    type: Core.BranchKill
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_requirements:
  - state: LSU.retry_queue.valid
    at: kill
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.retry_queue.op_id
    at: kill
    op: eq
    value:
      node: event_field
      event_id: kill
      field: op_id
      sort:
        name: op_id
  state_updates:
  - state: LSU.retry_queue.valid
    at: kill
    value:
      node: literal
      sort:
        name: bool
      value: false
  tags:
  - state
  - defense
- name: exception_flushes_retry_queue
  inputs:
  - role: exception
    type: Core.Exception
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_updates:
  - state: LSU.retry_queue.valid
    at: exception
    value:
      node: literal
      sort:
        name: bool
      value: false
  tags:
  - state
  - defense
- name: younger_request_requires_arch_load
  inputs:
  - role: valid
    type: LSU.DCacheReqValid
  outputs:
  - role: load
    type: Arch.Load
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: literal
      sort:
        name: op_id
      value: ${younger_load.op_id}
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: load
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: load
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: valid
      field: address
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: load
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
  tags:
  - causal-support
  - l1
- name: younger_accepted_request_marks_executed
  inputs:
  - role: request
    type: LSU.DCacheReqFire
  outputs:
  - role: executed
    type: LSU.LoadExecuted
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: op_id
      sort:
        name: op_id
    right:
      node: literal
      sort:
        name: op_id
      value: ${younger_load.op_id}
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: executed
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: executed
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: request
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: executed
      field: address
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: request
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: executed
      field: cycle
      sort:
        name: int
  state_requirements:
  - state: LSU.ldq[${younger_load.ldq_idx}].valid
    at: executed
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.ldq[${younger_load.ldq_idx}].addr_valid
    at: executed
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.ldq[${younger_load.ldq_idx}].addr_is_virtual
    at: executed
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: false
  - state: LSU.ldq[${younger_load.ldq_idx}].address
    at: executed
    op: eq
    value:
      node: event_field
      event_id: executed
      field: address
      sort:
        name: address
        width: 64
  state_updates:
  - state: LSU.ldq[${younger_load.ldq_idx}].executed
    at: executed
    value:
      node: literal
      sort:
        name: bool
      value: true
  exact: true
  tags:
  - state
  - ldq
  - l1
  output_when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: executed
      field: op_id
      sort:
        name: op_id
    right:
      node: literal
      sort:
        name: op_id
      value: ${younger_load.op_id}
- name: younger_response_marks_succeeded
  inputs:
  - role: response
    type: DCache.LoadResponse
  outputs:
  - role: succeeded
    type: LSU.LoadSucceeded
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: response
      field: op_id
      sort:
        name: op_id
    right:
      node: literal
      sort:
        name: op_id
