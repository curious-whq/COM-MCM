    node: nary
    op: and
    operands:
    - node: binary
      op: lt
      left:
        node: event_field
        event_id: retry_enqueue_0
        field: cycle
        sort:
          name: int
      right:
        node: event_field
        event_id: branch_kill_0
        field: cycle
        sort:
          name: int
    - node: binary
      op: lt
      left:
        node: event_field
        event_id: branch_kill_0
        field: cycle
        sort:
          name: int
      right:
        node: event_field
        event_id: retry_issue_0
        field: cycle
        sort:
          name: int
- node: binary
  op: implies
  left:
    node: event_field
    event_id: exception_0
    field: occurs
    sort:
      name: bool
  right:
    node: nary
    op: and
    operands:
    - node: binary
      op: lt
      left:
        node: event_field
        event_id: retry_enqueue_0
        field: cycle
        sort:
          name: int
      right:
        node: event_field
