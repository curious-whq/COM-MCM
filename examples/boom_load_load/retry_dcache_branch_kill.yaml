        field: cycle
        sort:
          name: int
    - node: binary
      op: lt
      left:
        node: event_field
        event_id: exception_0
        field: cycle
        sort:
          name: int
      right:
        node: event_field
        event_id: retry_issue_0
        field: cycle
        sort:
          name: int
handshakes:
- name: lsu_dcache_req
  valid_type: LSU.DCacheReqValid
  ready_type: DCache.ReqReady
  fire_type: LSU.DCacheReqFire
  payload_fields:
  - op_id
  - ldq_idx
  - address
  - port
  description: Fire iff matching valid and ready observations occur on one port in
    the same logical cycle.
