    sort:
      name: int
- node: binary
  op: lt
  left:
    node: event_field
    event_id: retry_enqueue_0
    field: cycle
    sort:
      name: int
  right:
    node: event_field
    event_id: load_l1
    field: cycle
    sort:
      name: int
- node: binary
  op: lt
  left:
    node: event_field
    event_id: load_l1
    field: cycle
    sort:
      name: int
