schema_version: umcm.completion.v0.6.0
horizon: 20
metadata:
  model: boom-load-load-fixed-full-witness-v0.6
  purpose: Use the same L0 MSHR path while the corrected order-fail recovery squashes L1.
  stage: 6
  mshr_path: L0 miss -> primary MSHR accept/RPQ retain -> AcquireBlock -> GrantData(1) -> refill complete
    -> s_drain_rpq_loads -> long-latency response -> commit.
slots:
- id: l0_tlb_miss
  type: LSU.TLBMiss
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
  cycle: 1
  annotations:
    role: causal_predecessor
- id: retry_enqueue_0
  type: LSU.RetryEnqueue
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
  cycle: 2
  annotations:
    role: state_write
- id: retry_issue_0
  type: LSU.RetryIssue
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
  cycle: 12
  annotations:
    role: state_read_and_dequeue
- id: l0_tlb_hit
  type: LSU.TLBHit
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
    paddr: x
  cycle: 12
  annotations:
    role: translated_retry
- id: dcache_req_valid_0
  type: LSU.DCacheReqValid
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
    port: 0
  cycle: 12
  annotations:
    role: interface_valid
- id: dcache_req_ready_0
  type: DCache.ReqReady
  required: false
  fields:
    port: 0
  cycle: 12
  annotations:
    role: interface_ready
- id: dcache_req_fire_0
  type: LSU.DCacheReqFire
  required: true
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
    port: 0
  cycle: 12
  annotations:
    role: query_goal
- id: branch_kill_0
  type: Core.BranchKill
  required: false
  fields:
    op_id: L0
  cycle: 3
  annotations:
    role: optional_defense
- id: exception_0
  type: Core.Exception
  required: false
  fields:
    hart: 0
  cycle: 3
  annotations:
    role: optional_defense
- id: l1_dcache_req_valid
  type: LSU.DCacheReqValid
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    port: 0
  cycle: 4
- id: l1_dcache_req_ready
  type: DCache.ReqReady
  required: false
  fields:
    port: 0
  cycle: 4
- id: l1_dcache_req_fire
  type: LSU.DCacheReqFire
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    port: 0
  cycle: 4
- id: l1_load_executed
  type: LSU.LoadExecuted
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
  cycle: 5
- id: l1_dcache_hit
  type: DCache.LoadHit
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    value: 0
    port: 0
  cycle: 6
- id: l1_dcache_response
  type: DCache.LoadResponse
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    value: 0
    port: 0
  cycle: 7
- id: l1_load_succeeded
  type: LSU.LoadSucceeded
  required: true
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    value: 0
  cycle: 7
  annotations:
    role: query_goal_old_value
- id: probe_receive_x
  type: DCache.ProbeReceive
  required: false
  fields:
    source_op_id: W1
    address: x
  cycle: 9
- id: probe_release_x
  type: DCache.ProbeRelease
  required: false
  fields:
    source_op_id: W1
    address: x
  cycle: 10
- id: l1_load_observed
  type: LSU.LoadObserved
  required: true
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
  cycle: 11
  annotations:
    role: query_goal_observed
- id: l1_dcache_nack
  type: DCache.LoadNack
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    port: 0
  cycle: 6
- id: l0_ldld_search
  type: LSU.LDLDSearch
  required: true
  cycle: 13
  fields:
    searcher_op_id: L0
    searcher_ldq_idx: 0
    address: x
    port: 0
  annotations:
    role: query_goal
    source: older_retry_ldld_search
- id: l0_l1_ldld_conflict
  type: LSU.LDLDConflict
  required: true
  cycle: 13
  fields:
    older_op_id: L0
    older_ldq_idx: 0
    younger_op_id: L1
    younger_ldq_idx: 1
    address: x
  annotations:
    role: query_goal
    source: boom_ldld_guard
- id: ldld_assert_violation
  type: LSU.AssertViolation
  required: false
  cycle: 13
  fields:
    property: older_retry_found_observed_younger_load
    older_op_id: L0
    younger_op_id: L1
    address: x
  annotations:
    non_functional_monitor: true
- id: l1_order_fail
  type: LSU.LoadOrderFail
  required: true
  cycle: 13
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
- id: l1_mem_order_exception
  type: Core.MemoryOrderingException
  required: true
  cycle: 14
  fields:
    op_id: L1
    ldq_idx: 1
    cause: MINI_EXCEPTION_MEM_ORDERING
- id: l1_squash
  type: Core.SquashLoad
  required: true
  cycle: 15
  fields:
    op_id: L1
    ldq_idx: 1
    reason: memory_ordering_exception
- id: l0_load_executed
  type: LSU.LoadExecuted
  required: false
  cycle: 13
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
  annotations:
    role: l0_ldq_executed
- id: l0_dcache_miss
  type: DCache.LoadMiss
  required: false
  cycle: 14
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
    port: 0
  annotations:
    role: selected_miss_path
- id: l0_mshr_primary_accept
  type: MSHR.PrimaryMissAccept
  required: false
  cycle: 14
  fields:
    mshr_id: 0
    op_id: L0
    ldq_idx: 0
    address: x
- id: l0_mshr_rpq_enqueue
  type: MSHR.RPQEnqueue
  required: false
  cycle: 14
  fields:
    mshr_id: 0
    op_id: L0
    ldq_idx: 0
    address: x
- id: l0_mshr_acquire
  type: MSHR.AcquireBlock
  required: false
  cycle: 15
  fields:
    mshr_id: 0
    op_id: L0
    address: x
- id: l0_mshr_grant_data
  type: MSHR.GrantData
  required: false
  cycle: 16
  fields:
    mshr_id: 0
    op_id: L0
    source_op_id: W1
    address: x
    value: 1
- id: l0_mshr_refill_complete
  type: MSHR.RefillComplete
  required: false
  cycle: 16
  fields:
    mshr_id: 0
    op_id: L0
    source_op_id: W1
    address: x
    value: 1
- id: l0_mshr_drain_rpq
  type: MSHR.DrainRPQLoad
  required: false
  cycle: 17
  fields:
    mshr_id: 0
    op_id: L0
    ldq_idx: 0
    address: x
    value: 1
- id: l0_long_latency_response
  type: DCache.LongLatencyLoadResponse
  required: false
  cycle: 17
  fields:
    mshr_id: 0
    op_id: L0
    ldq_idx: 0
    address: x
    value: 1
- id: l0_load_succeeded
  type: LSU.LoadSucceeded
  required: true
  cycle: 17
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
    value: 1
  annotations:
    role: query_goal_new_value
state_variables:
- name: LSU.retry_queue.valid
  sort:
    name: bool
  initial: false
- name: LSU.retry_queue.op_id
  sort:
    name: op_id
  initial: EMPTY
- name: LSU.retry_queue.ldq_idx
  sort:
    name: bv
    width: 6
  initial: 63
- name: LSU.retry_queue.vaddr
  sort:
    name: address
    width: 64
  initial: EMPTY_ADDR
- name: LSU.ldq.L1.valid
  sort:
    name: bool
  initial: true
- name: LSU.ldq.L1.addr_valid
  sort:
    name: bool
  initial: true
- name: LSU.ldq.L1.addr_is_virtual
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.address
  sort:
    name: address
    width: 64
  initial: x
- name: LSU.ldq.L1.executed
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.succeeded
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.observed
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.value
  sort:
    name: value
    width: 64
  initial: UNSET_VALUE
- name: DCache.probe.pending
  sort:
    name: bool
  initial: false
- name: DCache.probe.address
  sort:
    name: address
    width: 64
  initial: EMPTY_ADDR
- name: DCache.probe.source_op_id
  sort:
    name: op_id
  initial: EMPTY
- name: LSU.ldq.L1.order_fail
  sort:
    name: bool
  initial: false
  description: Whether the younger L1 entry has been marked as a memory-order failure.
- name: LSU.ldq.L1.squashed
  sort:
    name: bool
  initial: false
  description: Whether recovery has invalidated the dynamic younger load.
- name: LSU.ldq.L1.executing_now
  sort:
    name: bool
  initial: false
  description: Abstraction of s1_executing_loads(L1) at the older load search cycle.
- name: LSU.ldq.L0.valid
  sort:
    name: bool
  initial: true
- name: LSU.ldq.L0.executed
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L0.succeeded
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L0.value
  sort:
    name: value
    width: 64
  initial: UNSET_VALUE
- name: MSHR.0.state
  sort:
    name: string
  initial: INVALID
- name: MSHR.0.req_op_id
  sort:
    name: op_id
  initial: EMPTY
- name: MSHR.0.req_ldq_idx
  sort:
    name: bv
    width: 6
  initial: 63
- name: MSHR.0.req_address
  sort:
    name: address
    width: 64
  initial: EMPTY_ADDR
- name: MSHR.0.rpq_valid
  sort:
    name: bool
  initial: false
- name: MSHR.0.rpq_op_id
  sort:
    name: op_id
  initial: EMPTY
- name: MSHR.0.rpq_ldq_idx
  sort:
    name: bv
    width: 6
  initial: 63
- name: MSHR.0.rpq_address
  sort:
    name: address
    width: 64
  initial: EMPTY_ADDR
- name: MSHR.0.line_value
  sort:
    name: value
    width: 64
  initial: UNSET_VALUE
- name: MSHR.0.line_source_op_id
  sort:
    name: op_id
  initial: EMPTY
transformations:
- name: dcache_request_acceptance
  inputs:
  - role: valid
    type: LSU.DCacheReqValid
  - role: ready
    type: DCache.ReqReady
  outputs:
  - role: fire
    type: LSU.DCacheReqFire
  when:
    node: nary
    op: and
    operands:
    - node: binary
      op: eq
      left:
        node: event_field
        event_id: valid
        field: cycle
        sort:
          name: int
      right:
        node: event_field
        event_id: ready
        field: cycle
        sort:
          name: int
    - node: binary
      op: eq
      left:
        node: event_field
        event_id: valid
        field: port
        sort:
          name: int
      right:
        node: event_field
        event_id: ready
        field: port
        sort:
          name: int
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: valid
      field: address
      sort:
        name: address
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: port
      sort:
        name: int
    right:
      node: event_field
      event_id: valid
      field: port
      sort:
        name: int
  exact: true
  description: At one cycle and port, request valid plus receiver ready emits the accepted-request event.
    exact=true also requires every observed fire to be justified by such a valid/ready transition.
  tags:
  - interface-transition
  - definition
- name: dcache_valid_requires_retry_tlb_hit
  inputs:
  - role: valid
    type: LSU.DCacheReqValid
  outputs:
  - role: issue
    type: LSU.RetryIssue
  - role: hit
    type: LSU.TLBHit
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: literal
      sort:
        name: op_id
      value: L0
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: issue
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: hit
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: issue
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: hit
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: issue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: hit
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: vaddr
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: hit
      field: vaddr
      sort:
        name: address
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: hit
      field: paddr
      sort:
        name: address
        width: 64
  description: Only L0 in this witness is generated from the retry queue.
  tags:
  - causal-support
  - translation
- name: retry_issue_requires_enqueue
  inputs:
  - role: issue
    type: LSU.RetryIssue
  outputs:
  - role: enqueue
    type: LSU.RetryEnqueue
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: enqueue
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: enqueue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: vaddr
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: enqueue
      field: vaddr
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: enqueue
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: issue
      field: cycle
      sort:
        name: int
  tags:
  - causal-support
- name: retry_enqueue_requires_tlb_miss
  inputs:
  - role: enqueue
    type: LSU.RetryEnqueue
  outputs:
  - role: miss
    type: LSU.TLBMiss
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: enqueue
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: miss
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: enqueue
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: miss
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: enqueue
      field: vaddr
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: miss
      field: vaddr
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: miss
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: enqueue
      field: cycle
      sort:
        name: int
  tags:
  - causal-support
- name: retry_enqueue_writes_state
  inputs:
  - role: enqueue
    type: LSU.RetryEnqueue
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_requirements:
  - state: LSU.retry_queue.valid
    at: enqueue
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: false
  state_updates:
  - state: LSU.retry_queue.valid
    at: enqueue
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.retry_queue.op_id
    at: enqueue
    value:
      node: event_field
      event_id: enqueue
      field: op_id
      sort:
        name: op_id
  - state: LSU.retry_queue.ldq_idx
    at: enqueue
    value:
      node: event_field
      event_id: enqueue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - state: LSU.retry_queue.vaddr
    at: enqueue
    value:
      node: event_field
      event_id: enqueue
      field: vaddr
      sort:
        name: address
        width: 64
  tags:
  - state
  - retry-queue
- name: retry_issue_reads_and_dequeues_state
  inputs:
  - role: issue
    type: LSU.RetryIssue
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_requirements:
  - state: LSU.retry_queue.valid
    at: issue
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.retry_queue.op_id
    at: issue
    op: eq
    value:
      node: event_field
      event_id: issue
      field: op_id
      sort:
        name: op_id
  - state: LSU.retry_queue.ldq_idx
    at: issue
    op: eq
    value:
      node: event_field
      event_id: issue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - state: LSU.retry_queue.vaddr
    at: issue
    op: eq
    value:
      node: event_field
      event_id: issue
      field: vaddr
      sort:
        name: address
        width: 64
  state_updates:
  - state: LSU.retry_queue.valid
    at: issue
    value:
      node: literal
      sort:
        name: bool
      value: false
  tags:
  - state
  - retry-queue
- name: branch_kill_flushes_matching_retry
  inputs:
  - role: kill
    type: Core.BranchKill
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_requirements:
  - state: LSU.retry_queue.valid
    at: kill
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: true
  - state: LSU.retry_queue.op_id
    at: kill
    op: eq
    value:
      node: event_field
      event_id: kill
      field: op_id
      sort:
        name: op_id
  state_updates:
  - state: LSU.retry_queue.valid
    at: kill
    value:
      node: literal
      sort:
        name: bool
      value: false
  tags:
  - state
  - defense
- name: exception_flushes_retry_queue
  inputs:
