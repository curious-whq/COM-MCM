schema_version: umcm.trace.v0.1
partial: false
metadata:
  case: boom-load-load-ordering
  expected_architectural_outcome:
    L0: 1
    L1: 0
  note: Architectural observations are fixed here. Bounded completion models add hidden
    TLB, retry, probe, DCache and MSHR events in later iterations.
  completion:
    backend: finite
    horizon: 6
    model:
      model: boom-lsu-tlb-retry-goal-v0.2
      purpose: Ask for one hidden RetryIssue(L0) witness and complete the causal BOOM
        LSU prerequisites that support it. The required retry issue is a query goal,
        not a claim that every TLB miss must eventually be reissued.
    selected_slots:
    - l0_tlb_miss
    - retry_enqueue_0
    - retry_issue_0
events:
- id: init_x
  type: Arch.InitWrite
  occurs: true
  fields:
    op_id: InitX
    address: x
    value: 0
- id: load_l0
  type: Arch.Load
  occurs: true
  fields:
    op_id: L0
    hart: 0
    program_index: 0
    address: x
  cycle: 0
- id: load_l1
  type: Arch.Load
  occurs: true
  fields:
    op_id: L1
    hart: 0
    program_index: 1
    address: x
  cycle: 3
- id: store_w1
  type: Arch.Store
  occurs: true
  fields:
    op_id: W1
    hart: 1
    program_index: 0
    address: x
    value: 1
- id: commit_l0
  type: Arch.CommitLoad
  occurs: true
  fields:
    op_id: L0
    value: 1
- id: commit_l1
  type: Arch.CommitLoad
  occurs: true
  fields:
    op_id: L1
    value: 0
- id: l0_tlb_miss
  type: LSU.TLBMiss
  occurs: true
  fields:
    op_id: L0
  cycle: 1
  annotations:
    role: causal_predecessor
    completion_slot: true
    required_slot: false
    completed: true
- id: retry_enqueue_0
  type: LSU.RetryEnqueue
  occurs: true
  fields:
    op_id: L0
  cycle: 2
  annotations:
    role: causal_predecessor
    completion_slot: true
    required_slot: false
    completed: true
- id: retry_issue_0
  type: LSU.RetryIssue
  occurs: true
  fields:
    op_id: L0
  cycle: 4
  annotations:
    role: query_goal
    completion_slot: true
    required_slot: true
    completed: true
constraints:
- node: binary
  op: lt
  left:
    node: event_field
    event_id: load_l0
    field: cycle
    sort:
      name: int
  right:
    node: event_field
    event_id: load_l1
    field: cycle
    sort:
      name: int
- node: call
  function: same_address
  arguments:
  - node: event_field
    event_id: load_l0
    field: address
    sort:
      name: address
      width: 64
  - node: event_field
    event_id: load_l1
    field: address
    sort:
      name: address
      width: 64
  sort:
    name: bool
