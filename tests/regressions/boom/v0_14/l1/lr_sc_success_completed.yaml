            op_id: SC0
            address: x
            value: 2
            stq_idx: 3
          l1_store_hits:
          - event_id: sc
            event_type: Arch.Store
            op_id: SC0
            address: x
            value: 2
            stq_idx: 3
          l1_store_misses: []
          mshr_requests: []
