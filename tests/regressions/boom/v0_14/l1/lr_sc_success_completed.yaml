            op_id: LR0
            address: x
          sc_stores:
          - event_id: sc
            event_type: Arch.Store
            op_id: SC0
            address: x
        modules:
        - dcache
        connections: []
        generated_transformations: []
    selected_slots:
    - l1_ready_load_0
    - l1_fire_load_0
    - l1_meta_data_read_load_0
    - l1_s1_load_0
    - l1_s2_load_0
    - l1_hit_0
    - l1_s1_store_0
    - l1_s2_store_0
    - l1_store_hit_0
    - l1_store_ack_hit_0
    - l1_store_write_0
    - l1_lr_set_0
    state:
      initial:
        L1.probe.busy: false
        L1.probe.address: EMPTY_ADDR
        L1.writeback.busy: false
        L1.lrsc.valid: false
        L1.lrsc.address: EMPTY_ADDR
      final:
        L1.probe.busy: false
        L1.probe.address: EMPTY_ADDR
        L1.writeback.busy: false
        L1.lrsc.valid: false
        L1.lrsc.address: x
      steps:
      - cycle: 3
        before:
          L1.probe.busy: false
          L1.probe.address: EMPTY_ADDR
          L1.writeback.busy: false
          L1.lrsc.valid: false
          L1.lrsc.address: EMPTY_ADDR
        after:
          L1.probe.busy: false
          L1.probe.address: EMPTY_ADDR
          L1.writeback.busy: false
          L1.lrsc.valid: true
          L1.lrsc.address: x
        active_requirements: []
        active_updates:
        - transformation.l1_lr_sets_state_LR0.forward.0.l1_lr_set_0.instance.0.no-output.update.1
        - transformation.l1_lr_sets_state_LR0.forward.0.l1_lr_set_0.instance.0.no-output.update.0
        changes:
        - state: L1.lrsc.address
          before: EMPTY_ADDR
          after: x
          origins:
          - transformation.l1_lr_sets_state_LR0.forward.0.l1_lr_set_0.instance.0.no-output.update.1
        - state: L1.lrsc.valid
          before: false
          after: true
          origins:
          - transformation.l1_lr_sets_state_LR0.forward.0.l1_lr_set_0.instance.0.no-output.update.0
      - cycle: 7
        before:
          L1.probe.busy: false
          L1.probe.address: EMPTY_ADDR
          L1.writeback.busy: false
          L1.lrsc.valid: true
          L1.lrsc.address: x
        after:
          L1.probe.busy: false
          L1.probe.address: EMPTY_ADDR
          L1.writeback.busy: false
          L1.lrsc.valid: false
          L1.lrsc.address: x
        active_requirements: []
        active_updates:
        - transformation.l1_sc_clears_reservation_SC0.forward.0.sc_result.instance.0.no-output.update.0
        changes:
        - state: L1.lrsc.valid
          before: true
          after: false
          origins:
          - transformation.l1_sc_clears_reservation_SC0.forward.0.sc_result.instance.0.no-output.update.0
