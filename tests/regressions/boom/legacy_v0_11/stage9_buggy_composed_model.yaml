schema_version: umcm.completion.v0.9.0
horizon: 20
metadata:
  variant: buggy
  stage: 9
  purpose: Compose separately loaded LSU, DCache, MSHR, coherence and ROB models for
    the BOOM load-load witness.
  legacy_monolith: ../load_load_buggy_mshr_completion.yaml
  composition:
    name: boom-load-load-buggy-modular-v0.9
    modules:
    - lsu
    - dcache
    - mshr
    - coherence
    - rob
    connections:
    - name: core_arch_load_to_lsu
      mode: shared_event
      source: rob.arch_load
      target: lsu.arch_load
    - name: core_commit_load_to_lsu
      mode: shared_event
      source: rob.commit_load
      target: lsu.commit_load
    - name: core_branch_kill_to_lsu
      mode: shared_event
      source: rob.branch_kill
      target: lsu.branch_kill
    - name: core_exception_to_lsu
      mode: shared_event
      source: rob.exception
      target: lsu.exception
    - name: lsu_memory_order_exception_to_rob
      mode: shared_event
      source: lsu.memory_order_exception
      target: rob.memory_order_exception
    - name: rob_squash_to_lsu
      mode: shared_event
      source: rob.squash_load
      target: lsu.squash_load
    - name: lsu_request_valid_to_dcache
      mode: shared_event
      source: lsu.dcache_req_valid
      target: dcache.lsu_req_valid
    - name: dcache_ready_to_lsu
      mode: shared_event
      source: dcache.req_ready
      target: lsu.dcache_req_ready
    - name: dcache_accept_to_lsu
      mode: shared_event
      source: dcache.req_fire
      target: lsu.dcache_req_fire
    - name: lsu_executed_to_dcache
      mode: shared_event
      source: lsu.load_executed
      target: dcache.lsu_load_executed
    - name: dcache_hit_to_lsu
      mode: shared_event
      source: dcache.load_hit
      target: lsu.dcache_load_hit
    - name: dcache_hit_response_to_lsu
      mode: shared_event
      source: dcache.load_response
      target: lsu.dcache_load_response
    - name: dcache_nack_to_lsu
      mode: shared_event
      source: dcache.load_nack
      target: lsu.dcache_load_nack
    - name: dcache_probe_release_to_lsu
      mode: shared_event
      source: dcache.probe_release
      target: lsu.dcache_probe_release
    - name: dcache_long_latency_response_to_lsu
      mode: shared_event
      source: dcache.long_latency_response
      target: lsu.dcache_long_latency_response
    - name: dcache_miss_to_lsu
      mode: shared_event
      source: dcache.load_miss
      target: lsu.dcache_load_miss
    - name: dcache_miss_to_mshr
      mode: shared_event
      source: dcache.load_miss
      target: mshr.dcache_load_miss
    - name: mshr_drain_to_dcache
      mode: shared_event
      source: mshr.drain_rpq_load
      target: dcache.mshr_drain_rpq_load
    - name: core_store_to_coherence
      mode: shared_event
      source: rob.arch_store
      target: coherence.visible_store
    - name: dcache_probe_to_coherence
      mode: shared_event
      source: dcache.probe_receive
      target: coherence.probe_receive
    - name: mshr_grant_to_coherence
      mode: shared_event
      source: mshr.grant_data
      target: coherence.grant_data
    generated_transformations: []
