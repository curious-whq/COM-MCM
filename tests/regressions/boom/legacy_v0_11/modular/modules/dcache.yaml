      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: executed
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: hit
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: request
      field: address
      sort:
        name: address
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
