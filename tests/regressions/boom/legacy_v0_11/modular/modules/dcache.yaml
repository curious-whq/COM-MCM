schema_version: umcm.module.v0.9.0
name: dcache
metadata:
  variant: shared
  stage: 9
  source: BOOM v4 non-blocking DCache and ProbeUnit abstraction
ports:
- name: lsu_req_valid
  direction: input
  event_type: LSU.DCacheReqValid
- name: lsu_load_executed
  direction: input
  event_type: LSU.LoadExecuted
- name: mshr_drain_rpq_load
  direction: input
  event_type: MSHR.DrainRPQLoad
- name: req_ready
  direction: output
  event_type: DCache.ReqReady
- name: req_fire
  direction: output
  event_type: LSU.DCacheReqFire
- name: load_hit
  direction: output
  event_type: DCache.LoadHit
- name: load_response
  direction: output
  event_type: DCache.LoadResponse
- name: load_nack
  direction: output
  event_type: DCache.LoadNack
- name: probe_receive
  direction: output
  event_type: DCache.ProbeReceive
- name: probe_release
  direction: output
  event_type: DCache.ProbeRelease
- name: load_miss
  direction: output
  event_type: DCache.LoadMiss
- name: long_latency_response
  direction: output
  event_type: DCache.LongLatencyLoadResponse
slots:
- id: dcache_req_ready_0
  type: DCache.ReqReady
  required: false
  fields:
    port: 0
  cycle: 12
  annotations:
    role: interface_ready
- id: dcache_req_fire_0
  type: LSU.DCacheReqFire
  required: true
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
    port: 0
  cycle: 12
  annotations:
    role: query_goal
- id: l1_dcache_req_ready
  type: DCache.ReqReady
  required: false
  fields:
    port: 0
  cycle: 4
- id: l1_dcache_req_fire
  type: LSU.DCacheReqFire
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    port: 0
  cycle: 4
- id: l1_dcache_hit
  type: DCache.LoadHit
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    value: 0
    port: 0
  cycle: 6
- id: l1_dcache_response
  type: DCache.LoadResponse
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    value: 0
    port: 0
  cycle: 7
- id: probe_receive_x
  type: DCache.ProbeReceive
  required: false
  fields:
    source_op_id: W1
    address: x
  cycle: 9
- id: probe_release_x
  type: DCache.ProbeRelease
  required: false
  fields:
    source_op_id: W1
    address: x
  cycle: 10
- id: l1_dcache_nack
  type: DCache.LoadNack
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    port: 0
  cycle: 6
- id: l0_dcache_miss
  type: DCache.LoadMiss
  required: false
  cycle: 14
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
    port: 0
  annotations:
    role: selected_miss_path
- id: l0_long_latency_response
  type: DCache.LongLatencyLoadResponse
  required: false
  cycle: 17
  fields:
    mshr_id: 0
    op_id: L0
    ldq_idx: 0
    address: x
    value: 1
state_variables:
- name: DCache.probe.pending
  sort:
    name: bool
  initial: false
- name: DCache.probe.address
  sort:
    name: address
    width: 64
  initial: EMPTY_ADDR
- name: DCache.probe.source_op_id
  sort:
    name: op_id
  initial: EMPTY
transformations:
- name: dcache_request_acceptance
  inputs:
  - role: valid
    type: LSU.DCacheReqValid
  - role: ready
    type: DCache.ReqReady
  outputs:
  - role: fire
    type: LSU.DCacheReqFire
  when:
    node: nary
    op: and
    operands:
    - node: binary
      op: eq
      left:
        node: event_field
        event_id: valid
        field: cycle
        sort:
          name: int
      right:
        node: event_field
        event_id: ready
        field: cycle
        sort:
          name: int
    - node: binary
      op: eq
      left:
        node: event_field
        event_id: valid
        field: port
        sort:
          name: int
      right:
        node: event_field
        event_id: ready
        field: port
        sort:
          name: int
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: valid
      field: address
      sort:
        name: address
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: port
      sort:
        name: int
    right:
      node: event_field
      event_id: valid
      field: port
      sort:
        name: int
  exact: true
  description: At one cycle and port, request valid plus receiver ready emits the
    accepted-request event. exact=true also requires every observed fire to be justified
    by such a valid/ready transition.
  tags:
  - interface-transition
  - definition
