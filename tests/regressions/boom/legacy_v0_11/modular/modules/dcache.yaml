      field: port
      sort:
        name: int
    right:
      node: event_field
      event_id: request
      field: port
      sort:
        name: int
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: request
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: executed
      field: cycle
      sort:
        name: int
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: executed
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: hit
      field: cycle
      sort:
        name: int
  tags:
  - causal-support
  - dcache-hit
  - module-boundary
- name: successful_l1_hit_produces_response
