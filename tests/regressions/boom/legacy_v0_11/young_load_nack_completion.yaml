- id: l1_dcache_nack
  type: DCache.LoadNack
  required: true
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    port: 0
  cycle: 6
state_variables:
- name: LSU.retry_queue.valid
  sort:
    name: bool
  initial: false
- name: LSU.retry_queue.op_id
  sort:
    name: op_id
  initial: EMPTY
- name: LSU.retry_queue.ldq_idx
  sort:
    name: bv
    width: 6
  initial: 63
- name: LSU.retry_queue.vaddr
  sort:
    name: address
    width: 64
  initial: EMPTY_ADDR
- name: LSU.ldq.L1.valid
  sort:
    name: bool
  initial: true
- name: LSU.ldq.L1.addr_valid
  sort:
    name: bool
  initial: true
- name: LSU.ldq.L1.addr_is_virtual
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.address
  sort:
    name: address
    width: 64
  initial: x
- name: LSU.ldq.L1.executed
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.succeeded
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.observed
  sort:
    name: bool
  initial: false
- name: LSU.ldq.L1.value
  sort:
    name: value
    width: 64
  initial: UNSET_VALUE
- name: DCache.probe.pending
  sort:
    name: bool
  initial: false
- name: DCache.probe.address
  sort:
    name: address
    width: 64
  initial: EMPTY_ADDR
- name: DCache.probe.source_op_id
  sort:
    name: op_id
  initial: EMPTY
transformations:
- name: dcache_request_acceptance
  inputs:
  - role: valid
    type: LSU.DCacheReqValid
  - role: ready
    type: DCache.ReqReady
  outputs:
  - role: fire
    type: LSU.DCacheReqFire
  when:
    node: nary
    op: and
    operands:
    - node: binary
      op: eq
      left:
        node: event_field
        event_id: valid
        field: cycle
        sort:
          name: int
      right:
        node: event_field
        event_id: ready
        field: cycle
        sort:
          name: int
    - node: binary
      op: eq
      left:
        node: event_field
        event_id: valid
        field: port
        sort:
          name: int
      right:
        node: event_field
        event_id: ready
        field: port
        sort:
          name: int
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: valid
      field: address
      sort:
        name: address
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: fire
      field: port
      sort:
        name: int
    right:
      node: event_field
      event_id: valid
      field: port
      sort:
        name: int
  exact: true
  description: At one cycle and port, request valid plus receiver ready emits the
    accepted-request event. exact=true also requires every observed fire to be justified
    by such a valid/ready transition.
  tags:
  - interface-transition
  - definition
- name: dcache_valid_requires_retry_tlb_hit
  inputs:
  - role: valid
    type: LSU.DCacheReqValid
  outputs:
  - role: issue
    type: LSU.RetryIssue
  - role: hit
    type: LSU.TLBHit
  when:
    node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: literal
      sort:
        name: op_id
      value: L0
  ensure:
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: issue
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: hit
      field: cycle
      sort:
        name: int
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: issue
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: op_id
      sort:
        name: op_id
    right:
      node: event_field
      event_id: hit
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: issue
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: hit
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: issue
      field: vaddr
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: hit
      field: vaddr
      sort:
        name: address
        width: 64
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: valid
      field: address
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: hit
      field: paddr
      sort:
        name: address
        width: 64
  description: Only L0 in this witness is generated from the retry queue.
  tags:
  - causal-support
  - translation
