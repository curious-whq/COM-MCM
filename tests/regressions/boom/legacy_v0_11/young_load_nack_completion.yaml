  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
    port: 0
  cycle: 12
  annotations:
    role: interface_valid
- id: dcache_req_ready_0
  type: DCache.ReqReady
  required: false
  fields:
    port: 0
  cycle: 12
  annotations:
    role: interface_ready
- id: dcache_req_fire_0
  type: LSU.DCacheReqFire
  required: true
  fields:
    op_id: L0
    ldq_idx: 0
    address: x
    port: 0
  cycle: 12
  annotations:
    role: query_goal
- id: branch_kill_0
  type: Core.BranchKill
  required: false
  fields:
    op_id: L0
  cycle: 11
  annotations:
    role: optional_defense
- id: exception_0
  type: Core.Exception
  required: false
  fields:
    hart: 0
  cycle: 11
  annotations:
    role: optional_defense
- id: l1_dcache_req_valid
  type: LSU.DCacheReqValid
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    port: 0
  cycle: 4
- id: l1_dcache_req_ready
  type: DCache.ReqReady
  required: false
  fields:
    port: 0
  cycle: 4
- id: l1_dcache_req_fire
  type: LSU.DCacheReqFire
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    port: 0
  cycle: 4
- id: l1_load_executed
  type: LSU.LoadExecuted
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
  cycle: 5
- id: l1_dcache_hit
  type: DCache.LoadHit
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    value: 0
    port: 0
  cycle: 6
- id: l1_dcache_response
  type: DCache.LoadResponse
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    value: 0
    port: 0
  cycle: 7
- id: l1_load_succeeded
  type: LSU.LoadSucceeded
  required: false
  fields:
    op_id: L1
    ldq_idx: 1
    address: x
    value: 0
  cycle: 7
  annotations:
    role: query_goal_old_value
- id: probe_receive_x
  type: DCache.ProbeReceive
  required: false
  fields:
    source_op_id: W1
    address: x
  cycle: 9
- id: probe_release_x
  type: DCache.ProbeRelease
  required: false
  fields:
