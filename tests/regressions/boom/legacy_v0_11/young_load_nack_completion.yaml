schema_version: umcm.completion.v0.4.0
horizon: 14
metadata:
  model: boom-younger-load-nack-v0.4
  purpose: 'Exercise DCache nack: clear executed and never set succeeded.'
slots:
- id: l0_tlb_miss
  type: LSU.TLBMiss
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
  cycle: 1
  annotations:
    role: causal_predecessor
- id: retry_enqueue_0
  type: LSU.RetryEnqueue
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
  cycle: 2
  annotations:
    role: state_write
- id: retry_issue_0
  type: LSU.RetryIssue
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
  cycle: 12
  annotations:
    role: state_read_and_dequeue
- id: l0_tlb_hit
  type: LSU.TLBHit
  required: false
  fields:
    op_id: L0
    ldq_idx: 0
    vaddr: x
    paddr: x
  cycle: 12
  annotations:
    role: translated_retry
- id: dcache_req_valid_0
