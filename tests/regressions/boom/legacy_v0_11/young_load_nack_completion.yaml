        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: enqueue
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: issue
      field: cycle
      sort:
        name: int
  tags:
  - causal-support
- name: retry_enqueue_requires_tlb_miss
