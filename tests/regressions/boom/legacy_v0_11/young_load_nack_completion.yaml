    right:
      node: event_field
      event_id: miss
      field: op_id
      sort:
        name: op_id
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: enqueue
      field: ldq_idx
      sort:
        name: bv
        width: 6
    right:
      node: event_field
      event_id: miss
      field: ldq_idx
      sort:
        name: bv
        width: 6
  - node: binary
    op: eq
    left:
      node: event_field
      event_id: enqueue
      field: vaddr
      sort:
        name: address
        width: 64
    right:
      node: event_field
      event_id: miss
      field: vaddr
      sort:
        name: address
        width: 64
  - node: binary
    op: lt
    left:
      node: event_field
      event_id: miss
      field: cycle
      sort:
        name: int
    right:
      node: event_field
      event_id: enqueue
      field: cycle
      sort:
        name: int
  tags:
  - causal-support
- name: retry_enqueue_writes_state
  inputs:
  - role: enqueue
    type: LSU.RetryEnqueue
  outputs: []
  when:
    node: literal
    sort:
      name: bool
    value: true
  ensure: []
  state_requirements:
  - state: LSU.retry_queue.valid
    at: enqueue
    op: eq
    value:
      node: literal
      sort:
        name: bool
      value: false
  state_updates:
