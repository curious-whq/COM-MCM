[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umcm-foundation"
version = "0.21.0"
description = "A small IR foundation for hierarchical microarchitectural memory-model traces"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "µMCM project" }
]
dependencies = [
  "PyYAML>=6.0",
  "z3-solver>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
umcm = "umcm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
